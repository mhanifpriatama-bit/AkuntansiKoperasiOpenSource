<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDMP POS Sembako</title>
<style>
:root{--m:#C8102E;--g:#1F3864;--b:#d9dde5;--bg:#f5f6f8;--ok:#1a7f37;--no:#b42318}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1c1f26}
header{background:var(--g);color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header .st{margin-left:auto;font-size:12px;opacity:.85}
main{padding:12px;max-width:1100px;margin:0 auto}
h2{margin:6px 0 10px;font-size:17px}h3{margin:14px 0 6px;font-size:15px}
.card{background:#fff;border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:6px 0}
label{display:flex;flex-direction:column;font-size:12px;color:#555;gap:2px}
input,select,button{font:inherit}
input,select{padding:7px 8px;border:1px solid var(--b);border-radius:6px;min-width:0}
input.n{text-align:right;width:120px}input.s{width:80px}
button.p{background:var(--m);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button.x{background:#fff;border:1px solid var(--b);border-radius:6px;padding:7px 12px;cursor:pointer}
button.k{background:none;border:0;color:var(--no);cursor:pointer;padding:2px 6px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--b);padding:5px 8px;text-align:left;vertical-align:middle}
th{background:#eef0f4;font-size:12px}td.n,th.n{text-align:right}
.tot{font-size:20px;font-weight:600}.c{color:#667}.ok{color:var(--ok)}.no{color:var(--no)}
.galat{background:#fdecea;border:1px solid #f3b5ae;padding:8px 12px;border-radius:6px;margin:8px 0}
.info{background:#eaf3ff;border:1px solid #b6d4fe;padding:8px 12px;border-radius:6px;margin:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:600px){main{padding:8px}input.n{width:96px}}

header{position:relative}
.mn{position:relative}
#tglslot input{padding:5px 8px;border:0;border-radius:6px;font-size:14px}
#menu{background:#fff;color:var(--g);border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
#menupanel{position:absolute;left:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--b);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);min-width:220px;z-index:20;display:flex;flex-direction:column;padding:4px}
#menupanel[hidden]{display:none}
#menupanel button{border:0;background:none;text-align:left;padding:11px 14px;font:inherit;color:#1c1f26;border-radius:6px;cursor:pointer}
#menupanel button:hover{background:#eef0f4}#menupanel button.on{background:var(--m);color:#fff}
.scan{display:flex;gap:8px;align-items:end;flex-wrap:wrap;background:#fff7e6;border:1px solid #f3d9a4;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.scan input{flex:1;min-width:200px;font-size:16px}
#kam{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}
#sug{position:fixed;z-index:12;background:#fff;border:1px solid var(--b);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-height:260px;overflow:auto}
#sug[hidden]{display:none}#sug div{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:14px}
#sug div.on,#sug div:hover{background:var(--m);color:#fff}#sug .c{color:inherit;opacity:.7}
.kgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:900px){.kgrid{grid-template-columns:1fr}}
.struk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.4;background:#fff;border:1px dashed #aaa;padding:10px}
.struk .sh{text-align:center;font-weight:700;margin-bottom:6px}.struk .sl,.struk .sr{display:flex;justify-content:space-between;gap:8px}
.struk hr{border:0;border-top:1px dashed #888;margin:6px 0}.struk table{border:0}.struk th,.struk td{border:0;padding:1px 3px;background:none;font-size:12px}

#kam video{max-width:92vw;max-height:60vh;border-radius:8px;background:#000}

#mdl .box{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#mdl h2{margin:0 0 10px}#mdl .fm{display:flex;flex-direction:column;gap:10px}#mdl .fm input,#mdl .fm select{width:100%}#mdl .fm p{margin:0}

<body>
<header><h1>Aplikasi Kasir KDMP</h1><div class="mn"><button id="menu" data-a="menu" aria-haspopup="true" aria-expanded="false">&#9776; Menu</button><div id="menupanel" hidden></div></div><span id="tglslot"></span><span id="info"></span><span class="st" id="st"></span></header>
<main id="isi"></main>
<script>
/*
 * Mesin POS: mengubah daftar transaksi menjadi mutasi stok (FIFO) dan jurnal harian sesuai kontrak v1.1.
 * Murni logika, tanpa DOM. Masukan: state {tpl, barang, pelanggan, pemasok, tx}. Keluaran: hitung(state).
 *
 * Transaksi (semua punya id, tgl ISO, jenis):
 *   JUAL      {pelanggan?, item:[{k,q,harga}], tunai, bank, kredit}
 *   PELUNASAN {pelanggan, tunai, bank}
 *   BELI      {pemasok, faktur, item:[{k,q,h}], cara:'tunai'|'bank'|'kredit'}
 *   BAYAR     {pemasok, jumlah, dari:'tunai'|'bank'}
 *   RJUAL     {ref (id JUAL), pelanggan?, item:[{k,q}], cara:'tunai'|'bank'|'piutang'}
 *   RBELI     {ref (id BELI), item:[{k,q}], cara:'tunai'|'bank'|'utang'}
 *   OPNAME    {item:[{k,fisik}]}
 *   SETOR     {jumlah}
 */
(function (POS) {
  'use strict';
  const EPS = 1e-9;
  const bulat = (x) => Math.round(x + (x < 0 ? -1e-9 : 1e-9));
  const KOM = {
    anggota: 'Penerimaan Kas dari Pelayanan kepada Anggota',
    non: 'Penerimaan Kas dari Non Anggota',
    beli: 'Pembelian Harga Pokok Barang'
  };
  const PERINGKAT = { 'Saldo Awal': 0, Masuk: 1, Keluar: 2 };
  const tglNo = (d) => d.replace(/-/g, '');

  /** FIFO murni (sama dengan akuntansiApp). m: [{d,no,k,j,q,h,lot}], batas: ISO inklusif (opsional). */
  function fifo(m, batas) {
    const urut = m.map((t, i) => ({ t, i })).filter((x) => !batas || x.t.d <= batas)
      .sort((a, b) => (a.t.d < b.t.d ? -1 : a.t.d > b.t.d ? 1 : PERINGKAT[a.t.j] - PERINGKAT[b.t.j] || a.i - b.i));
    const per = {}; // k -> {q, lapisan:[{id,q,h}]}
    const biaya = new Map();
    const minus = new Set();
    urut.forEach(({ t }) => {
      const r = per[t.k] || (per[t.k] = { q: 0, lapisan: [] });
      if (t.j === 'Keluar') {
        let sisa = t.q, nilai = 0;
        const ambil = (l) => { const x = Math.min(sisa, l.q); if (x > 0) { nilai += x * l.h; l.q -= x; sisa -= x; } };
        if (t.lot) r.lapisan.filter((l) => l.id === t.lot).forEach(ambil);
        r.lapisan.forEach(ambil);
        r.lapisan = r.lapisan.filter((l) => l.q > EPS);
        if (sisa > EPS) minus.add(t.k);
        r.q -= t.q;
        biaya.set(t, bulat(nilai));
      } else {
        r.q += t.q;
        if (t.q > 0) r.lapisan.push({ id: t.no || '', q: t.q, h: t.h });
      }
    });
    return { per, biaya, minus };
  }

  const urutTx = (tx) => tx.slice().sort((a, b) => (a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : a.urut - b.urut));
  const jumlahItem = (items, f) => items.reduce((s, x) => s + f(x), 0);
  const totalJual = (t) => jumlahItem(t.item, (x) => bulat(x.q * x.harga));

  /** Status anggota pelanggan; transaksi tanpa pelanggan = non-anggota. */
  const anggota = (S, id) => { const p = S.pelanggan.find((x) => x.id === id); return !!(p && p.anggota); };
  const akunBarang = (S, k) => { const b = S.barang.find((x) => x.k === k); return (b && b.akun) || ''; };

  /**
   * @returns {{mutasi:Array, jurnal:Array, galat:Array, stok:Object, nomorBeli:Object, hppJual:Object, saldo:Object, piutang:Object, utang:Object}}
   */
  function hitung(S) {
    const pem = S.tpl.pemetaan;
    const galat = [];
    const tx = urutTx(S.tx);
    const kasAkun = (cara) => (cara === 'bank' ? pem.bank : pem.kasTunai);
    const utangAkun = (id) => { const p = S.pemasok.find((x) => x.id === id); return (p && p.akun) || pem.utangUsaha; };

    // Nomor dokumen BELI/RBELI: -nnn per hari per jenis menurut urutan input
    const nomorBeli = {}, nomorRbeli = {};
    const cacah = {};
    tx.forEach((t) => {
      if (t.jenis !== 'BELI' && t.jenis !== 'RBELI') return;
      const kunci = t.jenis + t.tgl;
      cacah[kunci] = (cacah[kunci] || 0) + 1;
      const no = 'POS-' + tglNo(t.tgl) + '-' + t.jenis + '-' + String(cacah[kunci]).padStart(3, '0');
      (t.jenis === 'BELI' ? nomorBeli : nomorRbeli)[t.id] = no;
    });

    // Mutasi dasar: stok awal, pembelian, penjualan, retur pembelian
    const M = [];
    (S.tpl.stokAwal || []).forEach((s, i) => M.push({ d: s.tgl, no: s.lot || 'SA-' + (i + 1), k: s.k, j: 'Saldo Awal', q: +s.q, h: +s.h, ket: '' }));
    const baris = (d, no, k, j, q, h, ket, lot, ref) => { const r = { d, no, k, j, q, h, ket: ket || '' }; if (lot) r.lot = lot; r._ref = ref; return r; };
    tx.forEach((t) => {
      if (t.jenis === 'BELI') t.item.forEach((x) => M.push(baris(t.tgl, nomorBeli[t.id], x.k, 'Masuk', x.q, x.h, 'Faktur ' + (t.faktur || ''), null, t)));
    });
    const perHari = (jenis, f) => {
      const grup = {};
      tx.filter((t) => t.jenis === jenis).forEach((t) => t.item.forEach((x) => { const g = (grup[t.tgl + '|' + x.k] = grup[t.tgl + '|' + x.k] || { d: t.tgl, k: x.k, q: 0, h: 0, n: 0 }); f(g, x, t); }));
      return Object.values(grup);
    };
    perHari('JUAL', (g, x) => { g.q += x.q; }).forEach((g) => M.push(baris(g.d, 'POS-' + tglNo(g.d) + '-JUAL', g.k, 'Keluar', g.q, 0, 'Penjualan harian')));
    tx.forEach((t) => {
      if (t.jenis !== 'RBELI') return;
      const asal = tx.find((x) => x.id === t.ref);
      t.item.forEach((x) => M.push(baris(t.tgl, nomorRbeli[t.id], x.k, 'Keluar', x.q, 0, 'Retur pembelian', asal ? nomorBeli[asal.id] : '', t)));
    });
    const F1 = fifo(M);
    const hppJual = {}; // 'tgl|k' -> HPP per satuan penjualan hari itu
    M.forEach((r) => { if (r.j === 'Keluar' && r.no.endsWith('-JUAL')) hppJual[r.d + '|' + r.k] = F1.biaya.get(r) / r.q; });

    // Retur penjualan: Masuk pada HPP per satuan penjualan asal
    const rj = {};
    tx.filter((t) => t.jenis === 'RJUAL').forEach((t) => {
      const asal = tx.find((x) => x.id === t.ref);
      t.item.forEach((x) => {
        const h = asal ? hppJual[asal.tgl + '|' + x.k] : undefined;
        if (h === undefined) { galat.push('Retur penjualan ' + t.tgl + ': barang ' + x.k + ' tidak ada pada penjualan asal.'); return; }
        const g = (rj[t.tgl + '|' + x.k] = rj[t.tgl + '|' + x.k] || { d: t.tgl, k: x.k, q: 0, nilai: 0 });
        g.q += x.q; g.nilai += x.q * h; x._hpp = h;
      });
    });
    Object.values(rj).forEach((g) => M.push(baris(g.d, 'POS-' + tglNo(g.d) + '-RJUAL', g.k, 'Masuk', g.q, g.nilai / g.q, 'Retur penjualan')));
    const F2 = fifo(M);

    // Opname: selisih terhadap stok sistem akhir hari itu
    const opname = [];
    tx.filter((t) => t.jenis === 'OPNAME').forEach((t) => t.item.forEach((x) => {
      const f = fifo(M.concat(opname), t.tgl).per[x.k] || { q: 0, lapisan: [] };
      const sel = Math.round((x.fisik - f.q) * 1e6) / 1e6;
      x._sistem = f.q; x._selisih = sel;
      if (Math.abs(sel) < EPS) return;
      if (sel < 0) opname.push(baris(t.tgl, 'POS-' + tglNo(t.tgl) + '-OPNAME', x.k, 'Keluar', -sel, 0, 'Selisih opname'));
      else {
        const akhir = f.lapisan.length ? f.lapisan[f.lapisan.length - 1].h : (S.barang.find((b) => b.k === x.k) || {}).hargaBeli;
        if (!(akhir > 0)) { galat.push('Opname ' + t.tgl + ': harga beli barang ' + x.k + ' belum ada, tidak bisa menilai selisih lebih.'); return; }
        opname.push(baris(t.tgl, 'POS-' + tglNo(t.tgl) + '-OPNAME', x.k, 'Masuk', sel, akhir, 'Selisih opname'));
      }
    }));
    // Gabungkan baris opname per hari per barang
    const gabung = {};
    opname.forEach((r) => { const kk = r.d + '|' + r.k + '|' + r.j; if (gabung[kk]) { gabung[kk].h = (gabung[kk].h * gabung[kk].q + r.h * r.q) / (gabung[kk].q + r.q); gabung[kk].q += r.q; } else gabung[kk] = r; });
    Object.values(gabung).forEach((r) => M.push(r));
    const F = fifo(M);
    F.minus.forEach((k) => galat.push('Stok minus pada barang ' + k + ': penjualan/retur/opname melebihi stok.'));

    // Nilai akhir tiap mutasi dan keluaran mutasiStok
    const mutasi = M.filter((r) => r.j !== 'Saldo Awal').map((r) => {
      const nilai = r.j === 'Keluar' ? F.biaya.get(r) : bulat(r.q * r.h);
      const o = { d: r.d, no: r.no, k: r.k, j: r.j, q: r.q, h: r.j === 'Keluar' ? Math.round((nilai / r.q) * 100) / 100 : Math.round(r.h * 100) / 100, nilai, ket: r.ket };
      if (r.lot) o.lot = r.lot;
      return o;
    });
    // Peta nilai Keluar/Masuk per (hari, jenis, barang) untuk jurnal
    const nilaiPer = {};
    mutasi.forEach((r) => { const jenis = r.no.replace(/^POS-\d{8}-/, '').replace(/-\d+$/, ''); const kk = r.d + '|' + jenis + '|' + r.k + '|' + r.j; nilaiPer[kk] = (nilaiPer[kk] || 0) + r.nilai; });
    const nilaiHari = (d, jenis, j) => Object.keys(nilaiPer).filter((kk) => kk.startsWith(d + '|' + jenis + '|') && kk.endsWith('|' + j)).map((kk) => ({ k: kk.split('|')[2], nilai: nilaiPer[kk] }));

    // Jurnal
    const jurnal = [];
    const J = (d, no, akun, db, kr, ket, kom) => {
      if (!db && !kr) return;
      const r = { d, no, ak: akun + ' ' + namaAkun(S, akun), db: db || 0, kr: kr || 0, ket };
      if (kom) r.kom = kom;
      jurnal.push(r);
    };
    const perAkunPersediaan = (daftar) => { const a = {}; daftar.forEach((x) => { const ak = akunBarang(S, x.k) || '(akun belum diisi)'; a[ak] = (a[ak] || 0) + x.nilai; }); return Object.keys(a).sort().map((ak) => [ak, a[ak]]); };
    const hari = (jenis) => [...new Set(tx.filter((t) => t.jenis === jenis).map((t) => t.tgl))];

    hari('JUAL').forEach((d) => {
      const no = 'POS-' + tglNo(d) + '-JUAL';
      const ts = tx.filter((t) => t.jenis === 'JUAL' && t.tgl === d);
      const kas = {}; let piutang = 0, total = 0;
      ts.forEach((t) => {
        const tot = totalJual(t); total += tot;
        const ang = anggota(S, t.pelanggan);
        const dibayar = (t.tunai || 0) + (t.bank || 0) + (t.kredit || 0);
        if (dibayar !== tot) galat.push('Penjualan ' + d + ': pembayaran ' + dibayar + ' tidak sama dengan total ' + tot + '.');
        [['tunai', t.tunai], ['bank', t.bank]].forEach(([c, v]) => { if (v) { const kk = c + '|' + (ang ? 'a' : 'n'); kas[kk] = (kas[kk] || 0) + v; } });
        piutang += t.kredit || 0;
      });
      ['tunai|a', 'tunai|n', 'bank|a', 'bank|n'].forEach((kk) => { if (kas[kk]) { const [c, a] = kk.split('|'); J(d, no, kasAkun(c), kas[kk], 0, 'Penjualan ' + (c === 'bank' ? 'non-tunai' : 'tunai') + (a === 'a' ? ' anggota' : ' non-anggota'), a === 'a' ? KOM.anggota : KOM.non); } });
      J(d, no, pem.piutang, piutang, 0, 'Penjualan kredit');
      J(d, no, pem.penjualan, 0, total, 'Penjualan harian');
      const per = perAkunPersediaan(nilaiHari(d, 'JUAL', 'Keluar'));
      J(d, no, pem.hpp, per.reduce((s, x) => s + x[1], 0), 0, 'HPP penjualan harian');
      per.forEach(([ak, v]) => J(d, no, ak, 0, v, 'HPP penjualan harian'));
    });

    hari('PELUNASAN').forEach((d) => {
      const no = 'POS-' + tglNo(d) + '-PELUNASAN';
      const kas = {}; let total = 0;
      tx.filter((t) => t.jenis === 'PELUNASAN' && t.tgl === d).forEach((t) => {
        const ang = anggota(S, t.pelanggan);
        [['tunai', t.tunai], ['bank', t.bank]].forEach(([c, v]) => { if (v) { const kk = c + '|' + (ang ? 'a' : 'n'); kas[kk] = (kas[kk] || 0) + v; total += v; } });
      });
      ['tunai|a', 'tunai|n', 'bank|a', 'bank|n'].forEach((kk) => { if (kas[kk]) { const [c, a] = kk.split('|'); J(d, no, kasAkun(c), kas[kk], 0, 'Pelunasan piutang' + (a === 'a' ? ' anggota' : ' non-anggota'), a === 'a' ? KOM.anggota : KOM.non); } });
      J(d, no, pem.piutang, 0, total, 'Pelunasan piutang');
    });

    tx.filter((t) => t.jenis === 'BELI').forEach((t) => {
      const no = nomorBeli[t.id];
      const tot = jumlahItem(t.item, (x) => bulat(x.q * x.h));
      const per = perAkunPersediaan(t.item.map((x) => ({ k: x.k, nilai: bulat(x.q * x.h) })));
      per.forEach(([ak, v]) => J(t.tgl, no, ak, v, 0, 'Pembelian faktur ' + (t.faktur || '')));
      if (t.cara === 'kredit') J(t.tgl, no, utangAkun(t.pemasok), 0, tot, 'Pembelian faktur ' + (t.faktur || ''));
      else J(t.tgl, no, kasAkun(t.cara), 0, tot, 'Pembelian faktur ' + (t.faktur || ''));
    });

    hari('BAYAR').forEach((d) => {
      const no = 'POS-' + tglNo(d) + '-BAYAR';
      const utang = {}, kas = {};
      tx.filter((t) => t.jenis === 'BAYAR' && t.tgl === d).forEach((t) => { const a = utangAkun(t.pemasok); utang[a] = (utang[a] || 0) + t.jumlah; kas[t.dari] = (kas[t.dari] || 0) + t.jumlah; });
      Object.keys(utang).sort().forEach((a) => J(d, no, a, utang[a], 0, 'Pembayaran utang pemasok'));
      Object.keys(kas).sort().forEach((c) => J(d, no, kasAkun(c), 0, kas[c], 'Pembayaran utang pemasok'));
    });

    hari('RJUAL').forEach((d) => {
      const no = 'POS-' + tglNo(d) + '-RJUAL';
      const kas = {}; let piutang = 0, total = 0;
      tx.filter((t) => t.jenis === 'RJUAL' && t.tgl === d).forEach((t) => {
        const asal = tx.find((x) => x.id === t.ref);
        const nilai = jumlahItem(t.item, (x) => { const j = asal && asal.item.find((y) => y.k === x.k); return bulat(x.q * (j ? j.harga : 0)); });
        total += nilai;
        if (t.cara === 'piutang') piutang += nilai;
        else { const kk = t.cara + '|' + (anggota(S, asal && asal.pelanggan) ? 'a' : 'n'); kas[kk] = (kas[kk] || 0) + nilai; }
      });

  async function hitungChecksum(jurnal, mutasi, barangBaru) {
    const J = jurnal.map((r) => ({ d: r.d, no: r.no, ak: r.ak, db: r.db, kr: r.kr, ket: r.ket, kom: r.kom }));
    const M = mutasi.map((r) => ({ d: r.d, no: r.no, k: r.k, j: r.j, q: r.q, h: r.h, nilai: r.nilai, ket: r.ket, lot: r.lot }));

<script>
/*
 * Penyimpanan lokal: satu rekaman state di IndexedDB (database kdmp_pos_sembako), tertunda 300 ms setelah perubahan.
 * Tanpa enkripsi: POS dipakai di perangkat kasir; backup JSON bisa diunduh dari tab Ekspor/Impor.
 */
(function (POS) {
  'use strict';
  const NAMA = 'kdmp_pos_sembako';
  let db = null, timer = null;

  const buka = () => new Promise((ok, gagal) => {
    const r = indexedDB.open(NAMA, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('s');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => gagal(r.error);
  });
  const tx = (mode) => db.transaction('s', mode).objectStore('s');
  const req = (r) => new Promise((ok, gagal) => { r.onsuccess = () => ok(r.result); r.onerror = () => gagal(r.error); });

  const kosong = () => ({ tpl: null, barang: [], pelanggan: [], pemasok: [], tx: [], seq: 0, versi: 1 });

  async function muat() {
    try { db = await buka(); } catch (e) { db = null; return kosong(); }
    return (await req(tx('readonly').get('state'))) || kosong();
  }
  async function simpanSekarang(S) {
    clearTimeout(timer);
    if (db) await req(tx('readwrite').put(JSON.parse(JSON.stringify(S)), 'state'));
    POS.status && POS.status('Tersimpan ' + new Date().toLocaleTimeString('id-ID'));
  }
  function jadwalkan(S) {
    POS.status && POS.status('Menyimpan…');
    clearTimeout(timer);
    timer = setTimeout(() => simpanSekarang(S), 300);
  }
  async function hapusSemua() { if (db) await req(tx('readwrite').delete('state')); }

  POS.simpan = { muat, simpanSekarang, jadwalkan, kosong, hapusSemua, tersedia: () => !!db };
})(globalThis.POS = globalThis.POS || {});

</script>

/*
 * Pemindai barcode lewat kamera (API BarcodeDetector + getUserMedia). Hanya ada di peramban yang mendukung (mis. Chrome Android/desktop)
 * dan umumnya butuh halaman https atau localhost; bila tidak tersedia, pemindai fisik (keyboard wedge) tetap bekerja di kolom Scan.
 */
(function (POS) {
  'use strict';
  const FORMAT = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'];
  const tersedia = () => !!(globalThis.BarcodeDetector && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  const bunyi = () => {
    try {
      const c = new (globalThis.AudioContext || globalThis.webkitAudioContext)(), o = c.createOscillator();
      o.frequency.value = 880; o.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 90);
    } catch (e) { /* bunyi opsional */ }
  };

  /**
   * @param {(kode:string)=>void} bila  dipanggil tiap kode terbaca
   * @param {{terus?:boolean}} opsi  terus=true: kamera tetap terbuka (mode kasir); kode yang sama diabaikan 1,5 detik
   */
  async function pindai(bila, opsi) {
    if (!tersedia()) { POS.u.toast('Kamera/pemindai tidak tersedia di peramban ini. Pakai pemindai fisik atau ketik kodenya.', true); return; }
    let aliran;
    try { aliran = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { POS.u.toast('Kamera tidak bisa dibuka: ' + (e.message || e.name), true); return; }
    const kotak = document.createElement('div');
    kotak.id = 'kam';
    kotak.innerHTML = '<video autoplay playsinline muted></video><div id="kamst">Arahkan kamera ke barcode…</div><button class="x" id="kamtutup">Tutup</button>';
    document.body.appendChild(kotak);
    const video = kotak.querySelector('video');
    video.srcObject = aliran;
    const det = new globalThis.BarcodeDetector({ formats: FORMAT });
    let terakhir = '', waktu = 0, mati = false;
    const tutup = () => { mati = true; clearInterval(t); aliran.getTracks().forEach((x) => x.stop()); kotak.remove(); };
    kotak.querySelector('#kamtutup').onclick = tutup;
    const t = setInterval(async () => {

      try {

    if (t) {
      hasil = daftar.find((x) => x.nama.toLowerCase() === t);
      if (!hasil) { const m = daftar.filter((x) => x.nama.toLowerCase().includes(t)); if (m.length === 1) hasil = m[0]; }
      if (!hasil) {
        if (el.dataset.baru && !daftar.some((x) => x.nama.toLowerCase().includes(t))) baru = el.value.trim();

    if (U.perbaruiStruk) U.perbaruiStruk();

  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]');
    if (!el) return;
    const f = A[el.dataset.a];
    if (!f) return;

  });

      const v = el.type === 'checkbox' ? el.checked : el.dataset.t === 'num' ? U.ubahBilangan(el.value) : el.value;
      setJalur(el.dataset.f, v);
      if (el.dataset.r) { const g = A[el.dataset.r]; if (g) g(el, e); }

    }

    if (b && A[b.dataset.b]) { const r = A[b.dataset.b](b, e); if (r && r.catch) r.catch((x) => toast(String((x && x.message) || x), true)); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const el = e.target.closest && e.target.closest('[data-enter]');
    if (!el) return;
    e.preventDefault();
    const r = A[el.dataset.enter](el, e);
    if (r && r.catch) r.catch((x) => toast(String((x && x.message) || x), true));
  });
  A.tab = (el) => U.pergi(el.dataset.t);
  A.menu = () => { const p = document.getElementById('menupanel'); p.hidden = !p.hidden; document.getElementById('menu').setAttribute('aria-expanded', String(!p.hidden)); };
  document.addEventListener('click', (e) => { const p = document.getElementById('menupanel'); if (p && !p.hidden && !e.target.closest('#menupanel') && !e.target.closest('#menu')) p.hidden = true; });

  POS.mulai = async function () {
    S = await POS.simpan.muat();
    POS.S = S;
    F.kasir = { tgl: U.hariIni(), pelanggan: '', k: '', q: 1, harga: '', item: [], tunai: 0, bank: 0, kredit: 0 };
    F.beli = { tgl: U.hariIni(), pemasok: '', faktur: '', k: '', q: 1, h: '', item: [], cara: 'tunai' };
    F.retur = { tglJ: U.hariIni(), refJ: '', caraJ: 'tunai', qJ: {}, tglB: U.hariIni(), refB: '', caraB: 'utang', qB: {} };
    F.bayar = { tgl: U.hariIni(), pelanggan: '', tunai: 0, bank: 0, pemasokId: '', jumlah: 0, dari: 'tunai', tglB: U.hariIni() };
    F.opname = { tgl: U.hariIni(), fisik: {} };
    F.kas = { tgl: U.hariIni(), jumlah: 0 };
    F.ekspor = { dari: '', sampai: '' };
    tab = 'Kasir';
    U.fokus = 'kbarang';
    render();
    if (!POS.simpan.tersedia()) toast('IndexedDB tidak tersedia: data hanya di memori. Unduh backup secara rutin.', true);
  };

})(globalThis.POS = globalThis.POS || {});

</script>
<script>
/*
 * Tab transaksi: Kasir (penjualan), Pembelian, Retur, Piutang & Utang, Stok & Opname, Kas.
 */
(function (POS) {
  'use strict';
  const { A, F, R, u: U } = POS;
  const { esc, rp, qty } = U;

  const cariBarang = (teks) => {
    const t = String(teks || '').trim().toLowerCase();

    return S.barang.find((b) => (b.k + ' ' + b.n).toLowerCase() === t) || S.barang.find((b) => b.barcode && String(b.barcode).toLowerCase() === t) || S.barang.find((b) => b.k.toLowerCase() === t) || S.barang.find((b) => b.n.toLowerCase() === t) || S.barang.find((b) => b.n.toLowerCase().includes(t)) || S.barang.find((b) => b.k.toLowerCase().startsWith(t));

    : '<p class=c>Belum ada barang.</p>';
  const total = (items, harga) => items.reduce((s, x) => s + POS.mesin.bulat(x.q * harga(x)), 0);

  // ---------- Kasir
  R['Kasir'] = () => {
    if (!U.s().tpl) return U.perlu();
    const f = kasir();
    const tot = total(f.item, (x) => x.harga);
    return `<div class=kgrid><div class=kiri><h2>Kasir — penjualan <button class=x data-a="kasir.bantuan" title="Bantuan kasir" aria-label="Bantuan kasir" style="padding:1px 9px;border-radius:50%;font-weight:700">?</button></h2>
<div class=card><div class=bar><label>Barang (nama / kode / barcode)<input id=kbarang data-sug=barang value="${esc(labelBarang(f.k))}" data-f="kasir.k" data-r="kasir.pilih" data-enter="kasir.enterBarang" autocomplete=off placeholder="scan barcode atau ketik nama" style="width:260px"></label>
<label>Jumlah<input id=kjumlah class="n s" value="${f.q}" data-f="kasir.q" data-t=num data-enter="kasir.enterJumlah" autocomplete=off></label>
<label>Harga satuan<input id=kharga class=n value="${f.harga || ''}" data-f="kasir.harga" data-t=num data-r="kasir.hargaUbah" data-enter="kasir.enterHarga" autocomplete=off></label>
<button class=x data-a="kasir.tambah">Masuk keranjang</button>${POS.kamera.tersedia() ? '<button class=x data-a="kasir.kamera">Kamera</button>' : ''}</div>
${f.peringatan ? `<div class=galat id=kpw><b>Tidak masuk keranjang:</b> ${esc(f.peringatan)}</div>` : ''}
<h3>Keranjang</h3>${tabelItem(f.item, 'Harga', 'kasir.hapus', (x) => x.harga)}
<p>Total <span class=tot id=ktot>${rp(tot)}</span></p>
<div class=bar><label>Tunai<input class=n value="${f.tunai || ''}" data-pay="tunai" inputmode=decimal autocomplete=off></label>
<label>Non-tunai (bank/QRIS)<input class=n value="${f.bank || ''}" data-pay="bank" inputmode=decimal autocomplete=off></label>
<label>Kredit (piutang)<input class=n value="${f.kredit || ''}" data-pay="kredit" inputmode=decimal autocomplete=off></label>
<button class=x data-a="kasir.pas">Tunai pas</button></div>
<p id=ksisa class=c></p>
<div class=bar><label>Pembeli <span class=c>(Enter = simpan penjualan)</span>${U.inputOrang('pelanggan', f.pelanggan, 'kasir.pelanggan', { baru: true, kosong: 'ketik nama pembeli', id: 'kpembeli', enter: 'kasir.enterPembeli', sug: true })}</label></div>
<div class=bar><button class=p data-a="kasir.simpan">Simpan penjualan</button><button class=x data-a="kasir.batal">Kosongkan</button></div></div></div>
<div class=kanan>${panelStruk()}</div></div>`;
  };
  // Stok harus cukup untuk isi keranjang + tambahan; stok 0 atau kurang = tidak masuk keranjang, muncul peringatan.
  const stokCukup = (b, tambah, popup) => {
    const f = kasir(), tersedia = U.hasil().stokTersedia(b.k, f.tgl);
    const dikeranjang = f.item.filter((x) => x.k === b.k).reduce((s, x) => s + x.q, 0);
    let pesan = '';
    if (tersedia <= 1e-9) pesan = 'Stok ' + b.n + ' habis (0).';
    else if (dikeranjang + tambah > tersedia + 1e-9) pesan = 'Stok ' + b.n + ' tinggal ' + qty(tersedia) + (dikeranjang ? ', di keranjang sudah ' + qty(dikeranjang) : '') + '.';
    f.peringatan = pesan;
    if (pesan) { U.toast(pesan, true); if (popup && tersedia <= 1e-9) popupBeli(b, false); return false; }
    return true;
  };
  // Menambah satu barang dari barcode (atau kode barang). Mengembalikan true bila berhasil.
  const tambahScan = (kode, popup) => {
    const f = kasir(), b = cariBarang(kode);
    if (!b) { U.toast('Barcode ' + kode + ' tidak dikenal. Daftarkan di Menu › Master.', true); return false; }
    const harga = b.harga || 0;
    if (!(harga > 0)) { U.toast(b.n + ': harga jual belum diisi di Master.', true); return false; }
    if (!stokCukup(b, 1, popup)) return false;
    const ada = f.item.find((x) => x.k === b.k && x.harga === harga);
    if (ada) ada.q += 1; else f.item.push({ k: b.k, q: 1, harga });
    U.toast(b.n + ' ×1', false);
    return true;
  };
  A['kasir.scan'] = (el) => { const kode = el.value.trim(); if (!kode) return; if (tambahScan(kode, true)) kasir().peringatan = ''; if (!document.getElementById('mdl')) U.fokus = 'scan'; U.render(); };
  A['kasir.kamera'] = () => POS.kamera.pindai((kode) => { if (U.pos() === 'Kasir') { if (tambahScan(kode)) kasir().peringatan = ''; U.render(); } }, { terus: true });
  const $ = (id) => document.getElementById(id);
  // Menyamakan state dengan isi kolom barang/jumlah/harga (Enter bisa datang sebelum event change)
  const sinkron = () => {
    const f = kasir(), k = $('kbarang'), q = $('kjumlah'), h = $('kharga');
    if (k && k.value.trim() !== labelBarang(f.k)) f.k = k.value.trim();
    if (q) f.q = U.ubahBilangan(q.value);
    if (h) { const n = h.value.trim() === '' ? '' : U.ubahBilangan(h.value); if (n !== f.harga && !(n === '' && !f.harga)) { f.harga = n; f.hargaAuto = false; } }
  };
  // Mencari barang dari isian (nama/kode/barcode); harga jual dari Master terisi otomatis. Tidak ada = popup master produk.
  const resolusi = () => {
    const f = kasir(), teks = String(f.k || '').trim();
    if (!teks) return null;
    const b = cariBarang(teks);
    if (!b) { popupBarang(teks); return null; }
    f.k = b.k;
    if (!f.harga || f.hargaAuto) { f.harga = b.harga || 0; f.hargaAuto = true; }
    if ($('kbarang')) $('kbarang').value = labelBarang(f.k);
    if ($('kharga')) $('kharga').value = f.harga || '';
    return b;
  };
  A['kasir.pilih'] = () => { resolusi(); };
  A['kasir.hargaUbah'] = () => { kasir().hargaAuto = false; };
  // Enter: bila barang, jumlah, dan harga sudah terisi langsung masuk keranjang; yang kurang diisi dulu
  const lanjutTambah = () => {
    const f = kasir(); sinkron();
    if (!String(f.k || '').trim()) { if ($('kbarang')) $('kbarang').focus(); return; }
    if (!resolusi()) return;
    if (!(f.q > 0)) { const e = $('kjumlah'); if (e) { e.focus(); e.select(); } return U.toast('Isi jumlah.', true); }
    if (!(f.harga > 0)) { const e = $('kharga'); if (e) e.focus(); return U.toast('Isi harga satuan (atau isi harga jual di Master).', true); }
    A['kasir.tambah']();
  };
  A['kasir.enterBarang'] = () => {
    const f = kasir(); sinkron();
    if (String(f.k || '').trim()) return lanjutTambah();
    if (!f.item.length) return U.toast('Belum ada barang.', true);
    const t = document.querySelector('input[data-pay=tunai]'); if (t) t.focus();
  };
  A['kasir.enterJumlah'] = lanjutTambah;
  A['kasir.enterHarga'] = lanjutTambah;
  A['kasir.tambah'] = () => {
    sinkron();
    const f = kasir(), b = cariBarang(f.k);
    if (!b && String(f.k || '').trim()) return popupBarang(String(f.k).trim());
    if (!b) return U.toast('Barang tidak ditemukan di Master.', true);
    if (!(f.q > 0)) return U.toast('Jumlah harus lebih dari 0.', true);
    const harga = f.harga || b.harga || 0;
    if (!(harga > 0)) return U.toast('Isi harga satuan (atau isi harga jual di Master).', true);
    if (!stokCukup(b, f.q, true)) { if (!$('mdl')) U.fokus = 'kbarang'; return U.render(); }
    const ada = f.item.find((x) => x.k === b.k && x.harga === harga);
    if (ada) ada.q += f.q; else f.item.push({ k: b.k, q: f.q, harga });
    f.k = ''; f.q = 1; f.harga = ''; f.hargaAuto = false; f.peringatan = '';
    U.fokus = 'kbarang';
    U.render();
  };
  A['kasir.hapus'] = (el) => { kasir().item.splice(+el.dataset.i, 1); U.render(); };
  A['kasir.pas'] = () => { const f = kasir(); f.tunai = total(f.item, (x) => x.harga); f.bank = 0; f.kredit = 0; U.render(); };
  A['kasir.sisa'] = () => {
    const f = kasir(), tot = total(f.item, (x) => x.harga), s = tot - (f.tunai || 0) - (f.bank || 0) - (f.kredit || 0);
    const e = document.getElementById('ksisa');
    if (e) { e.textContent = s === 0 ? 'Pembayaran pas.' : s > 0 ? 'Kurang ' + rp(s) : 'Kembalian ' + rp(-s); e.className = s <= 0 ? 'ok' : 'no'; }
  };
  // Kolom pembayaran: Tab/klik ke kolom kosong menampilkan sisa tagihan; Enter = dipilih (disimpan); keluar tanpa Enter = dikosongkan lagi.
  // Angka yang diketik sendiri tersimpan saat keluar dari kolom.
  const kolomBayar = (e) => (e.target && e.target.matches && e.target.matches('input[data-pay]')) ? e.target : null;
  const sisaBayar = (kecuali) => {
    let s = total(kasir().item, (x) => x.harga);
    document.querySelectorAll('input[data-pay]').forEach((x) => { if (x !== kecuali) s -= U.ubahBilangan(x.value); });
    return s;
  };
  const tampilSisa = () => {
    perbaruiStruk();
    const s = sisaBayar(null), e = document.getElementById('ksisa');
    if (e) { e.textContent = s === 0 ? 'Pembayaran pas.' : s > 0 ? 'Kurang ' + rp(s) : 'Kembalian ' + rp(-s); e.className = s <= 0 ? 'ok' : 'no'; }
  };
  document.addEventListener('focusin', (e) => {
    const el = kolomBayar(e); if (!el) return;
    if (el.value.trim() === '') { const s = sisaBayar(el); if (s > 0) { el.value = String(s); el.dataset.tmp = '1'; } }

  document.addEventListener('input', (e) => { const el = kolomBayar(e); if (el) { el.dataset.tmp = ''; tampilSisa(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const el = kolomBayar(e); if (!el) return;
    e.preventDefault(); el.dataset.tmp = ''; kasir()[el.dataset.pay] = U.ubahBilangan(el.value); tampilSisa(); const pb = document.getElementById('kpembeli'); if (pb) { pb.focus(); pb.select(); }
  });
  document.addEventListener('focusout', (e) => {
    const el = kolomBayar(e); if (!el) return;
    if (el.dataset.tmp === '1') { el.value = ''; el.dataset.tmp = ''; kasir()[el.dataset.pay] = 0; } else kasir()[el.dataset.pay] = U.ubahBilangan(el.value);
    tampilSisa();
  });
  A['kasir.batal'] = () => { Object.assign(kasir(), { item: [], tunai: 0, bank: 0, kredit: 0, k: '', q: 1, harga: '', peringatan: '' }); U.fokus = 'kbarang'; U.render(); };
  A['kasir.simpanOk'] = () => {
    tutupModal();
    const f = kasir(), tot = total(f.item, (x) => x.harga);
    if (!f.item.length) return U.toast('Belum ada barang.', true);
    const lebih = lebihBayar(f, tot); if (typeof lebih === 'string') return U.toast(lebih, true);

    if (U.simpanTx({ tgl: f.tgl, jenis: 'JUAL', pelanggan: f.pelanggan || null, item: f.item.map((x) => ({ ...x })), tunai: (f.tunai || 0) - lebih, bank: f.bank || 0, kredit: f.kredit || 0, diterima: f.tunai || 0, kembali: lebih, nomor: nomorBerikut(f.tgl), petugas: U.s().petugas || '' })) {
      f.strukId = U.s().tx[U.s().tx.length - 1].id;
      Object.assign(f, { item: [], tunai: 0, bank: 0, kredit: 0, pelanggan: '' }); U.toast('Penjualan ' + rp(tot) + ' tersimpan'); U.fokus = 'kbarang'; U.render();
    }
  };

  // ---------- Popup untuk tab Kasir: pembeli baru, master produk baru, pembelian produk baru
  const hapusModal = () => { const e = document.getElementById('mdl'); if (e) e.remove(); };

    hapusModal();
    const e = document.createElement('div');

    document.body.appendChild(e);
    if (siap) siap(e);
    const fokusPertama = () => { const f = e.querySelector('input,select') || e.querySelector('button.p'); if (f && document.body.contains(f)) f.focus(); };
    fokusPertama(); setTimeout(fokusPertama, 0); // diulang: fokus bawaan peramban setelah Tab bisa menimpa
  };
  const isi = (id) => document.getElementById(id).value;
  const angka = (id) => U.ubahBilangan(isi(id));

  // 1) Pembeli baru (nama tidak ada di daftar pelanggan)
  U.popupPembeli = (nama) => bukaModal('Pembeli baru',

    'pembeli.simpan', 'pembeli.batal', (e) => {
      const s = e.querySelector('#mp-ang'), n = e.querySelector('#mp-no');
      s.onchange = () => { n.disabled = s.value !== 'a'; if (n.disabled) n.value = ''; else n.focus(); };
    });
  A['kasir.simpan'] = () => {
    const f = kasir(), tot = total(f.item, (x) => x.harga);

    const panah = e.key === 'ArrowDown' || e.key === 'ArrowUp';
    if (panah && el.dataset.pay === 'tunai') { // pilih nominal bulat
      e.preventDefault();
      const cur = U.ubahBilangan(el.value) || 0;
      const n = e.key === 'ArrowDown' ? NOMINAL.find((x) => x > cur) : NOMINAL.slice().reverse().find((x) => x < cur);
      if (n) { el.value = String(n); el.dataset.tmp = ''; tampilSisa(); }
      return;
    }
    if (el.dataset.sug) {
      const buka = sug.el === el && !$('sug').hidden;
      if (panah) {
        e.preventDefault(); e.stopImmediatePropagation();
        if (!buka) { bukaSaran(el); sug.idx = sug.items.length ? 0 : -1; gambarSaran(); return; }
        sug.idx = e.key === 'ArrowDown' ? Math.min(sug.items.length - 1, sug.idx + 1) : Math.max(0, sug.idx - 1);
        gambarSaran(); return;
      }
      if (e.key === 'Enter' && buka && sug.idx >= 0) { e.preventDefault(); e.stopImmediatePropagation(); pilihSaran(sug.idx); return; }
      if (e.key === 'Escape') tutupSaran();
    }
  }, true);
  document.addEventListener('focusout', (e) => { if (e.target.dataset && e.target.dataset.sug) tutupSaran(); });
  document.addEventListener('focusin', (e) => { if (e.target.id === 'kpembeli') e.target.select(); });

  // ---------- Pembelian
  R['Pembelian'] = () => {

    return `<h2>Pembelian dari pemasok</h2>
<div class=card><div class=bar><label>No. faktur <span class=c>(boleh kosong)</span><input id=bfaktur value="${esc(f.faktur)}" data-f="beli.faktur" data-enter="beli.enterFaktur" autocomplete=off></label>
<label>Pemasok${U.inputOrang('pemasok', f.pemasok, 'beli.pemasok', { baru: true, kosong: 'ketik huruf nama pemasok', id: 'bpemasok', enter: 'beli.enterPemasok', sug: true })}</label>
<label>Pembayaran<select id=bcara data-f="beli.cara" data-enter="beli.enterCara">${U.opt([['tunai', 'Tunai'], ['kredit', 'Kredit (utang usaha)'], ['bank', 'Bank']], f.cara)}</select></label></div>
<div class=bar><label>Barang (nama / kode / barcode)<input id=bbarang data-sug=barangbeli value="${esc(labelBarang(f.k))}" data-f="beli.k" data-r="beli.pilih" data-enter="beli.enterBarang" autocomplete=off placeholder="scan barcode atau ketik nama" style="width:260px"></label>
<label>QTY<input id=bqty class="n s" value="${f.q}" data-f="beli.q" data-t=num data-enter="beli.enterQty" autocomplete=off></label>
<label>Harga beli<input id=beli-h class=n value="${f.h}" data-f="beli.h" data-t=num data-r="beli.hargaUbah" data-enter="beli.enterHarga" autocomplete=off></label>

${tabelItem(f.item, 'Harga beli', 'beli.hapus', (x) => x.h)}
<p>Total <span class=tot>${rp(tot)}</span></p>
<div class=bar><button class=p id=beli-simpan data-a="beli.simpan">Simpan pembelian</button></div></div>`;
  };
  // Menyamakan state dengan isian barang/QTY/harga (Enter bisa datang sebelum event change)

    if (h) { const n = h.value.trim() === '' ? '' : U.ubahBilangan(h.value); if (n !== f.h && !(n === '' && !f.h)) { f.h = n; f.hAuto = false; } }
  };
  // Mencari barang dari isian (nama/kode/barcode); harga beli terakhir dari Master terisi otomatis. Tidak ada = popup tambah barang baru.
  const resolBeli = () => {
    const f = F.beli, teks = String(f.k || '').trim();

  const fokusBeli = (id) => { const e = $(id); if (e) { e.focus(); if (e.select) e.select(); } };
  A['beli.pilih'] = () => { resolBeli(); };
  A['beli.hargaUbah'] = () => { F.beli.hAuto = false; };

<div class=bar><label>Tunai<input class=n value="${f.tunai || ''}" data-f="bayar.tunai" data-t=num></label><label>Bank<input class=n value="${f.bank || ''}" data-f="bayar.bank" data-t=num></label><button class=p data-a="bayar.terima">Simpan</button></div></div>

<div class=bar><label>Tanggal opname<input type=date value="${f.tgl}" data-f="opname.tgl"></label><button class=p data-a="opname.simpan">Simpan opname (hanya barang yang diisi)</button></div>

<script>

 * Tab Master (barang, pelanggan, pemasok), Riwayat, dan Ekspor/Impor (template, data POS, backup).
 */
(function (POS) {

    a.download = nama; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  const pakai = (S, jenis, f) => S.tx.some((t) => f(t));

  // ---------- Master
  R['Master'] = () => {
    const S = U.s();
    const akunP = U.akunCoa('1.1.4.'), akunU = U.akunCoa('2.1.3.');
    const dariTpl = (k) => ((S.tpl && S.tpl.barang) || []).some((b) => b.k === k);
    return `<h2>Master data</h2>
<div class=card><h3>Barang</h3><table><tr><th>Kode</th><th>Nama</th><th>Barcode</th><th>Akun persediaan</th><th class=n>Harga jual</th><th class=n>Harga beli terakhir</th><th></th></tr>
${S.barang.map((b, i) => `<tr><td>${dariTpl(b.k) ? esc(b.k) : `<input class=s style="width:110px" value="${esc(b.k)}" data-f="m.b.${i}.k" data-r="m.ubah">`}</td>
<td><input value="${esc(b.n)}" data-f="m.b.${i}.n" data-r="m.ubah"></td>
<td style="white-space:nowrap"><input style="width:130px" value="${esc(b.barcode || '')}" data-f="m.b.${i}.barcode" data-r="m.ubah" placeholder="scan / ketik">${POS.kamera.tersedia() ? ` <button class=x data-a="m.pindai" data-i="${i}">Pindai</button>` : ''}</td>
<td><select data-f="m.b.${i}.akun" data-r="m.ubah">${U.opt(akunP, b.akun, '— pilih —')}</select></td>
<td class=n><input class=n value="${b.harga || ''}" data-t=num data-f="m.b.${i}.harga" data-r="m.ubah"></td>
<td class=n><input class=n value="${b.hargaBeli || ''}" data-t=num data-f="m.b.${i}.hargaBeli" data-r="m.ubah"></td>
<td>${dariTpl(b.k) ? '' : `<button class=k data-a="m.hapusB" data-i="${i}">hapus</button>`}</td></tr>`).join('')}</table>
<div class=bar><button class=x data-a="m.tambahB">+ Barang baru</button></div>
<p class=c>Barcode hanya ada di POS (tidak dikirim ke akuntansiApp). Pemindai fisik cukup diarahkan ke kolom Barcode lalu scan. Barang dari template tidak bisa dihapus atau diganti kodenya. Barang baru dikirim ke akuntansiApp sebagai barangBaru — pastikan akun persediaannya terisi.</p></div>
<div class=card><h3>Pelanggan</h3><table><tr><th>Nama</th><th>Anggota</th><th>Nomor anggota</th><th class=n>Saldo awal piutang</th><th></th></tr>
${S.pelanggan.map((p, i) => `<tr><td><input value="${esc(p.nama)}" data-f="m.p.${i}.nama" data-r="m.ubah"></td><td><input type=checkbox ${p.anggota ? 'checked' : ''} data-f="m.p.${i}.anggota" data-r="m.ubah"></td>
<td><input style="width:140px" value="${esc(p.noAnggota || '')}" data-f="m.p.${i}.noAnggota" data-r="m.ubah" placeholder="isi bila anggota"></td>
<td class=n><input class=n value="${p.saldoAwal || ''}" data-t=num data-f="m.p.${i}.saldoAwal" data-r="m.ubah"></td><td><button class=k data-a="m.hapusP" data-i="${i}">hapus</button></td></tr>`).join('')}</table>
<div class=bar><button class=x data-a="m.tambahP">+ Pelanggan</button></div>
<p class=c>Status anggota menentukan komponen arus kas penerimaan (anggota atau non-anggota). Nomor anggota boleh dikosongkan dan bisa dicari di kolom Pembeli pada Kasir. Penjualan tanpa pelanggan dianggap non-anggota.</p></div>
<div class=card><h3>Pemasok</h3><table><tr><th>Nama</th><th>Akun utang usaha</th><th class=n>Saldo awal utang</th><th></th></tr>
${S.pemasok.map((p, i) => `<tr><td><input value="${esc(p.nama)}" data-f="m.s.${i}.nama" data-r="m.ubah"></td><td><select data-f="m.s.${i}.akun" data-r="m.ubah">${U.opt(akunU, p.akun, '— pilih —')}</select></td>
<td class=n><input class=n value="${p.saldoAwal || ''}" data-t=num data-f="m.s.${i}.saldoAwal" data-r="m.ubah"></td><td><button class=k data-a="m.hapusS" data-i="${i}">hapus</button></td></tr>`).join('')}</table>
<div class=bar><button class=x data-a="m.tambahS">+ Pemasok</button></div></div>`;
  };
  // Nilai tabel Master disimpan langsung ke state (F.m.<b|p|s>.<i>.<kolom> disalin ke S)
  A['m.ubah'] = (el) => {
    const [, j, i, kolom] = el.dataset.f.split('.');
    const S = U.s(), daftar = j === 'b' ? S.barang : j === 'p' ? S.pelanggan : S.pemasok;
    const baris = daftar[+i]; if (!baris) return;
    const v = el.type === 'checkbox' ? el.checked : el.dataset.t === 'num' ? U.ubahBilangan(el.value) : el.value.trim();
    if (kolom === 'k' && S.barang.some((b, x) => x !== +i && b.k === v)) { U.toast('Kode barang sudah dipakai.', true); return U.render(); }
    if (kolom === 'k' && baris.k && pakai(S, 'x', (t) => (t.item || []).some((x) => x.k === baris.k))) { U.toast('Kode tidak bisa diganti: barang sudah dipakai di transaksi.', true); return U.render(); }
    if (kolom === 'nama' && j !== 'b' && daftar.some((x, n) => n !== +i && x.nama.trim().toLowerCase() === v.toLowerCase())) { U.toast('Nama sudah dipakai; beri nama yang berbeda agar mudah dicari.', true); return U.render(); }
    if (kolom === 'barcode' && v && S.barang.some((b, x) => x !== +i && b.barcode === v)) { U.toast('Barcode itu sudah dipakai barang lain.', true); return U.render(); }
    if (kolom === 'noAnggota' && v && S.pelanggan.some((x, n) => n !== +i && x.noAnggota && String(x.noAnggota).toLowerCase() === v.toLowerCase())) { U.toast('Nomor anggota itu sudah dipakai pembeli lain.', true); return U.render(); }
    baris[kolom] = v; simpan();
  };
  A['m.pindai'] = (el) => POS.kamera.pindai((kode) => {
    const S = U.s(), i = +el.dataset.i;
    if (S.barang.some((b, x) => x !== i && b.barcode === kode)) return U.toast('Barcode ' + kode + ' sudah dipakai barang lain.', true);
    S.barang[i].barcode = kode; simpan(); if (U.pos() === 'Master') U.render();
  });
  const idBaru = (a) => { const S = U.s(); S.seq++; return a + S.seq; };
  A['m.tambahB'] = () => { U.s().barang.push({ k: 'BRG-' + (U.s().barang.length + 1), n: '', akun: '', harga: 0, hargaBeli: 0 }); simpan(); U.render(); };
  A['m.tambahP'] = () => { U.s().pelanggan.push({ id: idBaru('p'), nama: 'Pelanggan baru', anggota: false, saldoAwal: 0 }); simpan(); U.render(); };
  A['m.tambahS'] = () => { const S = U.s(); S.pemasok.push({ id: idBaru('s'), nama: 'Pemasok baru', akun: S.tpl ? S.tpl.pemetaan.utangUsaha : '', saldoAwal: 0 }); simpan(); U.render(); };
  A['m.hapusB'] = (el) => { const S = U.s(), b = S.barang[+el.dataset.i]; if (pakai(S, 'x', (t) => (t.item || []).some((x) => x.k === b.k))) return U.toast('Barang sudah dipakai di transaksi.', true); S.barang.splice(+el.dataset.i, 1); simpan(); U.render(); };
  A['m.hapusP'] = (el) => { const S = U.s(), p = S.pelanggan[+el.dataset.i]; if (pakai(S, 'x', (t) => t.pelanggan === p.id)) return U.toast('Pelanggan sudah dipakai di transaksi.', true); S.pelanggan.splice(+el.dataset.i, 1); simpan(); U.render(); };
  A['m.hapusS'] = (el) => { const S = U.s(), p = S.pemasok[+el.dataset.i]; if (pakai(S, 'x', (t) => t.pemasok === p.id)) return U.toast('Pemasok sudah dipakai di transaksi.', true); S.pemasok.splice(+el.dataset.i, 1); simpan(); U.render(); };

  // ---------- Riwayat
  const ringkas = (t) => {
    const m = POS.mesin;
    switch (t.jenis) {
      case 'JUAL': return U.namaPelanggan(t.pelanggan) + ' · ' + t.item.length + ' barang · ' + rp(m.totalJual(t)) + (t.kredit ? ' (kredit ' + rp(t.kredit) + ')' : '');
      case 'PELUNASAN': return U.namaPelanggan(t.pelanggan) + ' · ' + rp((t.tunai || 0) + (t.bank || 0));
      case 'BELI': return U.namaPemasok(t.pemasok) + ' · faktur ' + (t.faktur || '-') + ' · ' + rp(t.item.reduce((s, x) => s + m.bulat(x.q * x.h), 0)) + ' · ' + t.cara;
      case 'BAYAR': return U.namaPemasok(t.pemasok) + ' · ' + rp(t.jumlah) + ' dari ' + t.dari;
      case 'RJUAL': case 'RBELI': return t.item.map((x) => x.k + ' ×' + qty(x.q)).join(', ') + ' · ' + t.cara;
      case 'OPNAME': return t.item.map((x) => x.k + ' fisik ' + qty(x.fisik)).join(', ');
      case 'SETOR': return rp(t.jumlah);
      default: return '';
    }
  };
  R['Riwayat'] = () => {
    const S = U.s();
    const daftar = S.tx.slice().sort((a, b) => (a.tgl < b.tgl ? 1 : a.tgl > b.tgl ? -1 : b.urut - a.urut));
    return `<h2>Riwayat transaksi</h2><div class=card><table><tr><th>Tanggal</th><th>Jenis</th><th>Ringkasan</th><th></th></tr>${daftar.map((t) => `<tr><td>${U.tglId(t.tgl)}</td><td>${esc(t.jenis)}</td><td>${esc(ringkas(t))}</td><td><button class=k data-a="r.hapus" data-id="${esc(t.id)}">hapus</button></td></tr>`).join('') || '<tr><td colspan=4 class=c>Belum ada transaksi.</td></tr>'}</table></div>`;
  };
  A['r.hapus'] = (el) => { if (confirm('Hapus transaksi ini?')) { if (U.hapusTx(el.dataset.id)) { U.toast('Dihapus'); U.render(); } } };

  // ---------- Ekspor / Impor
  const bulanTpl = () => { const p = U.s().tpl.periode; const d = String(p.bulan).padStart(2, '0'); return [p.tahun + '-' + d + '-01', new Date(Date.UTC(p.tahun, p.bulan, 0)).toISOString().slice(0, 10)]; };
  R['Ekspor/Impor'] = () => {
    const S = U.s(), t = S.tpl;
    let h = '<h2>Ekspor / Impor</h2>';
    h += `<div class=card><h3>1. Template dari akuntansiApp</h3>${t ? `<p>Template aktif: unit <b>${esc(t.unit)}</b>, periode <b>${t.periode.tahun}-${String(t.periode.bulan).padStart(2, '0')}</b>, stok awal per ${U.tglId(t.posisiStok)} (${(t.stokAwal || []).length} lapisan), metode ${esc(t.metodeHpp)}. <span class=c>ID ${esc(t.idTemplat)}</span></p>` : '<p class=no>Belum ada template.</p>'}
<label>Impor template (.json)<input type=file accept=.json data-b="x.templat"></label>
<p class=c>Template baru untuk bulan berikutnya: transaksi sampai tanggal stok awal dianggap sudah masuk akuntansiApp dan dibuang dari POS.</p></div>`;
    if (t) {
      const f = F.ekspor, [d0, d1] = bulanTpl();
      if (!f.dari) f.dari = d0; if (!f.sampai) f.sampai = d1;
      const H = U.hasil();
      const dalam = (r) => r.d >= f.dari && r.d <= f.sampai;
      const J = H.jurnal.filter(dalam), M = H.mutasi.filter(dalam);
      h += `<div class=card><h3>2. Data POS untuk akuntansiApp</h3><div class=bar><label>Dari<input type=date value="${f.dari}" data-f="ekspor.dari" data-r="x.segar"></label><label>Sampai<input type=date value="${f.sampai}" data-f="ekspor.sampai" data-r="x.segar"></label></div>
<p>${J.length} baris jurnal, ${M.length} mutasi stok. Total debit ${rp(J.reduce((s, r) => s + r.db, 0))}, kredit ${rp(J.reduce((s, r) => s + r.kr, 0))}.</p>
${H.galat.length ? `<div class=galat><b>Tidak bisa diekspor:</b><ul>${H.galat.map((g) => `<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}
<button class=p data-a="x.ekspor" ${H.galat.length || !J.length && !M.length ? 'disabled' : ''}>Unduh data POS (.json)</button>
<p class=c>Impor di akuntansiApp: tab Data › Impor data POS. Aman diulang: baris POS- pada rentang yang sama diganti.</p></div>`;
    }
    h += `<div class=card><h3>3. Backup lokal POS</h3><div class=bar><button class=x data-a="x.backup">Unduh backup</button><label>Pulihkan dari backup<input type=file accept=.json data-b="x.pulih"></label><button class=k data-a="x.reset">Hapus semua data POS</button></div></div>`;
    return h;
  };
  A['x.segar'] = () => U.render();
  A['x.templat'] = async (el) => {
    const berkas = el.files && el.files[0]; el.value = '';
    if (!berkas) return;
    let t;
    try { t = JSON.parse(await berkas.text()); } catch (e) { return U.toast('Berkas bukan JSON yang valid.', true); }
    const err = POS.kontrak.periksaTemplat(t);
    if (err) return U.toast(err, true);
    const S = U.s();
    if (S.tpl && S.tpl.unit !== t.unit) return U.toast('Template untuk unit ' + t.unit + ', POS ini untuk ' + S.tpl.unit + '.', true);
    const buang = S.tx.filter((x) => x.tgl <= t.posisiStok).length;
    if (S.tpl && !confirm('Pakai template baru periode ' + t.periode.tahun + '-' + String(t.periode.bulan).padStart(2, '0') + '?\n' + buang + ' transaksi bertanggal sampai ' + t.posisiStok + ' akan dibuang dari POS (sudah tercermin di stok awal template).')) return;
    S.tx = S.tx.filter((x) => x.tgl > t.posisiStok);
    S.tpl = t;
    t.barang.forEach((b) => { const a = S.barang.find((x) => x.k === b.k); if (a) { a.n = b.n; a.akun = b.akun; } else S.barang.push({ k: b.k, n: b.n, akun: b.akun, harga: 0, hargaBeli: 0 }); });
    if (!S.pemasok.length) S.pemasok.push({ id: 's' + (++S.seq), nama: 'Pemasok umum', akun: t.pemetaan.utangUsaha, saldoAwal: 0 });
    F.ekspor = { dari: '', sampai: '' };
    simpan(); U.toast('Template diimpor'); U.render();
  };
  A['x.ekspor'] = async () => {
    const S = U.s(), f = F.ekspor, H = U.hasil();
    if (H.galat.length) return U.toast('Perbaiki galat dulu.', true);
    if (f.dari > f.sampai) return U.toast('Rentang tanggal terbalik.', true);
    const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
    const pos = await POS.kontrak.bangunData(S, H, { dari: f.dari, sampai: f.sampai, idBatch: id, now: new Date().toISOString() });
    unduh('KDMP_POS_data_' + S.tpl.unit + '_' + f.dari + '_' + f.sampai + '.json', JSON.stringify(pos, null, 1));
    U.toast('Data POS diunduh (' + pos.jurnal.length + ' jurnal, ' + pos.mutasiStok.length + ' mutasi)');
  };
  A['x.backup'] = () => unduh('KDMP_POS_backup_' + U.hariIni() + '.json', JSON.stringify(U.s()));
  A['x.pulih'] = async (el) => {
    const berkas = el.files && el.files[0]; el.value = '';
    if (!berkas) return;
    let d; try { d = JSON.parse(await berkas.text()); } catch (e) { return U.toast('Berkas bukan JSON yang valid.', true); }
    if (!d || !Array.isArray(d.tx) || !Array.isArray(d.barang)) return U.toast('Bukan backup POS.', true);
    if (!confirm('Ganti seluruh data POS saat ini dengan backup ini?')) return;
    POS.ganti(Object.assign(POS.simpan.kosong(), d)); F.ekspor = { dari: '', sampai: '' };
    simpan(); U.toast('Backup dipulihkan'); U.render();
  };
  A['x.reset'] = async () => {
    if (!confirm('Hapus SEMUA data POS (transaksi, master, template) di perangkat ini?\nUnduh backup dulu bila perlu.')) return;
    if (!confirm('Yakin? Tindakan ini tidak bisa dibatalkan.')) return;
    POS.ganti(POS.simpan.kosong()); await POS.simpan.simpanSekarang(U.s()); F.ekspor = { dari: '', sampai: '' }; U.pergi('Ekspor/Impor');
  };
})(globalThis.POS = globalThis.POS || {});

</script>
<script>
window.addEventListener('error', function (e) { var m = document.getElementById('isi'); if (m) m.insertAdjacentHTML('afterbegin', '<div class="galat">Galat: ' + String(e.message).replace(/</g, '&lt;') + '</div>'); });
POS.mulai();
</script>
</body>
</html>
