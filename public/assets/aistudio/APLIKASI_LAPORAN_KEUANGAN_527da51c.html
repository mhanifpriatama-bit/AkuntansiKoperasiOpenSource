<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDMP Akuntansi</title>
<style>
:root{--c:#A4161F;--cd:#7F1018;--ct:#F9ECEC;--cl:#E4D3D4;--ink:#262122;--mut:#6F6667;--bg:#F5F2F0}
*{box-sizing:border-box}
body{font:13px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
header{background:#fff;border-top:5px solid var(--c);border-bottom:1px solid var(--cl);padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:280px}
.brand img{height:48px;width:auto}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{color:var(--mut)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{color:var(--mut)}
nav{display:flex;background:#fff;border-bottom:1px solid var(--cl);padding:0 12px;flex-wrap:wrap}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut)}
nav button:hover{background:none;color:var(--ink)}
nav button.on{color:var(--c);border-bottom-color:var(--c)}
main{padding:16px;max-width:1360px;margin:auto;overflow-x:auto}
table{border-collapse:collapse;background:#fff;width:100%}
td,th{border:1px solid #e8dede;padding:4px 7px}
th{background:var(--cd);color:#fff;font-weight:600;text-align:left}
td.n{text-align:right;white-space:nowrap}
.h1{background:#F0D9DA;font-weight:bold}
.h2{background:var(--ct);font-weight:bold}
.t{font-weight:bold;background:#f1ecec}
.g{background:var(--c);color:#fff;font-weight:bold}
input,select{font:inherit;border:1px solid #d9cbcc;border-radius:3px;padding:4px 6px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #e9b6b9;outline-offset:-1px}
input.i{width:100%;border:0;border-radius:0;padding:3px;background:transparent;color:#173a85;text-align:inherit}
td select{width:100%;border:0;background:transparent;padding:3px}
.bad{background:#fbe1e1}
.ok{color:#1d6b32;font-weight:bold}
.no{color:#b00018;font-weight:bold}
.bar{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
button,.btn{padding:6px 13px;cursor:pointer;border:1px solid var(--c);background:#fff;color:var(--c);border-radius:3px;font:inherit;display:inline-block}
button:hover,.btn:hover{background:var(--ct)}
button.p{background:var(--c);color:#fff}
button.p:hover{background:var(--cd)}
.sbar{gap:0;margin:4px 0 12px}
.sbar button{border-radius:0;margin-right:-1px;color:var(--ink);border-color:var(--cl)}
.sbar button.on{background:var(--c);border-color:var(--c);color:#fff}
.c{color:#777;font-size:11px}
h4{margin:16px 0 6px;color:var(--c);font-size:14px}
.sv{font-size:12px;padding:2px 8px;border-radius:3px;background:#f3eeee}
.sv.k{color:#1d6b32}.sv.w{color:#9a5a00}
.dd{position:relative}
.dd summary{list-style:none;padding:6px 13px;border:1px solid var(--c);color:var(--c);cursor:pointer;border-radius:3px;background:#fff}
.dd summary::-webkit-details-marker{display:none}
.dd[open] summary{background:var(--ct)}
.dd div{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--cl);z-index:15;min-width:240px;box-shadow:0 3px 8px #0002}
.dd div button{display:block;width:100%;text-align:left;border:0;border-radius:0;color:var(--ink);padding:8px 12px}
.hd{display:flex;align-items:center;gap:14px;line-height:1.5;margin:6px 0 14px;padding-bottom:8px;border-bottom:3px double var(--c)}
.hd:after{content:"";width:84px}
.hd img{height:84px;width:auto}
.hd .ht{flex:1;text-align:center}
.hd h3{margin:8px 0 4px;font-size:16px}
table.sg,table.sg td{border:0;background:none}
.lg{max-width:410px;margin:36px auto;background:#fff;padding:24px 28px 18px;border-top:5px solid var(--c);box-shadow:0 1px 5px #0002}
.lg img{height:112px;display:block;margin:0 auto 6px}
.lg h2{margin:0;text-align:center;font-size:17px}
.lg .sub{text-align:center;color:var(--mut);margin-bottom:14px}
.lg label{display:block;margin-top:9px}
.lg input,.lg select{width:100%;margin-top:3px}
.lg button{margin-top:12px}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:3px;display:none;z-index:30}
#ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto}
.dt{position:relative;display:flex;align-items:center;min-width:120px}.dt .dti{flex:1;min-width:88px}.dtb{border:0;background:none;padding:0 4px;cursor:pointer;font-size:14px;line-height:1}.dtb:hover{background:none}.dtp{position:absolute;right:0;top:0;width:28px;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;border:0}.dtp::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
@page{margin:12mm}
@media print{header,nav,.bar,p.c,#tt,.dd{display:none}main{padding:0;max-width:none;overflow:visible}main button{display:none}body{background:#fff}input.i{color:#000}th,.h1,.h2,.t,.g,.hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{page-break-inside:avoid}}
</style></head><body>

function grid(p,cols,note,dk){const a=SUB(p),PP=S.tahun*12+B(),vis=[];a.forEach((r,i)=>{if(!dk||!r[dk]||ymOf(r[dk])==PP||KEEP.has(r))vis.push(i)});let h=`<div class=bar><button class=p onclick="gAdd('${p}')">+ Baris</button><button onclick="gAdd('${p}',10)">+10 Baris</button><span class=c>${dk?'<b>Periode '+MON[B()-1]+' '+S.tahun+'</b> ('+vis.length+' baris). Ganti bulan/tahun di kanan atas untuk periode lain; data periode sebelumnya tetap tersimpan. ':''}${note||''}</span></div><table><tr><th>#</th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr>`;
 vis.forEach((i,ix)=>{const r=a[i];h+=`<tr><td class=c>${ix+1}</td>`+cols.map(c=>{const v=r[c.k];if(c.t=='date')return `<td>${dfield(v,p+':'+i+':'+c.k,dk==c.k)}</td>`;if(c.o)return `<td><select onchange="gSet('${p}',${i},'${c.k}',this.value)"><option></option>${OPT(c.o,v)}</select></td>`;if(c.m)return `<td class="n"${c.w?` style="min-width:${c.w}px"`:''}><input class="i n" inputmode=numeric value="${fmtN(v)}" oninput="nIn(this)" onchange="gNum('${p}',${i},'${c.k}',this)"></td>`;const n=c.t=='number';return `<td class="${n?'n':''}"${c.w?` style="min-width:${c.w}px"`:''}><input class="i ${n?'n':''}" type="${c.t||'text'}"${c.list?' list='+c.list:''} value="${esc(v)}" onchange="gSet('${p}',${i},'${c.k}',this.value,${n})"></td>`}).join('')+`<td><button onclick="gDel('${p}',${i})">\u00d7</button></td></tr>`});
 return h+'</table>'}
function gAdd(p,n){const a=SUB(p);for(let i=0;i<(n||1);i++){const o=PD[p]?PD[p]():{};a.push(o);KEEP.add(o)};save();go()}
function askPw(msg){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';o.innerHTML='<form style="background:#fff;color:#222;padding:18px;border-radius:8px;min-width:280px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.3)"><p style="margin:0 0 10px">'+msg+'</p><input type=password autocomplete=current-password style="width:100%;box-sizing:border-box;padding:6px;margin-bottom:10px"><div style="text-align:right"><button type=button class=b>Batal</button> <button type=submit class=p>Lanjut</button></div></form>';document.body.appendChild(o);const i=o.querySelector('input'),end=v=>{o.remove();res(v)};i.focus();o.querySelector('form').onsubmit=e=>{e.preventDefault();end(i.value)};o.querySelector('.b').onclick=()=>end(null)})}
async function hapusSemua(){const p=await askPw('Masukkan <b>sandi login</b> untuk menghapus semua data unit ini:');if(p===null)return;if(p!==PIN)return alert('Sandi salah. Data tidak dihapus.');if(!confirm('Hapus semua data unit ini? Tindakan ini tidak bisa dibatalkan.'))return;S.rows=[];KEEP.clear();save();go('Jurnal')}
function gNum(p,i,k,el){const v=idn(el.value);SUB(p)[i][k]=v;el.value=fmtN(v);save()}
function gSet(p,i,k,v,n){SUB(p)[i][k]=n?(+v||0):v;save()}
function gDel(p,i){if(confirm('Hapus baris ini?')){SUB(p).splice(i,1);save();go()}}
function svw(tab,list){const cur=list.includes(SV[tab])?SV[tab]:list[0];SV[tab]=cur;return[cur,`<div class="bar sbar">${list.map(x=>`<button class="${x==cur?'on':''}" onclick="SV['${tab}']='${x}';go()">${x}</button>`).join('')}</div>`]}
function rekon(rows,jd){let h=`<h4>${jd||'Rekonsiliasi dengan Buku Besar'}</h4><table><tr><th>Akun</th><th>Buku Pembantu</th><th>Buku Besar</th><th>Selisih</th><th>Status</th></tr>`;rows.forEach(([l,s,g])=>{const d=s-g,ok=Math.round(d)==0;h+=`<tr><td>${l}</td>${nc(s)}${nc(g)}${nc(d)}<td class="${ok?'ok':'no'}">${ok?'Sesuai':'Selisih'}</td></tr>`});return h+'</table>'}
const pick=(key,lid,ph)=>`<div class=bar><label>${ph}: <input list=${lid} style=width:220px value="${esc(SEL[key]||'')}" onchange="SEL['${key}']=this.value.trim();go()"></label></div>`,
 totRow=(cells,cls)=>`<tr class="${cls||'g'}">${cells}</tr>`;

const CAT={'Tanah':['1.3.1.01','',''],'Bangunan':['1.3.2.01','1.3.9.01','6.1.8.01'],'Peralatan dan Mesin':['1.3.3.01','1.3.9.02','6.1.8.02'],'Meubelair':['1.3.3.02','1.3.9.03','6.1.8.03'],'Rak':['1.3.3.03','1.3.9.03','6.1.8.03'],'Inventaris':['1.3.3.04','1.3.9.05','6.1.8.05'],'Kendaraan':['1.3.4.01','1.3.9.04','6.1.8.04'],'Tabung Gas':['1.3.5.01','1.3.9.02','6.1.8.02']},KAT=Object.keys(CAT);
const aktif=(a,P)=>!!a.tgl&&ymOf(a.tgl)<=P&&(!a.lepas||ymOf(a.lepas)>=P);
function akumAt(a,P){const c=num(a.hp),rs=Math.min(num(a.res),c),um=Math.round(num(a.umur)*12),ct=CAT[a.kat];if(!a.tgl||!c||um<=0||!ct||!ct[1])return 0;const Q=a.lepas?Math.min(P,ymOf(a.lepas)):P,n=Math.max(0,Math.min(Q-ymOf(a.tgl)+1,um));if(a.met=='Saldo Menurun'){const r=2/(um/12)/12;return c-Math.max(rs,c*Math.pow(1-r,n))}return(c-rs)*n/um}
function asetCalc(){const P=S.tahun*12+B(),Py=S.tahun*12;return SUB('aset').map(a=>{const ak=aktif(a,P),pv=ak?Math.round(akumAt(a,P-1)):0,cu=ak?Math.round(akumAt(a,P)):0,bl=cu-pv;return{a,ak,cost:ak?num(a.hp):0,akum:pv+bl,bln:bl,ytd:ak?pv-Math.round(akumAt(a,Py)):0,nb:ak?num(a.hp)-cu:0,st:!a.tgl?'-':ymOf(a.tgl)>P?'Belum diperoleh':(a.lepas&&ymOf(a.lepas)<P)?'Dilepas':'Aktif'}})}
function depJurnal(){const rs=asetCalc(),g={};rs.forEach(r=>{const c=CAT[r.a.kat];if(!c||!c[1]||Math.abs(r.bln)<.5)return;const k=c[2]+'|'+c[1];g[k]=(g[k]||0)+r.bln});if(!Object.keys(g).length)return alert('Tidak ada beban penyusutan pada bulan ini.');const no='DEP-'+S.tahun+P2(B()),ex=S.rows.filter(r=>r.no==no);if(ex.length&&!confirm('Jurnal penyusutan bulan ini sudah ada ('+ex.length+' baris) dan akan DIGANTI. Lanjut?'))return;S.rows=S.rows.filter(r=>r.no!=no);const d=asof(),ket='Penyusutan '+MON[B()-1]+' '+S.tahun;Object.entries(g).forEach(([k,v])=>{const[b,a]=k.split('|'),x=Math.round(v);S.rows.push({d,no,ak:b+' '+cn(b),db:x,kr:0,ket});S.rows.push({d,no,ak:a+' '+cn(a),db:0,kr:x,ket})});save();go();toast('Jurnal penyusutan dibuat (lihat tab Jurnal)')}
R['BP Aset']=function(){const[v,bar]=svw('BP Aset',['Daftar Aset','Jadwal Penyusutan','Rekonsiliasi & Jurnal']);let h=bar;
 if(v=='Daftar Aset')h+=grid('aset',[{k:'kode',l:'Kode Aset',w:90},{k:'nama',l:'Nama Aset',w:220},{k:'kat',l:'Kategori',o:KAT},{k:'tgl',l:'Tgl Perolehan',t:'date'},{k:'hp',l:'Harga Perolehan',t:'number',m:1,w:120},{k:'res',l:'Nilai Residu',t:'number',m:1,w:100},{k:'umur',l:'Umur (tahun)',t:'number',w:70},{k:'met',l:'Metode',o:['Garis Lurus','Saldo Menurun']},{k:'lepas',l:'Tgl Lepas (opsional)',t:'date'}],'Penyusutan dihitung mulai bulan perolehan. Tanah tidak disusutkan. Saldo Menurun memakai tarif 2 \u00d7 (1/umur).');
 else if(v=='Jadwal Penyusutan'){const rs=asetCalc(),T={cost:0,bln:0,ytd:0,akum:0,nb:0},G={};h+=hd('BUKU PEMBANTU ASET TETAP DAN PENYUSUTAN')+'<table><tr><th>Kode</th><th>Nama Aset</th><th>Kategori</th><th>Tgl Perolehan</th><th>Umur (thn)</th><th>Metode</th><th>Status</th><th>Harga Perolehan</th><th>Beban Bulan Ini</th><th>Beban Tahun Berjalan</th><th>Akumulasi Penyusutan</th><th>Nilai Buku</th></tr>';
  rs.forEach(r=>{const a=r.a;for(const k in T)T[k]+=r[k];const g=G[a.kat||'-']=G[a.kat||'-']||{cost:0,bln:0,ytd:0,akum:0,nb:0};for(const k in T)g[k]+=r[k];h+=`<tr${r.ak?'':' style="color:#999"'}><td>${esc(a.kode)}</td><td>${esc(a.nama)}</td><td>${esc(a.kat)}</td><td>${dmy(a.tgl)}</td><td class=n>${esc(a.umur||'')}</td><td>${esc(a.met||'')}</td><td>${r.st}</td>${nc(r.cost)}${nc(r.bln)}${nc(r.ytd)}${nc(r.akum)}${nc(r.nb)}</tr>`});
  h+=totRow(`<td colspan=7>JUMLAH</td>${nc(T.cost)}${nc(T.bln)}${nc(T.ytd)}${nc(T.akum)}${nc(T.nb)}`)+'</table><h4>Rekap per Kategori</h4><table><tr><th>Kategori</th><th>Harga Perolehan</th><th>Beban Bulan Ini</th><th>Beban Tahun Berjalan</th><th>Akumulasi Penyusutan</th><th>Nilai Buku</th></tr>';
  Object.keys(G).forEach(k=>{const g=G[k];h+=`<tr><td>${esc(k)}</td>${nc(g.cost)}${nc(g.bln)}${nc(g.ytd)}${nc(g.akum)}${nc(g.nb)}</tr>`});h+='</table>'+sig()}
 else{const{o}=unitData(),rs=asetCalc(),cost={},ak={};rs.forEach(r=>{const c=CAT[r.a.kat];if(!c)return;cost[c[0]]=(cost[c[0]]||0)+r.cost;if(c[1])ak[c[1]]=(ak[c[1]]||0)+r.akum});
  const ca=[...new Set(KAT.map(k=>CAT[k][0]))],aa=[...new Set(KAT.filter(k=>CAT[k][1]).map(k=>CAT[k][1]))],ra=(l,m)=>l.filter(c=>Math.abs(m[c]||0)>.5||Math.abs(o.cum[c]||0)>.5).map(c=>[c+' '+cn(c),m[c]||0,o.cum[c]||0]);
  h+=hd('REKONSILIASI ASET TETAP')+rekon(ra(ca,cost),'Harga Perolehan')+rekon(ra(aa,ak),'Akumulasi Penyusutan')+`<div class=bar><button class=p onclick=depJurnal()>Buat jurnal penyusutan bulan ${MON[B()-1]}</button><span class=c>Membuat jurnal Debit Beban Penyusutan / Kredit Akumulasi Penyusutan di tab Jurnal (no bukti DEP-${S.tahun}${P2(B())}). Jika dibuat ulang, jurnal lama bulan itu diganti.</span></div>`}
 $('#m').innerHTML=h};

function stokCalc(cut){const m={};SUB('pb').forEach(x=>{if(x.k)m[x.k]={it:x,q:0,v:0,h:[],in:0,out:0,vin:0,vout:0}});const mon=ymOf(cut),unk=[];
 SUB('pm').map((t,i)=>({t,i})).filter(x=>x.t.d&&x.t.d<=cut&&x.t.k).sort(byD).forEach(({t})=>{const r=m[t.k];if(!r){unk.push(t);return}const q=num(t.q);let cost,iq=0,oq=0;if(t.j=='Keluar'){const avg=r.q>0?r.v/r.q:0;cost=q*avg;r.q-=q;r.v-=cost;oq=q}else{cost=q*num(t.h);r.q+=q;r.v+=cost;iq=q}
  r.h.push({t,iq,oq,cost,q:r.q,v:r.v});if(ymOf(t.d)==mon){if(oq){r.out+=oq;r.vout+=cost}else{r.in+=iq;r.vin+=cost}}});return{m,unk}}
R['BP Persediaan']=function(){const[v,bar]=svw('BP Persediaan',['Master Barang','Mutasi Stok','Kartu Stok','Rekap & Rekonsiliasi']);let h=bar;
 const akn=COA.filter(a=>a[0].startsWith('1.1.4.')).map(a=>[a[0],a[0]+' '+a[1]]),dlb='<datalist id=dlb>'+SUB('pb').filter(x=>x.k).map(x=>`<option value="${esc(x.k)}" label="${esc(x.n)}">`).join('')+'</datalist>';
 if(v=='Master Barang')h+=grid('pb',[{k:'k',l:'Kode Barang',w:100},{k:'n',l:'Nama Barang',w:260},{k:'akun',l:'Akun Persediaan (Buku Besar)',o:akn}],'Tiap barang dikaitkan ke akun persediaan agar bisa direkonsiliasi dengan Buku Besar.');
 else if(v=='Mutasi Stok')h+=dlb+grid('pm',[{k:'d',l:'Tanggal',t:'date'},{k:'no',l:'No Bukti',w:110},{k:'k',l:'Kode Barang',list:'dlb',w:110},{k:'j',l:'Jenis',o:['Saldo Awal','Masuk','Keluar']},{k:'q',l:'Jumlah',t:'number',w:90},{k:'h',l:'Harga Satuan (Saldo Awal/Masuk)',t:'number',w:130},{k:'ket',l:'Keterangan',w:220}],'Metode biaya: rata-rata bergerak. Mutasi Keluar dinilai otomatis dari harga rata-rata saat itu; kolom harga tidak dipakai.','d');
 else if(v=='Kartu Stok'){const c=stokCalc(asof()),r=c.m[SEL.pk];h+=dlb+pick('pk','dlb','Kode barang')+hd('KARTU STOK');if(!r)h+='<p class=c>Pilih kode barang yang sudah ada di Master Barang.</p>';else{h+=`<p><b>${esc(r.it.k)}</b> \u2014 ${esc(r.it.n)} \u00b7 Akun ${esc(r.it.akun||'-')}</p><table><tr><th>Tanggal</th><th>No Bukti</th><th>Keterangan</th><th>Masuk</th><th>Harga Masuk</th><th>Keluar</th><th>HPP Keluar</th><th>Saldo (qty)</th><th>Harga Rata-rata</th><th>Nilai Saldo</th></tr>`;
  r.h.forEach(x=>{h+=`<tr><td>${dmy(x.t.d)}</td><td>${esc(x.t.no)}</td><td>${esc(x.t.j)}${x.t.ket?' \u2014 '+esc(x.t.ket):''}</td>${x.iq?nq(x.iq):'<td class=n>-</td>'}${x.iq?nc(num(x.t.h)):'<td class=n>-</td>'}${x.oq?nq(x.oq):'<td class=n>-</td>'}${x.oq?nc(x.cost):'<td class=n>-</td>'}${nq(x.q)}${nc(x.q>0?x.v/x.q:0)}${nc(x.v)}</tr>`});h+='</table>'+sig()}}
 else{const c=stokCalc(asof()),p=stokCalc(prevEnd()),{o}=unitData(),L=Object.values(c.m).sort((a,b)=>((a.it.akun||'')+a.it.k)<((b.it.akun||'')+b.it.k)?-1:1),A={};
  h+=hd('REKAP PERSEDIAAN BARANG')+'<table><tr><th>Kode</th><th>Nama Barang</th><th>Saldo Awal Bulan</th><th>Masuk</th><th>Keluar</th><th>Saldo Akhir</th><th>Harga Rata-rata</th><th>Nilai Persediaan</th><th>HPP Keluar Bulan Ini</th></tr>';let tv=0,to=0;const neg=[];
  L.forEach(r=>{const a=p.m[r.it.k]||{q:0};tv+=r.v;to+=r.vout;const ak=r.it.akun||'(belum diisi)';A[ak]=(A[ak]||0)+r.v;if(r.q<-1e-9)neg.push(r.it.k);h+=`<tr><td>${esc(r.it.k)}</td><td>${esc(r.it.n)}</td>${nq(a.q)}${nq(r.in)}${nq(r.out)}${nq(r.q)}${nc(r.q>0?r.v/r.q:0)}${nc(r.v)}${nc(r.vout)}</tr>`});
  h+=totRow(`<td colspan=7>JUMLAH</td>${nc(tv)}${nc(to)}`)+'</table>';
  if(neg.length)h+=`<p class=no>Stok minus pada: ${neg.map(esc).join(', ')} \u2014 periksa mutasi Keluar yang melebihi stok.</p>`;if(c.unk.length)h+=`<p class=no>${c.unk.length} mutasi memakai kode barang yang tidak ada di Master Barang dan tidak dihitung.</p>`;
  const gl=a=>a[0].startsWith('1.1.4.')&&(Math.abs(o.cum[a[0]]||0)>.5||Math.abs(A[a[0]]||0)>.5);h+=rekon(COA.filter(gl).map(a=>[a[0]+' '+a[1],A[a[0]]||0,o.cum[a[0]]||0]))+sig()}
 $('#m').innerHTML=h};
