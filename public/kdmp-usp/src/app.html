<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USP Koperasi Merah Putih</title>
<style>
:root{--m:#b3261e;--g:#1f2937;--l:#e5e7eb;--b:#f8fafc}
*{box-sizing:border-box}body{font:14px/1.45 system-ui,sans-serif;margin:0;color:var(--g);background:var(--b)}
header{background:var(--m);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
header b{font-size:16px}nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--l)}
nav button{border:1px solid var(--l);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer}nav button.on{background:var(--m);color:#fff;border-color:var(--m)}
main{padding:16px;max-width:1100px;margin:auto}h3,h4{margin:.6em 0 .3em}
.k{background:#fff;border:1px solid var(--l);border-radius:8px;padding:12px;margin:0 0 12px}
.baris{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.baris label{display:flex;flex-direction:column;font-size:12px;gap:2px}
input,select,button{font:inherit;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px}button{cursor:pointer;background:#fff}button.p{background:var(--m);color:#fff;border-color:var(--m)}
table{border-collapse:collapse;width:100%;margin:6px 0}th,td{border-bottom:1px solid var(--l);padding:5px 8px;text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.c{color:#6b7280;font-size:12px}.no{color:var(--m)}.ok{color:#15803d}#pesan{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:8px;color:#fff;display:none;z-index:9}
#kunci{max-width:360px;margin:12vh auto}
@media print{header,nav,.tdk{display:none!important}.k{border:0}}
</style></head><body>
<div id="akar"></div><div id="pesan"></div>
