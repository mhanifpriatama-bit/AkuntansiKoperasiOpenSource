<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDMP Akuntansi</title>
<style>
/* Variabel warna & dasar halaman */
:root{--c:#A4161F;--cd:#7F1018;--ct:#F9ECEC;--cl:#E4D3D4;--ink:#262122;--mut:#6F6667;--bg:#F5F2F0}
*{box-sizing:border-box}
body{font:13px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}

</style>
<style>
/* Header, navigasi, kerangka utama */
header{background:#fff;border-top:5px solid var(--c);border-bottom:1px solid var(--cl);padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:280px}
.brand img{height:48px;width:auto}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{color:var(--mut)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{color:var(--mut)}
nav{display:flex;background:#fff;border-bottom:1px solid var(--cl);padding:0 12px;flex-wrap:wrap}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut)}
nav button:hover{background:none;color:var(--ink)}
nav button.on{color:var(--c);border-bottom-color:var(--c)}
main{padding:16px;max-width:1360px;margin:auto;overflow-x:auto}

</style>
<style>
/* Tabel & kelas baris laporan (h1,h2,t,g) */
table{border-collapse:collapse;background:#fff;width:100%}
td,th{border:1px solid #e8dede;padding:4px 7px}
th{background:var(--cd);color:#fff;font-weight:600;text-align:left}
td.n{text-align:right;white-space:nowrap}
.h1{background:#F0D9DA;font-weight:bold}
.h2{background:var(--ct);font-weight:bold}
.t{font-weight:bold;background:#f1ecec}
.g{background:var(--c);color:#fff;font-weight:bold}

</style>
<style>
/* Input, tombol, status */
input,select{font:inherit;border:1px solid #d9cbcc;border-radius:3px;padding:4px 6px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #e9b6b9;outline-offset:-1px}
input.i{width:100%;border:0;border-radius:0;padding:3px;background:transparent;color:#173a85;text-align:inherit}
td select{width:100%;border:0;background:transparent;padding:3px}
.bad{background:#fbe1e1}
.ok{color:#1d6b32;font-weight:bold}
.no{color:#b00018;font-weight:bold}
.bar{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
button,.btn{padding:6px 13px;cursor:pointer;border:1px solid var(--c);background:#fff;color:var(--c);border-radius:3px;font:inherit;display:inline-block}
button:hover,.btn:hover{background:var(--ct)}
button.p{background:var(--c);color:#fff}
button.p:hover{background:var(--cd)}

</style>
<style>
/* Bar sub-tab, dropdown Unduh, kop laporan, login, toast, input tanggal */
.sbar{gap:0;margin:4px 0 12px}
.sbar button{border-radius:0;margin-right:-1px;color:var(--ink);border-color:var(--cl)}
.sbar button.on{background:var(--c);border-color:var(--c);color:#fff}
.c{color:#777;font-size:11px}
h4{margin:16px 0 6px;color:var(--c);font-size:14px}
.sv{font-size:12px;padding:2px 8px;border-radius:3px;background:#f3eeee}
.sv.k{color:#1d6b32}.sv.w{color:#9a5a00}
.dd{position:relative}
.dd summary{list-style:none;padding:6px 13px;border:1px solid var(--c);color:var(--c);cursor:pointer;border-radius:3px;background:#fff}
.dd summary::-webkit-details-marker{display:none}
.dd[open] summary{background:var(--ct)}
.dd div{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--cl);z-index:15;min-width:240px;box-shadow:0 3px 8px #0002}
.dd div button{display:block;width:100%;text-align:left;border:0;border-radius:0;color:var(--ink);padding:8px 12px}
.hd{display:flex;align-items:center;gap:14px;line-height:1.5;margin:6px 0 14px;padding-bottom:8px;border-bottom:3px double var(--c)}
.hd:after{content:"";width:84px}
.hd img{height:84px;width:auto}
.hd .ht{flex:1;text-align:center}
.hd h3{margin:8px 0 4px;font-size:16px}
table.sg,table.sg td{border:0;background:none}
.lg{max-width:410px;margin:36px auto;background:#fff;padding:24px 28px 18px;border-top:5px solid var(--c);box-shadow:0 1px 5px #0002}
.lg img{height:112px;display:block;margin:0 auto 6px}
.lg h2{margin:0;text-align:center;font-size:17px}
.lg .sub{text-align:center;color:var(--mut);margin-bottom:14px}
.lg label{display:block;margin-top:9px}
.lg input,.lg select{width:100%;margin-top:3px}
.lg button{margin-top:12px}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:3px;display:none;z-index:30}
#ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto}
.dt{position:relative;display:flex;align-items:center;min-width:120px}.dt .dti{flex:1;min-width:88px}.dtb{border:0;background:none;padding:0 4px;cursor:pointer;font-size:14px;line-height:1}.dtb:hover{background:none}.dtp{position:absolute;right:0;top:0;width:28px;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;border:0}.dtp::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}

</style>
<style>
/* Aturan cetak / PDF */
@page{margin:12mm}
@media print{header,nav,.bar,p.c,#tt,.dd{display:none}main{padding:0;max-width:none;overflow:visible}main button{display:none}body{background:#fff}input.i{color:#000}th,.h1,.h2,.t,.g,.hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{page-break-inside:avoid}}

</style>
</head>
<body>
<header><div class=brand><img id=lg alt="Logo"><div><b id=ttl></b><small id=nm-koperasi></small></div></div>
<div class=ctl><label>Periode s.d. <select id=bln></select></label><input id=thn type=number style=width:74px><span id=st></span><span id=sync style="font-size:11px;color:#cfe"></span><span id=sv class="sv k">Siap</span>
<button class=p data-aksi="simpan.manual">Simpan</button>
<details class=dd><summary>Unduh</summary><div>
<button data-aksi="ekspor.excel">Excel (.xls) &#8212; tampilan ini</button>
<button data-aksi="ekspor.csv">CSV &#8212; tampilan ini</button>
<button data-aksi="ekspor.cetak">PDF / Cetak &#8212; tampilan ini</button>
<button data-aksi="ekspor.excelSemua">Semua laporan sekaligus (Excel)</button>
<button data-aksi="backup.unduh">Unduh Backup Database (.json)</button>
<button data-aksi="backup.pilihBerkas">Pulihkan dari Backup (.json)</button><input id=rf type=file accept=.json style=display:none data-aksi-ubah="backup.pulihkan">
</div></details>
<button data-aksi="ekspor.cetak">Cetak / PDF</button></div></header><nav id=nav></nav><main id=m>Memuat&#8230;</main><datalist id=dl></datalist><div id=ov style="padding:24px;font:14px sans-serif">Memuat aplikasi&#8230;</div><div id=tt></div>
<script>
/* Penanganan error global: menampilkan pesan bila aplikasi gagal dimuat. */
window.__ok=0;
window.__err=function(m){var o=document.getElementById('ov');if(!o||window.__ok==2)return;o.style.display='block';o.innerHTML='<div style="max-width:620px;margin:30px auto;padding:20px;background:#fff;border-top:5px solid #A4161F;font:14px sans-serif"><b>Aplikasi gagal dimuat.</b><br><br>'+String(m)+'<br><br><small>Kirim tulisan ini (atau screenshot-nya) agar bisa diperbaiki.</small></div>'};
window.onerror=function(m,s,l,c){window.__err(m+' ('+String(s).split('/').pop()+' baris '+l+':'+c+')')};
window.addEventListener('unhandledrejection',function(e){window.__err((e.reason&&e.reason.message)||e.reason)});

</script>
<script>
/*
 * Namespace tunggal aplikasi: semua kode berada di bawah `KDMP`, tidak ada variabel global lain.
 *
 *   KDMP.config   data konfigurasi (COA, spesifikasi laporan, identitas koperasi)  -> js/config/
 *   KDMP.core     logika akuntansi murni, TANPA DOM dan TANPA state global       -> js/core/
 *   KDMP.storage  IndexedDB, titik pulih, backup                                  -> js/storage/
 *   KDMP.security kripto dan manajemen kunci/sandi                                -> js/security/
 *   KDMP.ui       komponen tampilan yang dipakai banyak fitur                     -> js/ui/
 *   KDMP.app      state sesi, navigasi, login, sinkronisasi                       -> js/app/
 *   KDMP.fitur    satu berkas per tab (Jurnal, Neraca, BP Aset, ...)              -> js/fitur/
 *
 * Berkas dimuat sebagai skrip biasa (bukan ES module) agar tetap berjalan bila index.html
 * dibuka langsung dari folder (file://). Urutan muat ada di index.html.
 */
(function (root) {
  'use strict';
  const KDMP = (root.KDMP = root.KDMP || {});
  ['config', 'core', 'storage', 'security', 'ui', 'app', 'fitur'].forEach(function (n) {
    KDMP[n] = KDMP[n] || {};
  });
})(globalThis);

</script>
<script>
/*
 * State sesi aplikasi: SATU objek yang menggantikan variabel global kode lama (S, K, CFG.unit, tab, ...).
 * Modul lain membacanya lewat KDMP.app.state.
 */
(function (KDMP) {
  'use strict';

  const state = {
    data: null,        // data unit/konsolidasi yang sedang dibuka (dulu: S). Lihat docs/struktur-data.md
    konsol: false,     // true bila login sebagai Konsolidasi (dulu: K)
    unit: null,        // 'USP' | 'Sembako' | 'KONSOL' (dulu: CFG.unit)
    konfig: null,      // konfigurasi laporan unit aktif {name, color, LPK, LR} (dulu: CFG.name/LPK/LR)
    tab: null,         // nama tab aktif
    tabs: [],          // daftar tab untuk sesi ini
    akunBB: '1.1.1.01',// akun yang sedang dilihat di Buku Besar
    sv: {},            // sub-tab terpilih per tab (BP Aset, BP Persediaan)
    sel: {},           // pilihan dropdown di buku pembantu
    keep: new Set(),   // baris yang baru ditambah: tetap tampil walau di luar periode sampai tanggalnya diisi
    kunci: { DK: null, RAW: null, PIN: null, META: null, KEY: null } // kunci sesi (hanya di memori)
  };

  const bulan = () => +state.data.bulan;
  const periode = () => state.data.tahun * 12 + bulan();
  /** Daftar baris buku pembantu bernama k (dibuat bila belum ada). */
  const sub = (k) => state.data.sub[k] || (state.data.sub[k] = []);

  KDMP.app.state = state;
  KDMP.app.bulan = bulan;
  KDMP.app.periode = periode;
  KDMP.app.sub = sub;
  KDMP.app.tab = {}; // pendaftaran tab: KDMP.app.tab[nama] = { render() }
})(globalThis.KDMP);

</script>

<script>
/*
 * Format angka, tanggal, dan teks. Fungsi murni (tanpa DOM, tanpa state).
 * Tanggal disimpan sebagai teks ISO "yyyy-mm-dd"; "periode" = tahun*12 + bulan (angka bulat) supaya mudah dibandingkan.
 */
(function (KDMP) {
  'use strict';
  const NAMA_BULAN = KDMP.config.aplikasi.namaBulan;

  const pad2 = (n) => String(n).padStart(2, '0');

  /** Kode akun dari teks "1.1.1.01 Kas Tunai" -> "1.1.1.01". */
  const kodeAkun = (ak) => (ak || '').split(' ')[0];

  /** Rupiah bulat: negatif dalam kurung, nol menjadi "-". */
  function rupiah(n) {
    if (Math.abs(n) < 0.5) return '-';
    return n < 0 ? '(' + Math.round(-n).toLocaleString('id-ID') + ')' : Math.round(n).toLocaleString('id-ID');
  }

  /** Angka dengan maksimal 2 desimal (untuk jumlah barang); nol menjadi "-". */
  const angka = (v) => (Math.abs(v) < 1e-9 ? '-' : (+v).toLocaleString('id-ID', { maximumFractionDigits: 2 }));

  /** Angka untuk kolom isian; nol/kosong menjadi teks kosong. */
  function angkaInput(v) {
    v = +v;
    return v ? v.toLocaleString('id-ID', { maximumFractionDigits: 2 }) : '';
  }

  /** Mengubah teks Indonesia ("1.250.000,50") menjadi angka. */
  function bacaAngka(s) {
    s = String(s == null ? '' : s).replace(/\./g, '').replace(',', '.');
    return +s.replace(/[^0-9.\-]/g, '') || 0;
  }

  /** Escape HTML untuk nilai yang disisipkan ke template. */
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

  const angkaAman = (x) => +x || 0;

  /** "2026-03-15" -> 2026*12+3. Tanggal kosong/ salah -> 0. */
  function periodeDari(tgl) {
    const p = String(tgl || '').split('-');
    return p.length > 2 ? +p[0] * 12 + +p[1] : 0;
  }

  /** "2026-03-15" -> "15/03/2026". */
  function tanggalId(v) {
    const p = String(v || '').split('-');
    return p.length == 3 && p[0].length == 4 ? p[2] + '/' + p[1] + '/' + p[0] : String(v || '');
  }

  /** [tahun, bulan, hari] -> "yyyy-mm-dd" bila tanggal valid, selain itu "". */
  function susunTanggal(a) {
    const d = new Date(a[0], a[1] - 1, a[2]);
    return d.getFullYear() == a[0] && d.getMonth() == a[1] - 1 && d.getDate() == a[2] ? a[0] + '-' + pad2(a[1]) + '-' + pad2(a[2]) : '';
  }

  /** Membaca ketikan pengguna (yyyy-mm-dd, dd/mm/yyyy, dd-mm-yy, ddmmyyyy) menjadi "yyyy-mm-dd"; salah -> "". */
  function bacaTanggal(s) {
    s = String(s || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return susunTanggal(s.split('-').map(Number));
    const m = s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2}|\d{4})$/) || s.match(/^(\d{2})(\d{2})(\d{4})$/);
    if (!m) return '';
    let y = +m[3];
    if (m[3].length == 2) y += 2000;
    return susunTanggal([y, +m[2], +m[1]]);
  }

  function hariIni() {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /** Hari terakhir bulan, mis. (2026, 2) -> "2026-02-28". */
  const akhirBulan = (tahun, bulan) => tahun + '-' + pad2(bulan) + '-' + pad2(new Date(tahun, bulan, 0).getDate());

  /** Hari terakhir bulan sebelumnya. */
  function akhirBulanSebelumnya(tahun, bulan) {
    const d = new Date(tahun, bulan - 1, 0);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /** "31 Oktober 2026" */
  const tanggalPanjang = (tahun, bulan) => new Date(tahun, bulan, 0).getDate() + ' ' + NAMA_BULAN[bulan - 1] + ' ' + tahun;

  /** Pembanding untuk sort kronologis yang stabil: [{t:{d}, i}] */
  const urutTanggal = (a, b) => (a.t.d < b.t.d ? -1 : a.t.d > b.t.d ? 1 : a.i - b.i);

  KDMP.core.format = {
    NAMA_BULAN, pad2, kodeAkun, rupiah, angka, angkaInput, bacaAngka, esc, angkaAman, periodeDari, tanggalId,
    susunTanggal, bacaTanggal, hariIni, akhirBulan, akhirBulanSebelumnya, tanggalPanjang, urutTanggal
  };
})(globalThis.KDMP);

</script>
<script>
/*
 * Evaluator rumus penjumlahan/pengurangan sederhana, pengganti eval() pada kode lama.
 * Contoh: "[tot_pend]-[tot_hpp]" atau "E26+E18" (E<n> = nilai baris bernomor n).
 * Hanya mendukung operator + dan -, nama dalam [kurung siku] atau berbentuk E<angka>, dan angka literal.
 */
(function (KDMP) {
  'use strict';

  /**
   * @param {string} rumus
   * @param {(nama:string)=>number} nilaiDari  dipanggil dengan nama tanpa kurung siku / tanpa awalan E
   */
  function hitungRumus(rumus, nilaiDari) {
    const suku = String(rumus).replace(/\s+/g, '').match(/[+-]?[^+-]+/g) || [];
    let total = 0;
    suku.forEach(function (s) {
      let tanda = 1;
      if (s[0] == '+' || s[0] == '-') {
        if (s[0] == '-') tanda = -1;
        s = s.slice(1);
      }
      let nilai;
      if (/^\[.+\]$/.test(s)) nilai = nilaiDari(s.slice(1, -1));
      else if (/^E\d+$/.test(s)) nilai = nilaiDari(s.slice(1));
      else if (/^\d+(\.\d+)?$/.test(s)) nilai = +s;
      else throw new Error('Rumus tidak dikenali: ' + rumus);
      total += tanda * (+nilai || 0);
    });
    return total;
  }

  /** Mengubah SUM(E55:E57) menjadi E55+E56+E57. */
  function bukaSum(rumus) {
    return String(rumus).replace(/SUM\(E(\d+):E(\d+)\)/g, function (_, a, b) {
      const h = [];
      for (let n = +a; n <= +b; n++) h.push('E' + n);
      return h.join('+');
    });
  }

  KDMP.core.rumus = { hitungRumus, bukaSum };
})(globalThis.KDMP);

</script>
<script>
/*
 * Master COA (Chart of Accounts) yang sedang dipakai, beserta aturan validasi & migrasi data lama.
 *
 * Satu-satunya tempat yang memegang daftar akun. Modul lain membaca lewat KDMP.core.coa.*;
 * perubahan daftar akun selalu lewat fungsi di sini supaya peta saldo normal tetap sinkron.
 * Tidak menyentuh DOM: tampilan yang perlu diperbarui (mis. daftar pilihan akun) mendaftar lewat
 * KDMP.core.coa.saatBerubah(fungsi).
 */
(function (KDMP) {
  'use strict';
  const { kodeAkun } = KDMP.core.format;
  const legacy = KDMP.config.coaLegacy;

  const salin = (a) => JSON.parse(JSON.stringify(a));
  const bawaan = salin(KDMP.config.coa);          // daftar bawaan (tidak pernah diubah)
  let daftar = salin(KDMP.config.coa);            // daftar aktif: [[kode, nama, 'Debit'|'Kredit'], ...]
  const saldoNormal = {};                         // kode -> 'Debit'|'Kredit'
  const pendengar = [];

  /** 4 digit pertama kode yang dikenal laporan (golongan.kelompok.jenis). */
  const KELOMPOK_VALID = new Set(bawaan.map((a) => a[0].slice(0, 4)));
  const POLA_KODE = /^[1-9]\.\d\.\d\.\d{2}$/;

  const urutKode = (a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);

  function segarkan() {
    Object.keys(saldoNormal).forEach((k) => delete saldoNormal[k]);
    daftar.forEach((x) => (saldoNormal[x[0]] = x[2]));
    pendengar.forEach((f) => f());
  }

  /** Mengganti seluruh daftar akun (mis. hasil impor / muat dari database). */
  function ganti(daftarBaru) {
    daftar = daftarBaru;
    segarkan();
  }

  function urutkan() {
    daftar.sort(urutKode);
  }

  /** Nama akun dari kode; kosong bila tidak ada. */
  const nama = (kode) => (daftar.find((a) => a[0] == kode) || [])[1] || '';

  /** Saldo normal bawaan menurut golongan: aset, HPP, beban (dan 9.x non-pendapatan) = Debit. */
  function saldoNormalBawaan(kode) {
    const d = kode[0];
    return d == '1' || d == '5' || d == '6' || d == '8' || (d == '9' && kode[2] != '1') ? 'Debit' : 'Kredit';
  }

  /** Pesan kesalahan bila kode akun tidak boleh dipakai ("" bila boleh). `indeksSendiri` = baris yang sedang diedit. */
  function galatKode(kode, indeksSendiri) {
    if (!POLA_KODE.test(kode)) return 'Format kode harus x.x.x.xx, misalnya 6.1.9.24 atau 7.1.1.01 / 8.1.1.01 (awalan 1-9).';
    if (!KELOMPOK_VALID.has(kode.slice(0, 4)) && !/^[78]/.test(kode)) return 'Kelompok akun ' + kode.slice(0, 4) + ' tidak ada dalam struktur laporan.';
    if (daftar.some((a, i) => a[0] == kode && i !== indeksSendiri)) return 'Kode akun sudah ada.';
    return '';
  }

  /** Apakah baris impor COA berbentuk valid? */
  const barisImporValid = (a) =>
    Array.isArray(a) && POLA_KODE.test(a[0]) && (KELOMPOK_VALID.has(a[0].slice(0, 4)) || /^[78]/.test(a[0])) && a[1] && (a[2] == 'Debit' || a[2] == 'Kredit');

  const tambah = (kode, namaAkun, saldo) => { daftar.push([kode, namaAkun, saldo]); urutkan(); segarkan(); };
  const ubahNama = (i, v) => { daftar[i][1] = v; segarkan(); };
  const ubahKode = (i, v) => { daftar[i][0] = v; urutkan(); segarkan(); };
  const ubahSaldoNormal = (i, v) => { daftar[i][2] = v; segarkan(); };
  const hapus = (i) => { daftar.splice(i, 1); segarkan(); };
  const kembalikanBawaan = () => ganti(salin(bawaan));

  /**
   * Menyiapkan daftar akun dari nilai yang tersimpan di database ('coa').
   * Versi 3 (ada penanda '#v'): dipakai apa adanya. Versi lama: daftar bawaan + akun tambahan pengguna
   * (akun yang bukan bawaan baru dan bukan bawaan lama).
   * @returns {Array|null} daftar baru, atau null bila tidak ada yang perlu diganti
   */
  function dariTersimpan(c) {
    if (!(Array.isArray(c) && c.length)) return null;
    if (c.some((a) => a[0] == '#v' && a[1] == '3')) return c.filter((a) => a[0] != '#v');
    const bs = new Set(bawaan.map((a) => a[0]));
    const lama = new Set(legacy.kodeLama);
    const tambahan = c.filter((a) => a && !bs.has(a[0]) && !lama.has(a[0])).map((a) => a.slice());
    return salin(bawaan).concat(tambahan).sort(urutKode);
  }

  /** Bentuk yang disimpan ke database: daftar + penanda versi 3. */
  const untukDisimpan = () => daftar.map((a) => a.slice()).concat([['#v', '3', '']]);

  /**
   * Migrasi data jurnal versi lama ke COA versi 3 (kode aset tetap bergeser). Mengubah `d` langsung.
   * Dipanggil tiap membuka data tersimpan/impor; aman dipanggil berulang karena ditandai d.cv = 3.
   */
  function migrasiData(d) {
    if (!d || typeof d != 'object' || !Array.isArray(d.rows) || d.cv == 3) return d;
    const peta = legacy.migrasiKode;
    d.rows.forEach((r) => {
      const p = kodeAkun(r.ak);
      if (peta[p]) r.ak = peta[p] + ' ' + ((bawaan.find((a) => a[0] == peta[p]) || [])[1] || '');
    });
    Object.keys(d).forEach((k) => {
      if (/^el/.test(k) && d[k] && typeof d[k] == 'object' && !Array.isArray(d[k])) {
        const o = {};
        Object.keys(d[k]).forEach((c) => {
          const n = peta[c] || c;
          o[n] = (o[n] || 0) + d[k][c];
        });
        d[k] = o;
      }
    });
    if (d.imp && typeof d.imp == 'object') Object.values(d.imp).forEach(migrasiData);
    d.cv = 3;
    return d;
  }

  /**
   * Menyesuaikan baris jurnal lama: kode kas lama digabung (alihKode), dan kode lama yang tak ada di COA
   * ditambahkan ke daftar akun agar saldonya tetap terhitung. MENGUBAH `rows` dan daftar akun.
   * @returns {boolean} true bila ada perubahan
   */
  function terapkanAkunLama(rows) {
    let berubah = false;
    rows.forEach((r) => {
      const p = kodeAkun(r.ak);
      if (legacy.alihKode[p]) {
        const n = legacy.alihKode[p];
        r.ak = n + ' ' + nama(n);
        berubah = true;
      } else if (!saldoNormal[p] && legacy.akunLama[p]) {
        daftar.push([p, legacy.akunLama[p][0], legacy.akunLama[p][1]]);
        saldoNormal[p] = legacy.akunLama[p][1];
        berubah = true;
      }
    });
    if (berubah) {
      urutkan();
      pendengar.forEach((f) => f());
    }
    return berubah;
  }

  segarkan();

  KDMP.core.coa = {
    POLA_KODE, KELOMPOK_VALID,
    get daftar() { return daftar; },
    saldoNormal, bawaan,
    nama, saldoNormalBawaan, galatKode, barisImporValid,
    ganti, urutkan, tambah, ubahNama, ubahKode, ubahSaldoNormal, hapus, kembalikanBawaan,
    dariTersimpan, untukDisimpan, migrasiData, terapkanAkunLama,
    saatBerubah: (f) => pendengar.push(f)
  };
})(globalThis.KDMP);

</script>
<script>
/*
 * Laporan Arus Kas (metode langsung) dan pemetaan otomatis Komponen Arus Kas.
 *
 * Aturan:
 *  - Setiap baris kas/bank (akun 1.1.1.*) dapat diberi "Komponen Arus Kas" manual (r.kom).
 *  - Untuk kas KELUAR yang komponennya kosong, komponen diturunkan dari akun lawan pada jurnal
 *    yang sama (No Bukti sama; bila No Bukti kosong: tanggal + keterangan), lewat tabel pemetaan
 *    di config/pemetaan-arus-kas.js. Bila akun lawan lebih dari satu, nilainya dibagi proporsional.
 *  - Baris "Saldo Awal" pada akun kas tidak dihitung sebagai arus.
 */
(function (KDMP) {
  'use strict';
  const { kodeAkun } = KDMP.core.format;
  const { hitungRumus, bukaSum } = KDMP.core.rumus;

  /** Komponen arus kas untuk satu kode akun lawan (null bila tidak dipetakan). */
  function komponenDariAkun(kode) {
    for (const [awalan, komponen] of KDMP.config.pemetaanArusKas) if (kode.startsWith(awalan)) return komponen;
    return null;
  }

  /**
   * Komponen otomatis per baris kas keluar.
   * @param {Array} rows    jurnal
   * @param {number} tahun  tahun laporan
   * @param {number} periode  tahun*12+bulan (batas akhir)
   * @param {(kode:string)=>boolean} akunDikenal  true bila kode ada di COA
   * @returns {Map<object, Object<string, number>>} baris jurnal -> {komponen: jumlah (positif)}
   */
  function komponenOtomatis(rows, tahun, periode, akunDikenal) {
    const grup = {};
    const hasil = new Map();
    rows.forEach(function (r) {
      if (!r.d || r.kom) return;
      const y = +r.d.slice(0, 4);
      const q = y * 12 + +r.d.slice(5, 7);
      if (y != tahun || q > periode) return;
      const kode = kodeAkun(r.ak);
      if (!akunDikenal(kode)) return;
      const kunci = String(r.no || '').trim() || (r.ket ? r.d + '|' + String(r.ket).trim().toLowerCase() : '');
      if (!kunci) return;
      const g = (grup[kunci] = grup[kunci] || { kas: [], lawan: [] });
      const d = +r.db || 0;
      const k = +r.kr || 0;
      if (kode.startsWith('1.1.1.')) {
        if (/saldo awal/i.test(r.ket || '')) return;
        if (d - k < 0) g.kas.push({ r, jumlah: k - d });
      } else if (d - k > 0) g.lawan.push({ komponen: komponenDariAkun(kode), bobot: d - k });
    });
    for (const kunci in grup) {
      const g = grup[kunci];
      const total = g.lawan.reduce((s, x) => s + x.bobot, 0);
      if (!g.kas.length || !total) continue;
      g.kas.forEach(function (x) {
        const m = {};
        g.lawan.forEach((z) => { if (z.komponen) m[z.komponen] = (m[z.komponen] || 0) + (x.jumlah * z.bobot) / total; });
        if (Object.keys(m).length) hasil.set(x.r, m);
      });
    }
    return hasil;
  }

  /**
   * Menyusun baris Laporan Arus Kas.
   * @param {object} saldo  hasil KDMP.core.saldo.hitungSaldo (memakai .kom dan .open)
   * @returns {Array<{lv:number,l:string,tp:string,x:number}>}
   */
  function susunArusKas(saldo, spesifikasi) {
    const nilai = {}; // nomor baris -> nilai
    return spesifikasi.map(function (a, i) {
      const nomor = 13 + i;
      const [lv, l, tp, g] = a;
      let x = 0;
      if (tp == 'c') x = saldo.kom[l] || 0;
      else if (tp == 's') for (let j = g[0]; j <= g[1]; j++) x += nilai[j] || 0;
      else if (tp == 'x' || tp == 'x1') x = hitungRumus(bukaSum(g.slice(1)), (n) => nilai[n]);
      else if (tp == 'open') x = saldo.open;
      nilai[nomor] = x;
      return { lv, l, tp, x };
    });
  }

  KDMP.core.arusKas = { komponenDariAkun, komponenOtomatis, susunArusKas };
})(globalThis.KDMP);

</script>
<script>
/*
 * Inti perhitungan saldo akun dari jurnal. Tanpa DOM dan tanpa state global: semua masukan lewat parameter.
 *
 * Aturan periode (P = tahun*12 + bulan yang dilihat):
 *  - baris tanpa tanggal diabaikan; baris setelah P diabaikan;
 *  - akun neraca (golongan 1-3) kumulatif sepanjang waktu; akun laba rugi (4-9) hanya tahun berjalan,
 *    sedangkan `kumulatifSemuaTahun` (cumA) menyimpan semua tahun agar laba tahun lalu bisa dihitung;
 *  - saldo akun = debit - kredit bila saldo normal Debit; kredit - debit bila Kredit.
 */
(function (KDMP) {
  'use strict';
  const { kodeAkun } = KDMP.core.format;
  const coa = KDMP.core.coa;

  /**
   * @param {Array}  rows   baris jurnal {d, no, ak, db, kr, ket, kom}
   * @param {number} tahun
   * @param {number} bulan  1..12
   * @returns {{
   *   cum:Object, cumA:Object, mon:Object, dr:Object, kr:Object, kom:Object, M:Object,
   *   open:number, td:number, tk:number
   * }}
   *   cum   saldo kumulatif (neraca: semua tahun; laba rugi: tahun berjalan)
   *   cumA  saldo kumulatif semua tahun untuk semua akun
   *   mon   mutasi bersih bulan ini
   *   dr/kr total debit/kredit tahun berjalan (neraca saldo)
   *   kom   total per Komponen Arus Kas tahun berjalan (manual + otomatis)
   *   M     saldo neraca bertanda positif menurut sifatnya (aset=debit, kewajiban/ekuitas=kredit)
   *   open  kas awal tahun;  td/tk total debit/kredit seluruh jurnal s.d. periode
   */
  function hitungSaldo(rows, tahun, bulan) {
    coa.terapkanAkunLama(rows);
    const NM = coa.saldoNormal;
    const Y = +tahun;
    const P = Y * 12 + bulan;
    const o = { cum: {}, cumA: {}, mon: {}, dr: {}, kr: {}, kom: {}, open: 0, M: {}, td: 0, tk: 0 };

    rows.forEach(function (r) {
      const c = kodeAkun(r.ak);
      const d = +r.db || 0;
      const k = +r.kr || 0;
      if (!r.d) return;
      const y = +r.d.slice(0, 4);
      const q = y * 12 + +r.d.slice(5, 7);
      if (q > P) return;
      o.td += d;
      o.tk += k;
      if (!NM[c]) return;
      const p = NM[c] == 'Debit' ? d - k : k - d;
      o.cumA[c] = (o.cumA[c] || 0) + p;
      if (c[0] < '4' || y == Y) {
        o.cum[c] = (o.cum[c] || 0) + p;
        o.dr[c] = (o.dr[c] || 0) + d;
        o.kr[c] = (o.kr[c] || 0) + k;
      }
      if (q == P) o.mon[c] = (o.mon[c] || 0) + p;
      if (r.kom && y == Y) o.kom[r.kom] = (o.kom[r.kom] || 0) + p;
      if (c.startsWith('1.1.1.') && (y < Y || /saldo awal/i.test(r.ket || ''))) o.open += p;
    });

    KDMP.core.arusKas.komponenOtomatis(rows, Y, P, (kode) => !!NM[kode]).forEach(function (m) {
      for (const l in m) o.kom[l] = (o.kom[l] || 0) - m[l];
    });

    for (const c in o.cum) {
      const n = NM[c];
      const x = c[0];
      o.M[c] = x == '1' ? (n == 'Debit' ? o.cum[c] : -o.cum[c]) : x == '2' || x == '3' ? (n == 'Kredit' ? o.cum[c] : -o.cum[c]) : 0;
    }
    return o;
  }

  /** Hanya akun laba rugi (golongan 4-9) dari sebuah peta kode -> nilai. */
  function labaRugiAkun(peta) {
    const r = {};
    for (const c in peta) if ('45678'.includes(c[0]) || c[0] == '9') r[c] = peta[c];
    return r;
  }

  /** Pengaruh akun laba rugi terhadap SHU: pendapatan (+), beban (-). */
  function pengaruhSHU(kode, v) {
    const x = kode[0];
    if (x == '4' || x == '7' || kode.startsWith('9.1')) return v;
    if ('568'.includes(x) || kode.startsWith('9.2') || kode.startsWith('9.3')) return -v;
    return 0;
  }

  /** SHU (laba bersih) kumulatif semua tahun s.d. periode. */
  function shu(o) {
    let s = 0;
    for (const c in o.cumA) s += pengaruhSHU(c, o.cumA[c]);
    return s;
  }

  /** SHU tahun-tahun sebelumnya saja (belum ditutup ke ekuitas). */
  function shuTahunSebelumnya(o) {
    let s = 0;
    for (const c in o.cumA) s += pengaruhSHU(c, o.cumA[c] - (o.cum[c] || 0));
    return s;
  }

  KDMP.core.saldo = { hitungSaldo, labaRugiAkun, shu, shuTahunSebelumnya };
})(globalThis.KDMP);

</script>
<script>
/*
 * Mesin penyusun laporan keuangan dari spesifikasi deklaratif (config/laporan-*.js).
 * Format baris spesifikasi dijelaskan di docs/format-laporan.md. Tanpa DOM.
 */
(function (KDMP) {
  'use strict';
  const { hitungRumus } = KDMP.core.rumus;

  /**
   * Mengisi nilai tiap baris spesifikasi.
   * @param {Array}  spec    spesifikasi (LPK atau LR)
   * @param {Object} peta    kode akun -> nilai
   * @param {Object} [nilaiL] nilai untuk baris tipe "L" (mis. {shu_final})
   * @returns {{rows: Array<{it:Array, v:number}>, key: Object<string, number>}}
   *   rows: baris beserta nilainya (urut sama dengan spec, kecuali "B" yang tidak menghasilkan baris)
   *   key : nilai tiap baris bernama (untuk rumus & pengecekan balance)
   */
  function susunLaporan(spec, peta, nilaiL) {
    const rows = [];
    const key = {};
    let awalBlok = 0;
    let blok = [];
    const jumlahAwalan = (p) => Object.keys(peta).filter((c) => c.startsWith(p)).reduce((a, c) => a + peta[c], 0);

    spec.forEach(function (it) {
      const t = it[0];
      if (t == 'B') { awalBlok = rows.length; blok = []; return; }
      const r = { it, v: 0 };
      if (t == 'A') {
        r.v = peta[it[1]] || 0;
      } else if (t == 'O') { // akun lain berawalan tertentu yang belum tampil di blok ini
        r.v = it[2].reduce((a, p) => a + jumlahAwalan(p), 0);
        if (!it[5]) blok.forEach((x) => { if (x.it[0] == 'A' && it[2].some((p) => x.it[1].startsWith(p))) r.v -= x.v; });
        it[3].forEach((e) => (r.v -= peta[e] || 0));
      } else if (t == 'S') { // subtotal blok
        for (let j = awalBlok; j < rows.length; j++) r.v += rows[j].v;
      } else if (t == 'T') {
        r.v = hitungRumus(it[3], (k) => key[k] || 0);
      } else if (t == 'L') {
        r.v = (nilaiL || {})[it[3]] || 0;
      }
      const k = t == 'A' || t == 'S' || t == 'T' || t == 'L' ? it[1] : t == 'O' ? it[4] : null;
      if (k) key[k] = r.v;
      rows.push(r);
      if (t == 'A' || t == 'O' || t == 'L') blok.push(r);
    });
    return { rows, key };
  }

  /**
   * Menambah baris per-akun ke spesifikasi untuk akun yang bersaldo di salah satu peta (unit) tetapi belum
   * tercantum, supaya laporan konsolidasi menampilkan semua akun bersaldo dengan nama sesuai Master COA.
   * @param {Array} spec
   * @param {Array<Object>} petaUnit  satu peta kode->nilai per unit
   * @param {(kode:string)=>string} namaAkun
   */
  function perluasSpesifikasi(spec, petaUnit, namaAkun) {
    const sudahAda = new Set(spec.filter((x) => x[0] == 'A').map((x) => x[1]));
    const out = [];
    spec.forEach(function (it) {
      if (it[0] == 'O') {
        const kecuali = new Set(it[3]);
        const calon = new Set();
        petaUnit.forEach((m) => Object.keys(m).forEach((c) => {
          if (!sudahAda.has(c) && !kecuali.has(c) && Math.abs(m[c]) >= 0.5 && it[2].some((p) => c.startsWith(p))) calon.add(c);
        }));
        if (calon.size) {
          const A = [...calon].sort().map((c) => { sudahAda.add(c); return ['A', c, namaAkun(c) || c]; });
          if (it[5] === true) {
            out.push(['H', 2, 'Aset Lain-lain'], ['B'], ...A, ['O', 'Aset lain-lain lainnya', it[2], it[3], null, false], ['S', it[4], 'Total Aset Lain-lain']);
            return;
          }
          out.push(...A);
        }
      }
      out.push(it);
    });
    return out;
  }

  KDMP.core.laporan = { susunLaporan, perluasSpesifikasi };
})(globalThis.KDMP);

</script>
<script>
/*
 * Konsolidasi Neraca / Laba Rugi untuk sejumlah unit (KDMP.config.aplikasi.unit; bawaan USP + Sembako, bisa
 * ditambah) dengan kolom eliminasi.
 * Eliminasi otomatis (hanya neraca, hanya bila unit USP dan Sembako sama-sama terdaftar): RK Piutang Gerai
 * Sembako (1.1.9.08, di USP) melawan Utang ke USP (2.1.9.01, di Sembako) sebesar yang terkecil dari keduanya.
 * Selisih antar-unit lain diisi lewat `eliminasiManual` (negatif = mengurangi).
 */
(function (KDMP) {
  'use strict';
  const { hitungSaldo, labaRugiAkun, shu } = KDMP.core.saldo;
  const { susunLaporan, perluasSpesifikasi } = KDMP.core.laporan;

  /**
   * @param {Array} spec  LPK atau LR konsolidasi
   * @param {'nb'|'m'|'y'} mode  nb = neraca; m = laba rugi bulan ini; y = laba rugi s.d. bulan ini
   * @param {{unit:Object, tahun:number, bulan:number, eliminasiManual:Object, namaAkun:Function}} opsi
   *        unit: {USP:{rows}, Sembako:{rows}, ...} (unit tanpa data boleh tidak ada)
   * @returns {{rows:Array, cols:Array<Array<number>>, ds:Array}}
   *   cols = [unit1, ..., unitN, jumlah, eliminasi, konsolidasi]  (N = jumlah unit terdaftar)
   */
  function kolomKonsolidasi(spec, mode, opsi) {
    const { unit, tahun, bulan, eliminasiManual, namaAkun } = opsi;
    const daftarUnit = KDMP.config.aplikasi.unit;
    const ds = daftarUnit.map((k) => (unit[k] ? hitungSaldo(unit[k].rows, tahun, bulan) : null));
    const peta = ds.map((d) => (d ? (mode == 'nb' ? d.M : labaRugiAkun(mode == 'm' ? d.mon : d.cum)) : {}));
    const spekBaru = perluasSpesifikasi(spec, peta, namaAkun);
    const hasilUnit = ds.map((d, i) => susunLaporan(spekBaru, peta[i], { shu_final: d ? shu(d) : 0 }));

    const otomatis = {};
    const iUsp = daftarUnit.indexOf('USP');
    const iSem = daftarUnit.indexOf('Sembako');
    if (mode == 'nb' && iUsp >= 0 && iSem >= 0) {
      const a = (ds[iUsp] && ds[iUsp].M['1.1.9.08']) || 0;
      const b = (ds[iSem] && ds[iSem].M['2.1.9.01']) || 0;
      const x = Math.max(0, Math.min(a, b));
      otomatis['1.1.9.08'] = -x;
      otomatis['2.1.9.01'] = -x;
    }
    const eliminasi = {};
    Object.keys(Object.assign({}, otomatis, eliminasiManual)).forEach((c) => (eliminasi[c] = (otomatis[c] || 0) + (eliminasiManual[c] || 0)));
    const hasilElim = susunLaporan(spekBaru, eliminasi, {});

    const cols = hasilUnit.map((e) => e.rows.map((r) => r.v));
    const n = cols.length;
    const jumlah = cols[0].map((_, i) => cols.reduce((t, c) => t + c[i], 0));
    cols.push(jumlah);                                          // jumlah semua unit
    cols.push(hasilElim.rows.map((r) => r.v));                  // eliminasi
    cols.push(jumlah.map((v, i) => v + cols[n + 1][i]));        // konsolidasi
    return { rows: hasilUnit[0].rows, cols, ds };
  }

  KDMP.core.konsolidasi = { kolomKonsolidasi };
})(globalThis.KDMP);

</script>
<script>
/*
 * Buku pembantu aset tetap: penyusutan per bulan (garis lurus / saldo menurun), tanpa DOM.
 * Satu aset: {kode, nama, kat, tgl, hp (harga perolehan), res (residu), umur (tahun), met, lepas (tgl lepas, opsional)}
 */
(function (KDMP) {
  'use strict';
  const { periodeDari, angkaAman } = KDMP.core.format;
  const KATEGORI = KDMP.config.kategoriAset;

  /** Aset tercatat pada periode P (sudah diperoleh dan belum dilepas sebelum P). */
  const aktif = (a, P) => !!a.tgl && periodeDari(a.tgl) <= P && (!a.lepas || periodeDari(a.lepas) >= P);

  /** Akumulasi penyusutan sampai akhir periode P (angka desimal; pembulatan dilakukan pemanggil). */
  function akumulasiPada(a, P) {
    const biaya = angkaAman(a.hp);
    const residu = Math.min(angkaAman(a.res), biaya);
    const umurBulan = Math.round(angkaAman(a.umur) * 12);
    const kat = KATEGORI[a.kat];
    if (!a.tgl || !biaya || umurBulan <= 0 || !kat || !kat[1]) return 0;
    const Q = a.lepas ? Math.min(P, periodeDari(a.lepas)) : P;
    const n = Math.max(0, Math.min(Q - periodeDari(a.tgl) + 1, umurBulan));
    if (a.met == 'Saldo Menurun') {
      const tarif = 2 / (umurBulan / 12) / 12;
      return biaya - Math.max(residu, biaya * Math.pow(1 - tarif, n));
    }
    return ((biaya - residu) * n) / umurBulan;
  }

  /** Jadwal penyusutan semua aset untuk (tahun, bulan). */
  function hitungAset(daftarAset, tahun, bulan) {
    const P = tahun * 12 + bulan;
    const Pawal = tahun * 12;
    return daftarAset.map(function (a) {
      const ak = aktif(a, P);
      const sebelum = ak ? Math.round(akumulasiPada(a, P - 1)) : 0;
      const kini = ak ? Math.round(akumulasiPada(a, P)) : 0;
      const bln = kini - sebelum;
      return {
        a, ak,
        cost: ak ? angkaAman(a.hp) : 0,
        akum: sebelum + bln,
        bln,
        ytd: ak ? sebelum - Math.round(akumulasiPada(a, Pawal)) : 0,
        nb: ak ? angkaAman(a.hp) - kini : 0,
        st: !a.tgl ? '-' : periodeDari(a.tgl) > P ? 'Belum diperoleh' : a.lepas && periodeDari(a.lepas) < P ? 'Dilepas' : 'Aktif'
      };
    });
  }

  /** Beban penyusutan bulan ini dikelompokkan per pasangan akun: {"beban|akumulasi": jumlah}. */
  function kelompokBeban(hasil) {
    const g = {};
    hasil.forEach(function (r) {
      const c = KATEGORI[r.a.kat];
      if (!c || !c[1] || Math.abs(r.bln) < 0.5) return;
      const k = c[2] + '|' + c[1];
      g[k] = (g[k] || 0) + r.bln;
    });
    return g;
  }

  KDMP.core.asetTetap = { KATEGORI, aktif, akumulasiPada, hitungAset, kelompokBeban };
})(globalThis.KDMP);

</script>
<script>
/*
 * Buku pembantu persediaan: kartu stok dengan biaya rata-rata bergerak (moving average), tanpa DOM.
 * Barang: {k (kode), n (nama), akun}. Mutasi: {d, no, k, j: 'Saldo Awal'|'Masuk'|'Keluar', q, h (harga satuan), ket}.
 * Mutasi "Keluar" dinilai dari harga rata-rata saat itu (kolom harga tidak dipakai).
 */
(function (KDMP) {
  'use strict';
  const { periodeDari, angkaAman, urutTanggal } = KDMP.core.format;

  /**
   * @param {Array} barang
   * @param {Array} mutasi
   * @param {string} batas  tanggal ISO akhir (inklusif)
   * @returns {{m:Object, tidakDikenal:Array}}  m[kode] = {it, q, v, h:[riwayat], in, out, vin, vout}
   */
  function hitungStok(barang, mutasi, batas) {
    const m = {};
    barang.forEach((x) => { if (x.k) m[x.k] = { it: x, q: 0, v: 0, h: [], in: 0, out: 0, vin: 0, vout: 0 }; });
    const bulanBatas = periodeDari(batas);
    const tidakDikenal = [];
    mutasi
      .map((t, i) => ({ t, i }))
      .filter((x) => x.t.d && x.t.d <= batas && x.t.k)
      .sort(urutTanggal)
      .forEach(function ({ t }) {
        const r = m[t.k];
        if (!r) { tidakDikenal.push(t); return; }
        const q = angkaAman(t.q);
        let nilai, masuk = 0, keluar = 0;
        if (t.j == 'Keluar') {
          const rata = r.q > 0 ? r.v / r.q : 0;
          nilai = q * rata;
          r.q -= q; r.v -= nilai; keluar = q;
        } else {
          nilai = q * angkaAman(t.h);
          r.q += q; r.v += nilai; masuk = q;
        }
        r.h.push({ t, iq: masuk, oq: keluar, cost: nilai, q: r.q, v: r.v });
        if (periodeDari(t.d) == bulanBatas) {
          if (keluar) { r.out += keluar; r.vout += nilai; } else { r.in += masuk; r.vin += nilai; }
        }
      });
    return { m, tidakDikenal };
  }

  KDMP.core.persediaan = { hitungStok };
})(globalThis.KDMP);

</script>
<script>
/*
 * Definisi & pendaftaran unit usaha (tanpa DOM, tanpa penyimpanan) -> bisa dites di Node.
 *
 * Unit bawaan (USP, Sembako) ada di config/laporan-*.js. Unit tambahan dibuat pengguna dan hanya disimpan sebagai
 * definisi kecil {kode, nama, warna, templat, persediaan}; susunan laporannya (LPK & LR) disalin dari unit bawaan
 * yang dipilih sebagai templat. Semua akun tetap muncul karena laporan memakai baris "akun lain" (["O", ...]).
 *
 * `daftarkan` mengisi KDMP.config.unit[kode] dan menambahkan kode ke KDMP.config.aplikasi.unit (array yang sama
 * dipakai semua modul, sehingga unit baru langsung ikut di login, konsolidasi, sinkronisasi, dsb).
 */
(function (KDMP) {
  'use strict';
  const apl = KDMP.config.aplikasi;
  const BAWAAN = apl.unit.slice(); // dicatat sebelum ada unit tambahan: ['USP', 'Sembako']
  const RESERVED = ['admin', 'konsol'];
  const POLA_KODE = /^[A-Za-z][A-Za-z0-9]{1,15}$/;
  const POLA_WARNA = /^#[0-9a-fA-F]{6}$/;
  const POLA_NAMA_TERLARANG = /[<>&"'`]/;

  /** Pilihan templat susunan laporan untuk unit baru. */
  const TEMPLAT = {
    USP: 'Jasa / simpan pinjam (susunan laporan seperti USP)',
    Sembako: 'Dagang / barang (susunan laporan seperti Sembako)'
  };

  const salin = (x) => JSON.parse(JSON.stringify(x));

  /** Merapikan masukan menjadi definisi baku. */
  function normal(def) {
    return {
      kode: String(def.kode || '').trim(),
      nama: String(def.nama || '').trim(),
      warna: String(def.warna || '').trim(),
      templat: String(def.templat || ''),
      persediaan: !!def.persediaan
    };
  }

  /** @returns {string} pesan galat (bahasa Indonesia), atau '' bila definisi sah dan belum dipakai. */
  function validasi(def) {
    const d = normal(def || {});
    if (!POLA_KODE.test(d.kode)) return 'Kode unit 2–16 karakter: diawali huruf, selanjutnya huruf/angka (tanpa spasi).';
    if (RESERVED.includes(d.kode.toLowerCase())) return 'Kode "' + d.kode + '" dipakai sistem; pilih kode lain.';
    if (apl.unit.some((u) => u.toLowerCase() == d.kode.toLowerCase())) return 'Unit dengan kode "' + d.kode + '" sudah ada.';
    if (d.nama.length < 3 || d.nama.length > 60) return 'Nama unit 3–60 karakter.';
    if (POLA_NAMA_TERLARANG.test(d.nama)) return 'Nama unit tidak boleh memuat karakter < > & " \' `.';
    if (!POLA_WARNA.test(d.warna)) return 'Warna harus berformat #RRGGBB.';
    if (!BAWAAN.includes(d.templat)) return 'Templat laporan tidak dikenal.';
    return '';
  }

  /** Teks "USP, Sembako dan Klinik" untuk judul konsolidasi. */
  function namaGabungan() {
    const u = apl.unit;
    return u.length < 2 ? u.join('') : u.slice(0, -1).join(', ') + ' dan ' + u[u.length - 1];
  }

  /** Menyelaraskan judul konsolidasi dengan daftar unit saat ini. */
  function segarkanKonsolidasi() {
    if (KDMP.config.konsolidasi) KDMP.config.konsolidasi.name = 'Konsolidasi Unit Usaha (' + namaGabungan() + ')';
  }

  /**
   * Mendaftarkan unit tambahan ke konfigurasi (dalam memori). Melempar galat bila definisi tidak sah/duplikat.
   * @returns {object} konfigurasi unit {kode, name, color, LPK, LR, persediaan, kustom, def}
   */
  function daftarkan(def) {
    const galat = validasi(def);
    if (galat) throw new Error(galat);
    const d = normal(def);
    const t = KDMP.config.unit[d.templat];
    const c = { kode: d.kode, name: d.nama, color: d.warna, LPK: salin(t.LPK), LR: salin(t.LR), persediaan: d.persediaan, kustom: true, def: d };
    KDMP.config.unit[d.kode] = c;
    apl.unit.push(d.kode);
    segarkanKonsolidasi();
    return c;
  }

  /** Membatalkan pendaftaran unit tambahan (hanya dalam memori). Unit bawaan tidak bisa dibatalkan. */
  function batalDaftar(kode) {
    const c = KDMP.config.unit[kode];
    if (!c || !c.kustom) return;
    delete KDMP.config.unit[kode];
    const i = apl.unit.indexOf(kode);
    if (i >= 0) apl.unit.splice(i, 1);
    segarkanKonsolidasi();
  }

  /** Definisi semua unit tambahan sesuai urutan unit (untuk disimpan). */
  const daftarKustom = () => apl.unit.filter((k) => KDMP.config.unit[k] && KDMP.config.unit[k].kustom).map((k) => Object.assign({}, KDMP.config.unit[k].def));

  /** Definisi sebuah unit tambahan, atau null untuk unit bawaan/tidak dikenal. */
  const defUntuk = (kode) => (KDMP.config.unit[kode] && KDMP.config.unit[kode].kustom ? Object.assign({}, KDMP.config.unit[kode].def) : null);

  /** Apakah unit `kode` memakai tab BP Persediaan. */
  const punyaPersediaan = (kode) => !!(KDMP.config.unit[kode] && KDMP.config.unit[kode].persediaan);

  KDMP.core.unit = { BAWAAN, TEMPLAT, normal, validasi, daftarkan, batalDaftar, daftarKustom, defUntuk, punyaPersediaan, namaGabungan };
})(globalThis.KDMP);

</script>
<script>
/*
 * Penyimpanan lokal berbasis IndexedDB: satu object store "s" berisi {k: kunci, v: nilai, t: waktu ubah}.
 * Semua data pengguna (jurnal, COA, metadata sandi, titik pulih) disimpan di sini; tidak ada server.
 * Kunci yang dipakai: meta, coa, units_custom, d_<unit>, snap_<unit>_<waktu>, lastexp_<unit>, lastbak.
 */
(function (KDMP) {
  'use strict';
  const NAMA_DB = KDMP.config.aplikasi.idTeknis.database;

  const kv = {
    db: null,

    open() {
      return new Promise(function (ok, gagal) {
        if (!window.indexedDB) return gagal(new Error('Browser ini tidak mendukung IndexedDB.'));
        const q = indexedDB.open(NAMA_DB, 1);
        q.onupgradeneeded = () => { q.result.createObjectStore('s', { keyPath: 'k' }); };
        q.onsuccess = () => {
          kv.db = q.result;
          kv.db.onversionchange = () => { kv.db.close(); };
          ok();
        };
        q.onerror = () => gagal(q.error || new Error('Database gagal dibuka'));
        q.onblocked = () => gagal(new Error('Database terblokir oleh tab lain. Tutup tab lain lalu muat ulang.'));
      });
    },

    /** Menjalankan fn(objectStore) dalam satu transaksi; hasil request terakhir dikembalikan. */
    tx(mode, fn) {
      return new Promise(function (ok, gagal) {
        let r;
        const t = kv.db.transaction('s', mode);
        try { r = fn(t.objectStore('s')); } catch (e) { return gagal(e); }
        t.oncomplete = () => ok(r && 'result' in r ? r.result : undefined);
        t.onabort = t.onerror = () => gagal(t.error || new Error('Transaksi database gagal'));
      });
    },

    async get(k) { const r = await this.tx('readonly', (s) => s.get(k)); return r ? r.v : undefined; },
    set(k, v) { return this.tx('readwrite', (s) => s.put({ k, v, t: Date.now() })).then(() => true); },
    del(k) { return this.tx('readwrite', (s) => s.delete(k)).then(() => true); },

    /** Semua pasangan kunci->nilai yang kuncinya berawalan `awalan`. */
    async all(awalan) {
      const o = {};
      const p = awalan || '';
      const rs = await this.tx('readonly', (s) => s.getAll());
      rs.forEach((r) => { if (String(r.k).indexOf(p) === 0) o[r.k] = r.v; });
      return o;
    },

    /** Waktu ubah terakhir untuk kunci-kunci tertentu: {kunci: "ms"}. Dipakai sinkronisasi antar tab. */
    async ver(keys) {
      const o = {};
      const rs = await this.tx('readonly', (s) => s.getAll());
      rs.forEach((r) => { if (keys.indexOf(r.k) >= 0) o[r.k] = String(r.t); });
      return o;
    },

    setAll(o) {
      const t = Date.now();
      return this.tx('readwrite', (s) => { for (const k in o) s.put({ k, v: o[k], t }); }).then(() => true);
    },

    clear() { return this.tx('readwrite', (s) => s.clear()).then(() => true); }
  };

  KDMP.storage.kv = kv;
})(globalThis.KDMP);

</script>

<script>
/*
 * Titik pulih (snapshot) data unit di IndexedDB, kunci "snap_<unit>_<waktu>". Disimpan terenkripsi (nilai
 * yang sama dengan data unit), maksimal 5 per unit; yang tertua dihapus lebih dulu.
 */
(function (KDMP) {
  'use strict';
  const kv = KDMP.storage.kv;
  const MAKS = 5;
  const awalan = (unit) => 'snap_' + unit + '_';

  /** @returns {Promise<Array<{kunci:string,t:number,l:string,d:string}>>} urut baru -> lama */
  async function daftar(unit) {
    const semua = await kv.all(awalan(unit));
    return Object.keys(semua).filter((x) => x.startsWith(awalan(unit))).sort().reverse().map((kunci) => ({ kunci, ...semua[kunci] }));
  }

  async function pangkas(unit) {
    const semua = await kv.all(awalan(unit));
    const ks = Object.keys(semua).filter((x) => x.startsWith(awalan(unit))).sort();
    while (ks.length > MAKS) await kv.del(ks.shift());
  }

  /** @param {string} terenkripsi nilai data unit (teks terenkripsi) */
  async function buat(unit, label, terenkripsi) {
    await kv.set(awalan(unit) + Date.now(), { t: Date.now(), l: label, d: terenkripsi });
    await pangkas(unit);
  }

  KDMP.storage.titikPulih = { daftar, pangkas, buat, hapus: (kunci) => kv.del(kunci), ambil: (kunci) => kv.get(kunci) };
})(globalThis.KDMP);

</script>
<script>
/*
 * Backup database lengkap (semua isi IndexedDB, tetap terenkripsi) dan pemulihannya.
 * Format berkas: {app:'kdmp-full', ts, tgl, kv:{...}}. Berkas ini yang dipakai untuk memindahkan data
 * antar komputer dan untuk mengimpor unit ke Konsolidasi.
 */
(function (KDMP) {
  'use strict';
  const kv = KDMP.storage.kv;
  const ID = KDMP.config.aplikasi.idTeknis.backup;

  /** @returns {Promise<{nama:string, isi:string}>} nama berkas & isi JSON siap disimpan */
  async function buatBerkas() {
    const o = await kv.all();
    delete o.lastbak;
    return {
      nama: 'KDMP_CADANGAN_LENGKAP_' + new Date().toISOString().slice(0, 10) + '.json',
      isi: JSON.stringify({ app: ID, ts: Date.now(), tgl: new Date().toLocaleString('id-ID'), kv: o })
    };
  }

  const tandaiSudahBackup = () => kv.set('lastbak', Date.now());

  /** Mengurai & memeriksa teks berkas backup. Melempar galat bila bukan backup lengkap. */
  function bacaBerkas(teks) {
    const o = JSON.parse(teks);
    if (o.app != ID || !o.kv || !o.kv.meta) throw new Error('bukan backup lengkap');
    return o;
  }

  /** Menimpa seluruh data dengan isi backup. */
  const pulihkan = (o) => kv.setAll(o.kv);

  KDMP.storage.backup = { buatBerkas, tandaiSudahBackup, bacaBerkas, pulihkan };
})(globalThis.KDMP);

</script>
<script>
/*
 * Kripto: turunan kunci PBKDF2 (200.000 iterasi, SHA-256) dan enkripsi AES-GCM 256 bit dengan Web Crypto.
 * Format teks terenkripsi: "<iv base64>.<ciphertext base64>".
 * Tidak ada kunci/ sandi yang ditulis ke penyimpanan; hanya salt dan kunci data terbungkus.
 */
(function (KDMP) {
  'use strict';
  const subtle = crypto.subtle;
  const enkoder = new TextEncoder();

  const acak = (n) => crypto.getRandomValues(new Uint8Array(n));

  function keBase64(buf) {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
    return btoa(s);
  }
  const dariBase64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  function gabung(daftar) {
    const o = new Uint8Array(daftar.reduce((n, x) => n + x.length, 0));
    let p = 0;
    daftar.forEach((x) => { o.set(x, p); p += x.length; });
    return o;
  }

  /** Kunci AES dari sandi + salt. */
  async function turunkanKunci(sandi, salt) {
    const k = await subtle.importKey('raw', enkoder.encode(sandi), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  /** Mengimpor 32 byte mentah sebagai kunci AES-GCM (kunci data unit). */
  const kunciDariMentah = (mentah) => subtle.importKey('raw', mentah, 'AES-GCM', false, ['encrypt', 'decrypt']);

  async function enkripsi(kunci, data) {
    const iv = acak(12);
    return keBase64(iv) + '.' + keBase64(await subtle.encrypt({ name: 'AES-GCM', iv }, kunci, data));
  }

  async function dekripsi(kunci, teks) {
    const [i, c] = teks.split('.');
    return new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv: dariBase64(i) }, kunci, dariBase64(c)));
  }

  /** Enkripsi objek JS (JSON). */
  const enkripsiJson = (kunci, obj) => enkripsi(kunci, enkoder.encode(JSON.stringify(obj)));

  /** Dekripsi ke objek JS, lalu migrasi data lama ke COA versi 3. */
  const dekripsiJson = async (kunci, teks) => KDMP.core.coa.migrasiData(JSON.parse(new TextDecoder().decode(await dekripsi(kunci, teks))));

  KDMP.security.kripto = { acak, keBase64, dariBase64, gabung, turunkanKunci, kunciDariMentah, enkripsi, dekripsi, enkripsiJson, dekripsiJson };
})(globalThis.KDMP);

</script>
<script>
/*
 * Manajemen kunci & sandi (tanpa tampilan).
 *
 * Skema: tiap unit (USP, Sembako) punya kunci data acak 32 byte ("raw"). Kunci itu dibungkus dua kali:
 *   wU = dibungkus kunci dari sandi unit  -> unit hanya bisa membuka unitnya sendiri
 *   wA = dibungkus kunci dari sandi Admin -> Konsolidasi (Admin) bisa membuka semua unit
 * `meta` (disimpan di IndexedDB, kunci "meta") berisi salt dan kunci terbungkus itu. Sandi yang hilang tidak
 * bisa dipulihkan. Paket unit (.kdmp.json) hanya bisa dibuka bila sandi Admin sama di semua komputer.
 */
(function (KDMP) {
  'use strict';
  const k = KDMP.security.kripto;
  const UNIT = () => KDMP.config.aplikasi.unit;

  /** Membuat metadata awal dari sandi Admin & tiap unit. @returns {Promise<object>} meta */
  async function buatMeta(sandi) {
    const saltAdmin = k.acak(16);
    const kunciAdmin = await k.turunkanKunci(sandi.Admin, saltAdmin);
    const meta = { saltA: k.keBase64(saltAdmin), units: {} };
    for (const u of UNIT()) {
      const mentah = k.acak(32);
      const saltUnit = k.acak(16);
      meta.units[u] = {
        s: k.keBase64(saltUnit),
        wU: await k.enkripsi(await k.turunkanKunci(sandi[u], saltUnit), mentah),
        wA: await k.enkripsi(kunciAdmin, mentah)
      };
    }
    return meta;
  }

  /**
   * Kunci dari sandi Admin, diperiksa dengan membuka salah satu kunci unit yang tersimpan.
   * Melempar galat bila sandi Admin salah.
   */
  async function kunciAdmin(meta, sandiAdmin) {
    const DK = await k.turunkanKunci(sandiAdmin, k.dariBase64(meta.saltA));
    const u = Object.keys(meta.units)[0];
    if (u) await k.dekripsi(DK, meta.units[u].wA);
    return DK;
  }

  /**
   * Menambah unit baru ke `meta` (mengubah meta): membuat kunci data acak, dibungkus sandi unit dan kunci Admin.
   * `kunciAdminDK` = hasil kunciAdmin() atau kunci sesi Konsolidasi. @returns kunci mentah unit baru.
   */
  async function tambahUnit(meta, kode, kunciAdminDK, sandiUnit) {
    if (meta.units[kode]) throw new Error('unit sudah ada');
    const mentah = k.acak(32);
    const salt = k.acak(16);
    meta.units[kode] = {
      s: k.keBase64(salt),
      wU: await k.enkripsi(await k.turunkanKunci(sandiUnit, salt), mentah),
      wA: await k.enkripsi(kunciAdminDK, mentah)
    };
    return mentah;
  }

  /**
   * Membuka sesi. unit = kode unit (mis. 'USP', 'Sembako', atau unit tambahan) | 'KONSOL'.
   * Melempar galat bila sandi salah.
   * @returns {{DK: CryptoKey, RAW: Uint8Array|Object<string,Uint8Array>}}
   *   unit  : RAW = kunci mentah unit, DK = kunci AES unit
   *   KONSOL: DK = kunci dari sandi Admin, RAW = {unit: kunci mentah}
   *           (unit yang belum punya kunci di `meta` dilewati)
   */
  async function bukaSesi(meta, unit, sandi) {
    if (unit == 'KONSOL') {
      const DK = await k.turunkanKunci(sandi, k.dariBase64(meta.saltA));
      const RAW = {};
      for (const u of UNIT()) if (meta.units[u]) RAW[u] = await k.dekripsi(DK, meta.units[u].wA);
      return { DK, RAW };
    }
    const m = meta.units[unit];
    const RAW = await k.dekripsi(await k.turunkanKunci(sandi, k.dariBase64(m.s)), m.wU);
    return { DK: await k.kunciDariMentah(RAW), RAW };
  }

  /** Mengganti sandi Admin (hanya saat sesi Konsolidasi). Mengubah `meta`; mengembalikan kunci Admin baru. */
  async function gantiSandiAdmin(meta, rawUnit, sandiBaru) {
    const salt = k.acak(16);
    const kunciBaru = await k.turunkanKunci(sandiBaru, salt);
    for (const u of UNIT()) if (meta.units[u] && rawUnit[u]) meta.units[u].wA = await k.enkripsi(kunciBaru, rawUnit[u]);
    meta.saltA = k.keBase64(salt);
    return kunciBaru;
  }

  /** Mengganti sandi sebuah unit. `raw` = kunci mentah unit itu. Mengubah `meta`. */
  async function gantiSandiUnit(meta, unit, raw, sandiBaru) {
    const salt = k.acak(16);
    meta.units[unit].s = k.keBase64(salt);
    meta.units[unit].wU = await k.enkripsi(await k.turunkanKunci(sandiBaru, salt), raw);
  }

  KDMP.security.kunci = { buatMeta, kunciAdmin, tambahUnit, bukaSesi, gantiSandiAdmin, gantiSandiUnit };
})(globalThis.KDMP);

</script>

<script>
/*
 * Penanganan peristiwa terpusat (event delegation) sebagai pengganti atribut onclick="..." / onchange="...".
 *
 * Cara pakai:
 *   1. Daftarkan fungsi:   KDMP.ui.aksi.daftar({ 'jurnal.hapus': function (el, e) { ... } });
 *   2. Tempel pada HTML:   `<button ${klik('jurnal.hapus', { i: 3 })}>x</button>`
 *   3. Di fungsi, baca argumen dengan arg(el, 'i').
 *
 * Jenis peristiwa: klik (click), ubah (change), input (input), kirim (submit), seret (dragover + drop).
 * Satu pendengar per jenis dipasang di document, sehingga HTML yang dibuat ulang tiap render tidak perlu
 * memasang ulang pendengar. Semua nama aksi memakai pola "modul.aksi".
 */
(function (KDMP) {
  'use strict';
  const fungsi = {};
  const ATRIBUT = { klik: 'data-aksi', ubah: 'data-aksi-ubah', input: 'data-aksi-input', kirim: 'data-aksi-kirim', seret: 'data-aksi-seret' };

  function daftar(peta) {
    for (const nama in peta) {
      if (fungsi[nama]) throw new Error('Aksi ganda: ' + nama);
      fungsi[nama] = peta[nama];
    }
  }

  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

  /** Membuat atribut HTML: attr('klik', 'jurnal.hapus', {i:3}) -> data-aksi="jurnal.hapus" data-a-i="3" */
  function atribut(jenis, nama, args) {
    let s = ATRIBUT[jenis] + '="' + nama + '"';
    for (const k in args || {}) s += ' data-a-' + k + '="' + esc(args[k]) + '"';
    return s;
  }
  const klik = (nama, args) => atribut('klik', nama, args);
  const ubah = (nama, args) => atribut('ubah', nama, args);
  const input = (nama, args) => atribut('input', nama, args);
  const kirim = (nama, args) => atribut('kirim', nama, args);
  const seret = (nama, args) => atribut('seret', nama, args);

  /** Membaca argumen data-a-<nama> dari elemen. */
  const arg = (el, nama) => el.getAttribute('data-a-' + nama);

  function jalankan(jenis, e) {
    const el = e.target.closest && e.target.closest('[' + ATRIBUT[jenis] + ']');
    if (!el) return;
    const nama = el.getAttribute(ATRIBUT[jenis]);
    const f = fungsi[nama];
    if (!f) { console.error('Aksi tidak terdaftar: ' + nama); return; }
    if (jenis == 'kirim' || jenis == 'seret' || el.tagName == 'A') e.preventDefault();
    const hasil = f(el, e);
    if (hasil && typeof hasil.catch == 'function') hasil.catch((err) => window.__err && window.__err((err && err.message) || err));
  }

  /** Memasang pendengar sekali saat aplikasi dimulai. */
  function pasang() {
    document.addEventListener('click', (e) => jalankan('klik', e));
    document.addEventListener('change', (e) => jalankan('ubah', e));
    document.addEventListener('input', (e) => jalankan('input', e));
    document.addEventListener('submit', (e) => jalankan('kirim', e));
    document.addEventListener('dragover', (e) => { if (e.target.closest && e.target.closest('[' + ATRIBUT.seret + ']')) e.preventDefault(); });
    document.addEventListener('drop', (e) => jalankan('seret', e));
  }

  KDMP.ui.aksi = { daftar, pasang, klik, ubah, input, kirim, seret, arg };
})(globalThis.KDMP);

</script>
<script>
/*
 * Pesan singkat (toast) dan dialog sandi.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;

  /** Pesan melayang 2,4 detik di bawah layar. */
  function toast(pesan) {
    const e = $('#tt');
    e.textContent = pesan;
    e.style.display = 'block';
    clearTimeout(e._t);
    e._t = setTimeout(() => (e.style.display = 'none'), 2400);
  }

  /** Dialog meminta sandi. @returns {Promise<string|null>} sandi, atau null bila dibatalkan. */
  function mintaSandi(pesan) {
    return new Promise(function (selesai) {
      const o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
      o.innerHTML = '<form style="background:#fff;color:#222;padding:18px;border-radius:8px;min-width:280px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.3)"><p style="margin:0 0 10px">' + pesan + '</p><input type=password autocomplete=current-password style="width:100%;box-sizing:border-box;padding:6px;margin-bottom:10px"><div style="text-align:right"><button type=button class=b>Batal</button> <button type=submit class=p>Lanjut</button></div></form>';
      document.body.appendChild(o);
      const kolom = o.querySelector('input');
      const tutup = (v) => { o.remove(); selesai(v); };
      kolom.focus();
      o.querySelector('form').onsubmit = (e) => { e.preventDefault(); tutup(kolom.value); };
      o.querySelector('.b').onclick = () => tutup(null);
    });
  }

  KDMP.ui.pesan = { toast, mintaSandi };
})(globalThis.KDMP);

</script>
<script>
/*
 * Menyimpan berkas ke komputer pengguna dan mencetak.
 */
(function (KDMP) {
  'use strict';

  /** Menyimpan Blob: memakai dialog "Simpan sebagai" bila browser mendukung, selain itu unduh biasa. */
  async function simpanSebagai(nama, blob) {
    if (window.showSaveFilePicker) {
      try {
        const h = await showSaveFilePicker({ suggestedName: nama });
        const w = await h.createWritable();
        await w.write(blob);
        await w.close();
        return;
      } catch (e) { if (e.name == 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nama;
    a.click();
  }

  const simpanJson = (nama, obj) => simpanSebagai(nama, new Blob([JSON.stringify(obj)], { type: 'application/json' }));

  /** Mencetak tampilan; orientasi landscape untuk konsolidasi dan buku pembantu. */
  function cetak() {
    const app = KDMP.app.state; // state dibaca saat dipanggil (modul app dimuat setelah ui)
    const st = document.createElement('style');
    st.textContent = '@page{size:A4 ' + (app.konsol || /^BP /.test(app.tab) ? 'landscape' : 'portrait') + ';margin:12mm}';
    document.head.appendChild(st);
    window.print();
    setTimeout(() => st.remove(), 800);
  }

  KDMP.ui.berkas = { simpanSebagai, simpanJson, cetak };
})(globalThis.KDMP);

</script>
<script>
/*
 * Kolom isian tanggal (ketik dd/mm/yyyy + pemilih kalender) dan kolom angka berformat Indonesia.
 * Isian tanggal menyimpan ke state lewat atribut data-t="<daftar>:<indeks>:<kolom>" (daftar = 'rows' atau nama buku pembantu).
 */
(function (KDMP) {
  'use strict';
  const { esc, tanggalId, bacaTanggal, periodeDari, NAMA_BULAN } = KDMP.core.format;
  const { klik, ubah } = KDMP.ui.aksi;

  /** HTML kolom tanggal. `mengikutiPeriode` = baris dipindah ke periode lain bila tanggal berubah bulan. */
  const kolomTanggal = (v, t, mengikutiPeriode) =>
    `<div class=dt data-t="${t}" data-v="${esc(v || '')}"${mengikutiPeriode ? ' data-fl=1' : ''}><input class="i dti" placeholder="dd/mm/yyyy" value="${tanggalId(v)}" ${ubah('tanggal.set')}><button type=button class=dtb title="Pilih tanggal" ${klik('tanggal.pilih')}>&#128197;</button><input type=date class=dtp tabindex=-1 value="${esc(v || '')}" ${ubah('tanggal.set')}></div>`;

  function bukaKalender(tombol) {
    const p = tombol.parentNode.querySelector('.dtp');
    try { p.showPicker(); } catch (e) { try { p.focus(); p.click(); } catch (e2) { /* browser lama: abaikan */ } }
  }

  function simpanTanggal(el) {
    const app = KDMP.app.state;
    const w = el.closest('.dt');
    const t = w.dataset.t.split(':');
    const tx = w.querySelector('.dti');
    const pk = w.querySelector('.dtp');
    let v;
    if (el.type == 'date') v = el.value;
    else if (!el.value.trim()) v = '';
    else {
      v = bacaTanggal(el.value);
      if (!v) { KDMP.ui.pesan.toast('Format tanggal: dd/mm/yyyy'); tx.value = tanggalId(w.dataset.v); return; }
    }
    w.dataset.v = v;
    tx.value = tanggalId(v);
    pk.value = v;
    const daftar = t[0] == 'rows' ? app.data.rows : KDMP.app.sub(t[0]);
    daftar[+t[1]][t[2]] = v;
    KDMP.app.simpan.jadwalkan();
    if (t[0] == 'rows') KDMP.ui.header.status();
    if (w.dataset.fl && v) {
      const q = periodeDari(v);
      if (q != KDMP.app.periode()) {
        app.keep.delete(daftar[+t[1]]);
        const m = q % 12 || 12;
        const y = (q - m) / 12;
        KDMP.ui.pesan.toast('Baris dipindahkan ke periode ' + NAMA_BULAN[m - 1] + ' ' + y);
        KDMP.app.navigasi.pergi();
      }
    }
  }

  /** Memformat angka saat mengetik (titik ribuan, koma desimal maks 2 digit) sambil menjaga posisi kursor. */
  function formatSaatMengetik(el) {
    const v = el.value;
    const p = el.selectionStart;
    let k = 0;
    for (let i = 0; i < p; i++) if (/[\d,]/.test(v[i])) k++;
    const s = v.replace(/[^\d,]/g, '');
    const ci = s.indexOf(',');
    let a = ci < 0 ? s : s.slice(0, ci);
    const b = ci < 0 ? null : s.slice(ci + 1).replace(/,/g, '').slice(0, 2);
    a = a.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const nv = a + (b === null ? '' : ',' + b);
    el.value = nv;
    let c = 0;
    let np = 0;
    for (; np < nv.length && c < k; np++) if (/[\d,]/.test(nv[np])) c++;
    try { el.setSelectionRange(np, np); } catch (e) { /* tipe input tak mendukung */ }
  }

  KDMP.ui.aksi.daftar({
    'tanggal.set': (el) => simpanTanggal(el),
    'tanggal.pilih': (el) => bukaKalender(el),
    'angka.ketik': (el) => formatSaatMengetik(el)
  });
  KDMP.ui.tanggalAngka = { kolomTanggal, formatSaatMengetik };
})(globalThis.KDMP);

</script>

<script>
/*
 * Kop laporan (logo, nama koperasi, judul, periode), isian data koperasi, dan kolom tanda tangan.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const { klik, ubah, arg } = KDMP.ui.aksi;
  const { tanggalPanjang } = KDMP.core.format;
  const apl = KDMP.config.aplikasi;

  /** Logo yang dipakai: logo kustom pengguna (data URL di state) atau logo bawaan dari konfigurasi. */
  const logo = () => { const d = KDMP.app.state.data; return (d && d.logo) || apl.logo; };
  const tanggalLaporan = () => { const d = KDMP.app.state.data; return tanggalPanjang(+d.tahun, KDMP.app.bulan()); };

  /** Kop di atas tiap laporan. `judul` mis. "NERACA SALDO". */
  function kop(judul) {
    const d = KDMP.app.state.data;
    return `<div class=hd><img src="${logo()}" alt="Logo"><div class=ht><b>${(d.kop || apl.singkatan).toUpperCase()}</b><br>${d.alamat || ''}<h3>${judul}</h3><b>${KDMP.app.state.konfig.name.toUpperCase()}</b><br>${/LABA RUGI|ARUS KAS/.test(judul) ? 'Untuk periode yang berakhir sampai dengan ' : 'Per '}${tanggalLaporan()}<br><i>(dalam rupiah)</i></div></div>`;
  }

  const KOLOM_IDENTITAS = [['kop', 'Nama koperasi'], ['alamat', 'Alamat'], ['kota', 'Kab/Kota'], ['pet', 'Petugas Akuntansi'], ['ben', 'Bendahara'], ['ket', 'Ketua Koperasi']];

  /** Isian identitas koperasi + logo (tab Data). */
  function isianIdentitas() {
    const d = KDMP.app.state.data;
    return '<div class=bar style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' +
      KOLOM_IDENTITAS.map(([k, l]) => `<label>${l}<br><input style=width:95% value="${(d[k] || '').replace(/"/g, '&quot;')}" ${ubah('kop.isi', { k })}></label>`).join('') +
      '</div><div style="margin-top:8px">Logo: <img src="' + logo() + '" style="height:44px;vertical-align:middle"> <input type=file accept="image/*" ' + ubah('kop.logo') + '> <button ' + klik('kop.logoAwal') + '>Logo awal</button></div>';
  }

  /** Tanda tangan di bawah laporan. */
  function tandaTangan() {
    const d = KDMP.app.state.data;
    const c = (x, k) => `<td style="text-align:center;width:33%"><b>${x}</b><br><br><br><br><b><u>${d[k] || '………………'}</u></b></td>`;
    return `<table class=sg style="margin-top:20px"><tr><td></td><td></td><td style="text-align:center">${d.kota || ''}, ${tanggalLaporan()}</td></tr><tr>${c('Petugas Akuntansi', 'pet')}${c('Bendahara', 'ben')}${c('Ketua Koperasi', 'ket')}</tr></table>`;
  }

  /** Memperkecil gambar logo (maks 260 px) lalu menyimpannya sebagai data URL di data unit. */
  function pasangLogo(berkas) {
    if (!berkas) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 260 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k));
        c.height = Math.max(1, Math.round(im.height * k));
        const g = c.getContext('2d');
        g.drawImage(im, 0, 0, c.width, c.height);
        let d = c.toDataURL('image/png');
        if (d.length > 120000) { // PNG terlalu besar -> JPEG berlatar putih
          g.globalCompositeOperation = 'destination-over';
          g.fillStyle = '#fff';
          g.fillRect(0, 0, c.width, c.height);
          d = c.toDataURL('image/jpeg', 0.85);
        }
        KDMP.app.state.data.logo = d;
        KDMP.app.simpan.jadwalkan();
        $('#lg').src = logo();
        KDMP.app.navigasi.pergi();
      };
      im.onerror = () => alert('File gambar tidak dapat dibaca.');
      im.src = r.result;
    };
    r.readAsDataURL(berkas);
  }

  KDMP.ui.aksi.daftar({
    'kop.isi': (el) => { KDMP.app.state.data[arg(el, 'k')] = el.value; KDMP.app.simpan.jadwalkan(); },
    'kop.logo': (el) => pasangLogo(el.files[0]),
    'kop.logoAwal': () => {
      if (!confirm('Kembalikan ke logo awal?')) return;
      delete KDMP.app.state.data.logo;
      KDMP.app.simpan.jadwalkan();
      $('#lg').src = logo();
      KDMP.app.navigasi.pergi();
    }
  });

  KDMP.ui.kop = { logo, tanggalLaporan, kop, isianIdentitas, tandaTangan };
})(globalThis.KDMP);

</script>
<script>
/*
 * Menggambar tabel laporan (Kode | Uraian | kolom angka...) dari hasil KDMP.core.laporan.
 */
(function (KDMP) {
  'use strict';
  const { rupiah, NAMA_BULAN } = KDMP.core.format;
  const { ubah } = KDMP.ui.aksi;

  /** Uraian baris spesifikasi: nama akun dari Master COA, atau teks tetap; "=" berarti label laba berjalan. */
  function uraian(it) {
    const d = KDMP.app.state.data;
    const l = it[0] == 'O' ? it[1] : (it[0] == 'A' && KDMP.core.coa.nama(it[1])) || it[2];
    return l[0] == '=' ? 'Laba s/d ' + NAMA_BULAN[KDMP.app.bulan() - 1].toUpperCase() + ' ' + d.tahun : l;
  }

  /**
   * @param {Array} rows   baris hasil susunLaporan
   * @param {Array<Array<number>>} cols  nilai per kolom (sejajar rows)
   * @param {string[]} heads  judul kolom angka
   * @param {{j:number,k:string}} [inp]  kolom ke-j berupa isian eliminasi manual yang disimpan di state.data[k]
   */
  function tabelLaporan(rows, cols, heads, inp) {
    const d = KDMP.app.state.data;
    let h = '<table><tr><th>Kode</th><th>Uraian</th>' + heads.map((x) => '<th>' + x + '</th>').join('') + '</tr>';
    rows.forEach(function (r, i) {
      const it = r.it;
      const t = it[0];
      if (t == 'O' && cols.every((c) => Math.abs(c[i]) < 0.5)) return;
      const cl = t == 'H' ? 'h' + it[1] : t == 'S' || t == 'T' ? (uraian(it) == uraian(it).toUpperCase() ? 'g' : 't') : '';
      h += `<tr class="${cl}"><td class=c>${t == 'A' ? it[1] : ''}</td><td>${uraian(it)}</td>` +
        cols.map((c, j) => t == 'H' ? '<td></td>'
          : inp && j == inp.j && t == 'A' ? `<td class=n><input class="i n" data-k="${it[1]}" value="${d[inp.k][it[1]] || ''}" ${ubah('eliminasi.set', { ek: inp.k })}></td>`
          : `<td class=n>${rupiah(c[i])}</td>`).join('') + '</tr>';
    });
    return h + '</table>';
  }

  KDMP.ui.aksi.daftar({
    'eliminasi.set': (el) => {
      KDMP.app.state.data[KDMP.ui.aksi.arg(el, 'ek')][el.dataset.k] = +el.value || 0;
      KDMP.app.simpan.jadwalkan();
      KDMP.app.navigasi.pergi();
    }
  });

  KDMP.ui.tabelLaporan = { uraian, tabelLaporan };
})(globalThis.KDMP);

</script>
<script>
/*
 * Ekspor tampilan ke CSV dan Excel (.xls berbasis HTML). Ekspor membaca tabel yang sedang tampil di layar
 * (matriks()), sehingga isi berkas selalu sama dengan yang dilihat pengguna.
 */
(function (KDMP) {
  'use strict';
  const { esc, bacaAngka, NAMA_BULAN } = KDMP.core.format;
  const { simpanSebagai } = KDMP.ui.berkas;

  /**
   * Membaca semua tabel (selain tabel tanda tangan .sg) di area utama menjadi matriks
   * [{c: kelas baris, v: [nilai sel...]}]. Sel angka dikembalikan sebagai number.
   */
  function matriks() {
    const out = [];
    document.querySelectorAll('#m table:not(.sg)').forEach(function (t, ti) {
      if (ti) out.push({ c: '', v: [] });
      [...t.rows].forEach(function (r) {
        const th = r.cells[0] && r.cells[0].tagName == 'TH';
        out.push({
          c: (r.className || '') + (th ? ' th' : ''),
          v: [...r.cells].map(function (c) {
            const s = c.querySelector('select');
            const i = c.querySelector('input');
            let x;
            if (c.dataset.v !== undefined) return +c.dataset.v;
            if (i) x = c.classList.contains('n') ? (i.dataset.f ? bacaAngka(i.value) : +i.value || 0) : i.value.trim();
            else if (s) x = s.options[s.selectedIndex] ? s.options[s.selectedIndex].text : '';
            else {
              x = c.textContent.trim();
              if (c.classList.contains('n')) {
                if (x === '-' || x === '') x = 0;
                else if (/^-?\(?[\d.]+\)?$/.test(x)) {
                  const v = +x.replace(/[().]/g, '');
                  x = /^\(/.test(x) ? -v : v;
                }
              }
            }
            return x;
          })
        });
      });
    });
    return out;
  }

  function namaBerkas(nama, ekstensi) {
    const app = KDMP.app.state;
    return (app.unit + '_' + nama).replace(/[^\w]+/g, '_') + '_' + NAMA_BULAN[KDMP.app.bulan() - 1] + app.data.tahun + '.' + ekstensi;
  }

  const judulKop = () => (KDMP.app.state.data.kop || '') + ' — ' + KDMP.app.state.konfig.name;

  function csv() {
    const app = KDMP.app.state;
    const m = matriks();
    if (!m.length) return alert('Tidak ada tabel untuk diekspor.');
    const q = (x) => (/[;"\n]/.test(x + '') ? '"' + (x + '').replace(/"/g, '""') + '"' : x);
    const r = [judulKop(), app.tab + ' — per ' + KDMP.ui.kop.tanggalLaporan(), ''].map(q).concat(m.map((r) => r.v.map(q).join(';')));
    simpanSebagai(namaBerkas(app.tab, 'csv'), new Blob(['﻿' + r.join('\r\n')], { type: 'text/csv' }));
  }

  /** @param {Array<[string, Array]>} bagian  pasangan [judul, matriks] */
  function tulisExcel(bagian, nama) {
    let h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>';
    bagian.forEach(function ([t, m]) {
      const w = Math.max(1, ...m.map((r) => r.v.length));
      h += `<table border=1 style="border-collapse:collapse"><tr><td colspan=${w} style="font-size:14pt;font-weight:bold">${esc(judulKop())}</td></tr><tr><td colspan=${w} style="font-weight:bold">${esc(t)} — per ${KDMP.ui.kop.tanggalLaporan()}</td></tr><tr><td colspan=${w}></td></tr>`;
      m.forEach(function (r) {
        const k = ' ' + r.c + ' ';
        const st = k.includes(' th ') ? 'background:#7F1018;color:#fff;font-weight:bold'
          : k.includes(' g ') ? 'background:#A4161F;color:#fff;font-weight:bold'
          : k.includes(' h1 ') ? 'background:#F0D9DA;font-weight:bold'
          : k.includes(' h2 ') ? 'background:#F9ECEC;font-weight:bold'
          : k.includes(' t ') ? 'background:#eee;font-weight:bold' : '';
        h += `<tr style="${st}">` + r.v.map((x) => (typeof x == 'number' ? `<td${Number.isInteger(x) ? ` style="mso-number-format:'#,##0;(#,##0)'"` : ''}>${x}</td>` : `<td>${esc(x)}</td>`)).join('') + '</tr>';
      });
      h += '</table><br>';
    });
    simpanSebagai(namaBerkas(nama, 'xls'), new Blob(['﻿' + h + '</body></html>'], { type: 'application/vnd.ms-excel' }));
  }

  function excel() {
    const m = matriks();
    if (!m.length) return alert('Tidak ada tabel untuk diekspor.');
    tulisExcel([[KDMP.app.state.tab, m]], KDMP.app.state.tab);
  }

  /** Semua laporan utama sekaligus dalam satu berkas Excel (tiap laporan satu blok). */
  function excelSemua() {
    const app = KDMP.app.state;
    const daftar = app.konsol ? ['Neraca Konsolidasi', 'Laba Rugi Konsolidasi'] : ['Neraca Saldo', 'Laba Rugi', 'Neraca', 'Arus Kas'];
    const semula = app.tab;
    const bagian = [];
    daftar.forEach((t) => { app.tab = t; KDMP.app.tab[t].render(); bagian.push([t, matriks()]); });
    app.tab = semula;
    KDMP.app.navigasi.pergi();
    tulisExcel(bagian, 'Semua_Laporan');
  }

  KDMP.ui.aksi.daftar({
    'ekspor.excel': (el) => { excel(); KDMP.ui.dom.tutupMenu(el); },
    'ekspor.csv': (el) => { csv(); KDMP.ui.dom.tutupMenu(el); },
    'ekspor.excelSemua': (el) => { excelSemua(); KDMP.ui.dom.tutupMenu(el); },
    'ekspor.cetak': (el) => { KDMP.ui.berkas.cetak(); KDMP.ui.dom.tutupMenu(el); }
  });

  KDMP.ui.ekspor = { matriks, csv, excel, excelSemua };
})(globalThis.KDMP);

</script>
