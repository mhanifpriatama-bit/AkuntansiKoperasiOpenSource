<script>
/*
 * Komponen tabel isian untuk buku pembantu (BP Aset, BP Persediaan): grid() menggambar daftar baris yang
 * tersimpan di state.data.sub[nama], dengan kolom yang dijelaskan oleh pemanggil.
 *
 * Deskripsi kolom: {k: nama field, l: judul, t: 'date'|'number'|'text', m: true (angka berformat), o: opsi dropdown, w: lebar min, list: id datalist}
 */
(function (KDMP) {
  'use strict';
  const { esc, rupiah, angka, angkaInput, bacaAngka, periodeDari, NAMA_BULAN } = KDMP.core.format;
  const { klik, ubah, input, arg } = KDMP.ui.aksi;
  const { kolomTanggal } = KDMP.ui.tanggalAngka;
  const app = KDMP.app.state;
  const simpan = () => KDMP.app.simpan.jadwalkan();

  /** Isi awal baris baru per buku pembantu. */
  const BARIS_BARU = {
    aset: () => ({ tgl: KDMP.core.format.hariIni(), umur: 4, met: 'Garis Lurus' }),
    pb: () => ({ akun: '1.1.4.01' }),
    pm: () => ({ d: KDMP.core.format.hariIni(), j: 'Masuk' })
  };

  /** <option> dari daftar nilai atau pasangan [nilai, teks]; `terpilih` ditandai selected. */
  const opsi = (o, terpilih) => o.map((x) => {
    const a = Array.isArray(x) ? x : [x, x];
    return `<option value="${esc(a[0])}"${a[0] == terpilih ? ' selected' : ''}>${esc(a[1])}</option>`;
  }).join('');

  /**
   * @param {string} p     nama buku pembantu (kunci di state.data.sub)
   * @param {Array} cols   deskripsi kolom
   * @param {string} note  catatan di samping tombol tambah
   * @param {string} [dk]  kolom tanggal yang menentukan periode; bila ada, hanya baris periode terpilih yang tampil
   */
  function grid(p, cols, note, dk) {
    const a = KDMP.app.sub(p);
    const PP = KDMP.app.periode();
    const tampil = [];
    a.forEach((r, i) => { if (!dk || !r[dk] || periodeDari(r[dk]) == PP || app.keep.has(r)) tampil.push(i); });
    let h = `<div class=bar><button class=p ${klik('grid.tambah', { p, n: 1 })}>+ Baris</button><button ${klik('grid.tambah', { p, n: 10 })}>+10 Baris</button><span class=c>${dk ? '<b>Periode ' + NAMA_BULAN[KDMP.app.bulan() - 1] + ' ' + app.data.tahun + '</b> (' + tampil.length + ' baris). Ganti bulan/tahun di kanan atas untuk periode lain; data periode sebelumnya tetap tersimpan. ' : ''}${note || ''}</span></div><table><tr><th>#</th>${cols.map((c) => `<th>${c.l}</th>`).join('')}<th></th></tr>`;
    tampil.forEach(function (i, ix) {
      const r = a[i];
      h += `<tr><td class=c>${ix + 1}</td>` + cols.map(function (c) {
        const v = r[c.k];
        if (c.t == 'date') return `<td>${kolomTanggal(v, p + ':' + i + ':' + c.k, dk == c.k)}</td>`;
        if (c.o) return `<td><select ${ubah('grid.isi', { p, i, k: c.k })}><option></option>${opsi(c.o, v)}</select></td>`;
        if (c.m) return `<td class="n"${c.w ? ` style="min-width:${c.w}px"` : ''}><input class="i n" inputmode=numeric value="${angkaInput(v)}" ${input('angka.ketik')} ${ubah('grid.angka', { p, i, k: c.k })}></td>`;
        const n = c.t == 'number';
        return `<td class="${n ? 'n' : ''}"${c.w ? ` style="min-width:${c.w}px"` : ''}><input class="i ${n ? 'n' : ''}" type="${c.t || 'text'}"${c.list ? ' list=' + c.list : ''} value="${esc(v)}" ${ubah('grid.isi', { p, i, k: c.k, n: n ? 1 : 0 })}></td>`;
      }).join('') + `<td><button ${klik('grid.hapus', { p, i })}>×</button></td></tr>`;
    });
    return h + '</table>';
  }

  /** Sub-tab (mis. Daftar Aset | Jadwal Penyusutan). @returns {[string, string]} [sub-tab aktif, HTML tombol] */
  function subTab(tab, daftar) {
    const cur = daftar.includes(app.sv[tab]) ? app.sv[tab] : daftar[0];
    app.sv[tab] = cur;
    return [cur, `<div class="bar sbar">${daftar.map((x) => `<button class="${x == cur ? 'on' : ''}" ${klik('grid.subTab', { tab, x })}>${x}</button>`).join('')}</div>`];
  }

  const sel = (n) => `<td class=n>${rupiah(n)}</td>`;
  /** Tabel rekonsiliasi buku pembantu vs buku besar. rows: [[label, buku pembantu, buku besar]] */
  function rekonsiliasi(rows, judul) {
    let h = `<h4>${judul || 'Rekonsiliasi dengan Buku Besar'}</h4><table><tr><th>Akun</th><th>Buku Pembantu</th><th>Buku Besar</th><th>Selisih</th><th>Status</th></tr>`;
    rows.forEach(([l, s, g]) => {
      const d = s - g;
      const ok = Math.round(d) == 0;
      h += `<tr><td>${l}</td>${sel(s)}${sel(g)}${sel(d)}<td class="${ok ? 'ok' : 'no'}">${ok ? 'Sesuai' : 'Selisih'}</td></tr>`;
    });
    return h + '</table>';
  }

  /** Kolom pilihan satu nilai (mis. barang untuk Kartu Stok): menyimpan ke state.sel[key]. */
  const pilih = (key, listId, label) => `<div class=bar><label>${label}: <input list=${listId} style=width:220px value="${esc(app.sel[key] || '')}" ${ubah('grid.pilih', { key })}></label></div>`;
  const barisTotal = (sel_, cls) => `<tr class="${cls || 'g'}">${sel_}</tr>`;
  const selAngka = (v) => `<td class=n data-v="${v}">${angka(v)}</td>`;

  KDMP.ui.aksi.daftar({
    'grid.tambah': (el) => {
      const p = arg(el, 'p');
      const a = KDMP.app.sub(p);
      for (let i = 0; i < +arg(el, 'n'); i++) { const o = BARIS_BARU[p] ? BARIS_BARU[p]() : {}; a.push(o); app.keep.add(o); }
      simpan();
      KDMP.app.navigasi.pergi();
    },
    'grid.isi': (el) => { KDMP.app.sub(arg(el, 'p'))[+arg(el, 'i')][arg(el, 'k')] = arg(el, 'n') == '1' ? +el.value || 0 : el.value; simpan(); },
    'grid.angka': (el) => {
      const v = bacaAngka(el.value);
      KDMP.app.sub(arg(el, 'p'))[+arg(el, 'i')][arg(el, 'k')] = v;
      el.value = angkaInput(v);
      simpan();
    },
    'grid.hapus': (el) => { if (confirm('Hapus baris ini?')) { KDMP.app.sub(arg(el, 'p')).splice(+arg(el, 'i'), 1); simpan(); KDMP.app.navigasi.pergi(); } },
    'grid.subTab': (el) => { app.sv[arg(el, 'tab')] = arg(el, 'x'); KDMP.app.navigasi.pergi(); },
    'grid.pilih': (el) => { app.sel[arg(el, 'key')] = el.value.trim(); KDMP.app.navigasi.pergi(); }
  });

  KDMP.ui.grid = { grid, subTab, rekonsiliasi, pilih, barisTotal, opsi, selAngka, selRupiah: sel };
})(globalThis.KDMP);

</script>
<script>
/*
 * Simpan otomatis data aktif ke IndexedDB (terenkripsi dengan kunci sesi), tertunda 300 ms setelah perubahan
 * terakhir. Sekali sehari, sebelum simpan pertama, salinan versi sebelumnya dijadikan titik pulih otomatis.
 */
(function (KDMP) {
  'use strict';
  const kripto = KDMP.security.kripto;
  const kv = KDMP.storage.kv;
  const app = KDMP.app.state;
  let timer;
  let kotor = false;
  let terakhir = '';
  let hariSnapshot = '';

  async function saatIni() {
    clearTimeout(timer);
    if (!app.data || !app.kunci.DK) return;
    const d = Object.assign({}, app.data);
    delete d.units; // data unit untuk konsolidasi tidak ikut disimpan di data Admin
    const blob = await kripto.enkripsiJson(app.kunci.DK, d);
    const hari = new Date().toISOString().slice(0, 10);
    if (hariSnapshot != hari) {
      hariSnapshot = hari;
      const lama = await kv.get(app.kunci.KEY);
      if (lama) await KDMP.storage.titikPulih.buat(app.unit, 'Otomatis (sebelum perubahan pertama hari ini)', lama);
      await KDMP.storage.titikPulih.pangkas(app.unit);
    }
    await kv.set(app.kunci.KEY, blob);
    kotor = false;
    terakhir = new Date().toLocaleTimeString('id-ID');
    KDMP.ui.header.statusSimpan(kotor, terakhir);
  }

  /** Menandai ada perubahan; simpan sungguhan dijalankan 300 ms kemudian. */
  function jadwalkan() {
    kotor = true;
    KDMP.ui.header.statusSimpan(kotor, terakhir);
    clearTimeout(timer);
    timer = setTimeout(saatIni, 300);
  }

  /** Dipanggil saat sesi baru dimulai. */
  function reset() { hariSnapshot = ''; terakhir = ''; kotor = false; }

  async function manual() {
    if (!app.data) return;
    await saatIni();
    KDMP.ui.pesan.toast('Data tersimpan ke database aplikasi (' + terakhir + ')');
  }

  KDMP.app.simpan = { saatIni, jadwalkan, reset, manual, adaPerubahan: () => kotor, waktuTerakhir: () => terakhir };
  KDMP.ui.aksi.daftar({ 'simpan.manual': () => manual() });
})(globalThis.KDMP);

</script>
<script>
/*
 * Navigasi antar tab. Setiap tab didaftarkan di KDMP.app.tab[nama] = { render() } oleh berkas di js/fitur/.
 */
(function (KDMP) {
  'use strict';
  const { $, tambahDiAwal, tambahDiAkhir } = KDMP.ui.dom;
  const { klik, arg } = KDMP.ui.aksi;
  const app = KDMP.app.state;

  /** Tab yang diberi kolom tanda tangan di bawahnya. */
  const TAB_LAPORAN = ['Neraca Saldo', 'Laba Rugi', 'Neraca', 'Arus Kas', 'Neraca Konsolidasi', 'Laba Rugi Konsolidasi'];

  /** Tab yang tersedia untuk sesi `unit` (kode unit mana pun, atau KONSOL). BP Persediaan hanya bila unit memakainya. */
  function daftarTab(unit) {
    if (unit == 'KONSOL') return ['Neraca Konsolidasi', 'Laba Rugi Konsolidasi', 'Master COA', 'Data Unit'];
    return ['Jurnal', 'Buku Besar', 'Neraca Saldo', 'Laba Rugi', 'Neraca', 'Arus Kas'].concat(KDMP.core.unit.punyaPersediaan(unit) ? ['BP Aset', 'BP Persediaan'] : ['BP Aset'], ['Data']);
  }

  /** Membuka tab `nama` (atau menggambar ulang tab aktif bila nama kosong). */
  function pergi(nama) {
    if (nama) app.tab = nama;
    $('#nav').innerHTML = app.tabs.map((x) => `<button class="${x == app.tab ? 'on' : ''}" ${klik('nav.tab', { tab: x })}>${x}</button>`).join('');
    KDMP.ui.header.status();
    KDMP.ui.header.statusSimpan(KDMP.app.simpan.adaPerubahan(), KDMP.app.simpan.waktuTerakhir());
    KDMP.app.tab[app.tab].render();
    if (app.konsol && app.tab != 'Data Unit') tambahDiAwal(KDMP.fitur.spandukKonsolidasi());
    if (TAB_LAPORAN.includes(app.tab)) tambahDiAkhir(KDMP.ui.kop.tandaTangan());
  }

  KDMP.ui.aksi.daftar({ 'nav.tab': (el) => pergi(arg(el, 'tab')) });
  KDMP.app.navigasi = { daftarTab, pergi, TAB_LAPORAN };
})(globalThis.KDMP);

</script>
<script>
/*
 * Sinkronisasi antar tab/jendela browser pada komputer yang sama: tiap 10 detik memeriksa waktu ubah data unit
 * dan COA di IndexedDB; bila berubah, Konsolidasi membaca ulang data unit (kecuali unit yang diimpor dari paket).
 */
(function (KDMP) {
  'use strict';
  const kv = KDMP.storage.kv;
  const app = KDMP.app.state;
  const UNIT = KDMP.config.aplikasi.unit;
  let versi = {};
  let timer;

  const teks = (t) => { const e = document.getElementById('sync'); if (e) e.textContent = t; };
  const versiSekarang = () => kv.ver(UNIT.map((u) => 'd_' + u).concat(['coa']));

  async function mulai() {
    try { versi = await versiSekarang(); } catch (e) { versi = {}; }
    clearInterval(timer);
    timer = setInterval(periksa, 10000);
    teks('✔ database lokal (offline)');
  }

  async function periksa() {
    if (document.hidden || !app.data || !app.kunci.DK) return;
    try {
      const v = await versiSekarang();
      const berubah = Object.keys(v).filter((k) => versi[k] !== v[k]);
      if (!berubah.length) { teks('🔄 sinkron ' + new Date().toLocaleTimeString('id-ID')); return; }
      for (const k of berubah) {
        if (k == 'coa') { await KDMP.storage.coaDb.muat(); continue; }
        const u = k.slice(2);
        if (app.konsol && UNIT.includes(u) && !(app.data.imp && app.data.imp[u])) {
          const x = await kv.get(k);
          if (x) {
            try {
              const d = await KDMP.security.kripto.dekripsiJson(await KDMP.security.kripto.kunciDariMentah(app.kunci.RAW[u]), x);
              app.data.units[u] = { rows: d.rows, tgl: 'sinkron ' + new Date().toLocaleTimeString('id-ID') };
            } catch (e) { /* data unit belum bisa dibaca: lewati */ }
          }
        }
      }
      versi = v;
      teks('🔄 data diperbarui ' + new Date().toLocaleTimeString('id-ID'));
      const a = document.activeElement;
      if (app.konsol && !(a && a.tagName == 'INPUT')) KDMP.app.navigasi.pergi();
    } catch (e) { teks('⚠ tidak terhubung'); }
  }

  KDMP.app.sinkron = { mulai };
})(globalThis.KDMP);

</script>
<script>
/*
 * Backup & pemulihan database lengkap (tampilan/ interaksi). Logika berkas ada di KDMP.storage.backup.
 */
(function (KDMP) {
  'use strict';
  const kv = KDMP.storage.kv;
  const backup = KDMP.storage.backup;

  async function unduh() {
    const b = await backup.buatBerkas();
    await KDMP.ui.berkas.simpanSebagai(b.nama, new Blob([b.isi], { type: 'application/json' }));
    backup.tandaiSudahBackup();
  }

  function pulihDariBerkas(berkas) {
    if (!berkas) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const o = backup.bacaBerkas(r.result);
        if ((await kv.get('meta')) && !confirm('Data di database browser ini akan DITIMPA oleh file backup. Lanjut?')) return;
        await backup.pulihkan(o);
        alert('Berhasil dipulihkan. Masuk dengan sandi LAMA Anda.');
        location.reload();
      } catch (e) { alert('File bukan cadangan lengkap KDMP.'); }
    };
    r.readAsText(berkas);
  }

  KDMP.ui.aksi.daftar({
    'backup.unduh': (el) => { unduh(); KDMP.ui.dom.tutupMenu(el); },
    'backup.pulihkan': (el) => { pulihDariBerkas(el.files[0]); el.value = ''; }, // File tetap valid setelah input dikosongkan
    'backup.pilihBerkas': (el) => { document.getElementById('rf').click(); KDMP.ui.dom.tutupMenu(el); }
  });
  KDMP.app.cadangan = { unduh, pulihDariBerkas };
})(globalThis.KDMP);

</script>
<script>
/*
 * Ganti sandi dari tab Data (unit) atau Data Unit (Admin). Logika kunci ada di KDMP.security.kunci.
 */
(function (KDMP) {
  'use strict';
  const app = KDMP.app.state;
  const UNIT = KDMP.config.aplikasi.unit;

  async function ganti(u, sandiBaru) {
    if (!sandiBaru || sandiBaru.length < 6) return alert('Sandi minimal 6 karakter');
    const k = app.kunci;
    if (u == 'Admin' && app.konsol) {
      k.DK = await KDMP.security.kunci.gantiSandiAdmin(k.META, k.RAW, sandiBaru);
      k.PIN = sandiBaru;
      KDMP.app.simpan.jadwalkan(); // data Admin dienkripsi ulang dengan kunci baru
    } else if (app.konsol ? UNIT.includes(u) && k.META.units[u] && k.RAW[u] : u == app.unit) {
      await KDMP.security.kunci.gantiSandiUnit(k.META, u, app.konsol ? k.RAW[u] : k.RAW, sandiBaru);
      if (!app.konsol) k.PIN = sandiBaru;
    } else return alert('Tidak diizinkan');
    try {
      await KDMP.storage.kv.set('meta', k.META);
      alert('Sandi diganti');
    } catch (e) { alert('Gagal menyimpan ke server: ' + ((e && e.message) || e)); }
  }

  KDMP.ui.aksi.daftar({
    'sandi.gantiUnit': () => ganti(app.unit, prompt('Sandi baru (min. 6 karakter):') || ''),
    'sandi.gantiAdmin': () => ganti('Admin', prompt('Sandi Admin baru:') || ''),
    'sandi.resetUnit': () => { const u = prompt('Unit (' + UNIT.join('/') + '):'); return ganti(u, prompt('Sandi baru unit:') || ''); }
  });
  KDMP.app.sandi = { ganti };
})(globalThis.KDMP);

</script>
<script>
/*
 * Paket unit (.kdmp.json): ekspor dari unit, impor ke unit yang sama (pindah komputer), dan impor
 * backup/paket kedua unit ke Konsolidasi. Semua tetap terenkripsi; sandi Admin harus sama di semua komputer.
 */
(function (KDMP) {
  'use strict';
  const kv = KDMP.storage.kv;
  const kripto = KDMP.security.kripto;
  const { esc } = KDMP.core.format;
  const { klik, arg } = KDMP.ui.aksi;
  const app = KDMP.app.state;
  const UNIT = KDMP.config.aplikasi.unit;
  const unitBaru = { // diambil saat dipakai: js/app/unit-baru.js dimuat setelah berkas ini
    kenali: (...a) => KDMP.app.unitBaru.kenali(...a),
    terima: (...a) => KDMP.app.unitBaru.terima(...a),
    rapikan: () => KDMP.app.unitBaru.rapikan()
  };
  let hasilImpor = '';

  const bukaData = async (mentah, teks) => kripto.dekripsiJson(await kripto.kunciDariMentah(mentah), teks);
  const tglId = (t) => new Date(t).toLocaleString('id-ID');

  async function ekspor() {
    await KDMP.app.simpan.saatIni();
    const k = app.kunci;
    const m = k.META.units[app.unit];
    const ts = Date.now();
    const d = app.data;
    const def = KDMP.core.unit.defUntuk(app.unit); // hanya ada untuk unit tambahan; Konsolidasi memakainya untuk mengenali unit baru
    await KDMP.ui.berkas.simpanJson('KDMP_' + app.unit + '_' + new Date().toISOString().slice(0, 10) + '.kdmp.json', Object.assign({
      app: 'kdmp2', unit: app.unit, ts, saltA: k.META.saltA, s: m.s, wU: m.wU, wA: m.wA, tgl: tglId(ts),
      data: await kripto.enkripsiJson(k.DK, { rows: d.rows.filter((r) => r.ak || r.db || r.kr), kop: d.kop, tahun: d.tahun, sub: d.sub, cv: 3 })
    }, def ? { def } : {}));
    await kv.set('lastexp_' + app.unit, ts);
    infoEkspor();
  }

  /** Teks status ekspor di tab Data ("terakhir diekspor ..."). */
  async function infoEkspor() {
    const e = document.getElementById('ei');
    if (!e || app.konsol) return;
    const le = await kv.get('lastexp_' + app.unit);
    const v = await kv.ver([app.kunci.KEY]);
    const t = v[app.kunci.KEY] ? +v[app.kunci.KEY] : 0;
    e.innerHTML = !le ? '<b class=no>⚠ Paket belum pernah diekspor untuk bendahara.</b>'
      : 'Terakhir diekspor untuk bendahara: <b>' + tglId(le) + '</b>' + (t > le + 1000 ? ' — <b class=no>⚠ ada perubahan data setelah itu, ekspor ulang.</b>' : ' — <span class=ok>data sudah sama dengan paket.</span>');
  }

  /** Impor paket milik unit ini sendiri (mis. pindah komputer). */
  function imporPaket(berkas) {
    const r = new FileReader();
    r.onload = async () => {
      try {
        const o = JSON.parse(r.result);
        if (o.unit != app.unit) throw 0;
        const mentah = await kripto.dekripsi(await kripto.turunkanKunci(app.kunci.PIN, kripto.dariBase64(o.s)), o.wU);
        const d = await bukaData(mentah, o.data);
        app.data.rows = d.rows;
        app.data.kop = d.kop || app.data.kop;
        if (d.sub) app.data.sub = d.sub;
        KDMP.app.simpan.jadwalkan();
        KDMP.app.navigasi.pergi('Jurnal');
      } catch (e) { alert('Gagal: file bukan milik unit ini atau sandi berbeda.'); }
    };
    r.readAsText(berkas);
  }

  /** Impor banyak berkas (backup lengkap atau paket unit) ke Konsolidasi. Hasil ditampilkan di tab Data Unit. */
  async function imporKonsol(daftarBerkas) {
    const berkas = [...daftarBerkas];
    if (!berkas.length) return;
    const L = [];
    const terbaik = {};
    const d0 = app.data;
    for (const f of berkas) {
      try {
        const o = JSON.parse(await f.text());
        if (o && o.app == 'kdmp-full' && o.kv && o.kv.meta) {
          const mt = o.kv.meta;
          let kunciAdmin;
          let n = 0;
          (Array.isArray(o.kv.units_custom) ? o.kv.units_custom : []).forEach((df) => { if (df && df.kode && mt.units && mt.units[df.kode]) unitBaru.kenali(df, df.kode); });
          try { kunciAdmin = await kripto.turunkanKunci(app.kunci.PIN, kripto.dariBase64(mt.saltA)); } catch (e) { throw new Error('backup rusak'); }
          for (const u of UNIT) {
            const x = o.kv['d_' + u];
            if (!x || !mt.units || !mt.units[u]) continue;
            let d;
            let mentah;
            try { mentah = await kripto.dekripsi(kunciAdmin, mt.units[u].wA); d = await bukaData(mentah, x); } catch (e) { throw new Error('sandi Admin di komputer asal berbeda dengan sandi Admin Anda'); }
            await unitBaru.terima(u, mt.units[u].s, mt.units[u].wU, mentah);
            d.tgl = o.tgl; d.ts = o.ts || 0; d.impT = Date.now();
            (terbaik[u] = terbaik[u] || []).push({ d, fn: f.name, u });
            n++;
          }
          if (!n) throw new Error('backup ini tidak berisi data unit ' + UNIT.join('/') + ' (unduh Backup Database dari komputer unit)');
          if (Array.isArray(o.kv.coa)) {
            const coa = KDMP.core.coa;
            const baru = o.kv.coa.filter((a) => Array.isArray(a) && coa.POLA_KODE.test(a[0]) && a[1] && (a[2] == 'Debit' || a[2] == 'Kredit') && !coa.saldoNormal[a[0]]);
            if (baru.length) {
              baru.forEach((a) => coa.tambah(a[0], a[1], a[2]));
              KDMP.storage.coaDb.simpan();
              L.push({ ok: 1, n: f.name, m: baru.length + ' akun tambahan dari COA unit ditambahkan ke Master COA: ' + esc(baru.map((a) => a[0]).join(', ')) });
            }
          }
          continue;
        }
        if (o && o.app == 'kdmp2' && o.unit) unitBaru.kenali(o.def, o.unit); // unit tambahan yang belum dikenal di komputer ini
        if (!o || o.app != 'kdmp2' || !UNIT.includes(o.unit) || !o.data) throw new Error('bukan paket unit (.kdmp.json) atau Backup Database KDMP yang valid');
        let d;
        let mentah;
        try { mentah = await kripto.dekripsi(await kripto.turunkanKunci(app.kunci.PIN, kripto.dariBase64(o.saltA)), o.wA); d = await bukaData(mentah, o.data); } catch (e) { throw new Error('sandi Admin di komputer asal berbeda dengan sandi Admin Anda'); }
        await unitBaru.terima(o.unit, o.s, o.wU, mentah);
        d.tgl = o.tgl; d.ts = o.ts || 0; d.impT = Date.now();
        (terbaik[o.unit] = terbaik[o.unit] || []).push({ d, fn: f.name, u: o.unit });
      } catch (e) { L.push({ ok: 0, n: f.name, m: e.message || 'gagal dibuka' }); }
    }
    unitBaru.rapikan(); // buang unit impor yang gagal dibuka
    for (const u in terbaik) {
      const a = terbaik[u].sort((x, y) => (y.d.ts || 0) - (x.d.ts || 0));
      const w = a[0];
      a.slice(1).forEach((x) => L.push({ ok: 0, n: x.fn, m: 'dilewati — ada file ' + u + ' yang lebih baru' }));
      d0.imp[u] = w.d;
      d0.units[u] = w.d;
      const th = +w.d.tahun != +d0.tahun ? ' <b class=no>(tahun data ' + w.d.tahun + ', periode konsolidasi ' + d0.tahun + ')</b>' : '';
      L.push({ ok: 1, n: w.fn, m: 'unit <b>' + u + '</b> diimpor — ' + (w.d.rows || []).length + ' baris jurnal, diekspor ' + esc(w.d.tgl || '-') + th });
    }
    if (L.some((x) => x.ok)) KDMP.app.simpan.jadwalkan();
    hasilImpor = '<div style="background:#fff;padding:10px 14px;margin:10px 0;border-left:4px solid #1F3864"><b>Hasil impor</b>' +
      L.map((x) => `<div class="${x.ok ? 'ok' : 'no'}">${x.ok ? '✔' : '✖'} ${esc(x.n)} — ${x.ok ? x.m : esc(x.m)}</div>`).join('') +
      (L.some((x) => x.ok) ? '<div style="margin-top:8px"><button class=p ' + klik('nav.tab', { tab: 'Neraca Konsolidasi' }) + '>Lihat Neraca Konsolidasi</button></div>' : '') + '</div>';
    KDMP.app.navigasi.pergi('Data Unit');
  }

  /** Mengambil (sekali) ringkasan hasil impor terakhir untuk ditampilkan. */
  function ambilHasilImpor() { const h = hasilImpor; hasilImpor = ''; return h; }

  KDMP.ui.aksi.daftar({
    'paket.ekspor': () => ekspor(),
    'paket.impor': (el) => imporPaket(el.files[0]),
    'paket.imporKonsol': (el, e) => {
      imporKonsol(e.type == 'drop' ? e.dataTransfer.files : el.files);
      if (e.type != 'drop') el.value = '';
    }
  });
  KDMP.app.paket = { ekspor, infoEkspor, imporPaket, imporKonsol, ambilHasilImpor };
})(globalThis.KDMP);

</script>
<script>
/*
 * Menambah unit usaha baru (selain USP & Sembako) tanpa mengubah kode.
 *
 * Penyimpanan (IndexedDB):
 *   units_custom  daftar definisi unit tambahan [{kode, nama, warna, templat, persediaan}] (tidak rahasia)
 *   meta.units    kunci data unit baru (dibungkus sandi unit & kunci Admin) - sama seperti unit bawaan
 * Keduanya ditulis dalam SATU transaksi agar tidak ada unit setengah jadi.
 *
 * Dua jalan masuk:
 *  1. Layar login: "Tambah unit usaha baru" - butuh sandi Admin (berlaku di komputer unit maupun bendahara).
 *  2. Tab Data Unit saat login sebagai Konsolidasi (Admin) - memakai kunci Admin sesi.
 * Unit dari komputer lain yang belum dikenal diterima otomatis saat paket/backupnya diimpor ke Konsolidasi
 * (lihat terima() dan app/paket-unit.js).
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const { klik } = KDMP.ui.aksi;
  const { esc } = KDMP.core.format;
  const kv = KDMP.storage.kv;
  const kripto = KDMP.security.kripto;
  const kunci = KDMP.security.kunci;
  const U = KDMP.core.unit;
  const app = KDMP.app.state;
  const KUNCI_DB = 'units_custom';

  const salin = (x) => JSON.parse(JSON.stringify(x));

  /** Judul konsolidasi memuat daftar unit; selaraskan judul sesi yang sedang berjalan (header, tab browser, kop laporan). */
  function segarkanJudul() {
    if (!app.konsol || !app.konfig) return;
    app.konfig.name = KDMP.config.konsolidasi.name;
    $('#ttl').textContent = app.konfig.name;
    document.title = app.konfig.name;
  }

  /** Dipanggil saat aplikasi mulai (sebelum layar login): mendaftarkan semua unit tambahan yang tersimpan. */
  async function muat() {
    const a = await kv.get(KUNCI_DB);
    (Array.isArray(a) ? a : []).forEach((d) => {
      try { U.daftarkan(d); } catch (e) { console.warn('Unit tambahan dilewati:', d && d.kode, e.message); }
    });
  }

  /** Formulir tambah unit. `denganSandiAdmin` = true di layar login (belum ada kunci Admin di memori). */
  function formHtml(denganSandiAdmin) {
    const templat = Object.keys(U.TEMPLAT).map((k) => `<option value="${k}">${esc(U.TEMPLAT[k])}</option>`).join('');
    return `<div class=nu style="text-align:left">
<label>Kode unit (huruf/angka, tanpa spasi — mis. Klinik)<br><input id=nu_kode maxlength=16 autocomplete=off style=width:100%></label><br>
<label>Nama unit<br><input id=nu_nama maxlength=60 autocomplete=off style=width:100%></label><br>
<label>Susunan laporan<br><select id=nu_templat style=width:100%>${templat}</select></label><br>
<label>Warna <input id=nu_warna type=color value="#1F3864"></label> &nbsp; <label><input id=nu_persediaan type=checkbox> Pakai tab BP Persediaan</label><br>
<label>Sandi unit baru (min. 6 karakter)<br><input id=nu_sandi type=password style=width:100%></label><br>
${denganSandiAdmin ? '<label>Sandi Admin (yang sama dengan saat pengaturan awal)<br><input id=nu_admin type=password style=width:100%></label><br>' : ''}<br>
<button class=p ${klik('unit.tambah')}>Tambah unit</button>
<p id=nu_err class=no></p></div>`;
  }

  /** Layar "Tambah unit" di atas halaman login. */
  function tampilkanForm() {
    KDMP.app.sesi.kotak('<p><b>Tambah unit usaha baru</b></p>' + formHtml(true) + '<p class=c><a href=# ' + klik('unit.kembali') + '>Kembali ke login</a></p>');
  }

  async function tambah() {
    const err = (m) => { $('#nu_err').textContent = m; };
    const def = {
      kode: $('#nu_kode').value, nama: $('#nu_nama').value, warna: $('#nu_warna').value,
      templat: $('#nu_templat').value, persediaan: $('#nu_persediaan').checked
    };
    const galat = U.validasi(def);
    if (galat) return err(galat);
    const sandi = $('#nu_sandi').value;
    if (sandi.length < 6) return err('Sandi unit minimal 6 karakter.');
    const sesiAdmin = !!(app.konsol && app.kunci.DK);
    try {
      let kunciAdmin;
      if (sesiAdmin) kunciAdmin = app.kunci.DK;
      else {
        try { kunciAdmin = await kunci.kunciAdmin(app.kunci.META, $('#nu_admin').value); } catch (e) { return err('Sandi Admin salah.'); }
      }
      const d = U.normal(def);
      const meta = salin(app.kunci.META);
      const mentah = await kunci.tambahUnit(meta, d.kode, kunciAdmin, sandi);
      await kv.setAll({ meta, [KUNCI_DB]: U.daftarKustom().concat([d]) });
      app.kunci.META = meta;
      U.daftarkan(d);
      if (sesiAdmin) {
        app.kunci.RAW[d.kode] = mentah;
        app.data.units[d.kode] = { rows: [], tgl: 'belum ada data' };
        segarkanJudul();
        KDMP.ui.pesan.toast('Unit ' + d.kode + ' ditambahkan');
        KDMP.app.navigasi.pergi('Data Unit');
      } else {
        KDMP.app.sesi.tampilkanLogin();
        $('#lu').value = d.kode;
        $('#er').className = 'ok';
        $('#er').textContent = 'Unit ' + d.kode + ' ditambahkan. Masuk dengan sandi unit tersebut.';
      }
    } catch (e) { err('Gagal menambah unit: ' + ((e && e.message) || e)); }
  }

  /**
   * Konsolidasi menerima unit dari komputer lain (paket / backup) yang belum punya kunci di meta komputer ini:
   * menyimpan definisi unit dan kunci datanya (dibungkus ulang dengan kunci Admin sesi ini).
   * `mentah` = kunci data unit yang sudah berhasil dibuka dengan sandi Admin dari berkas.
   */
  async function terima(kode, s, wU, mentah) {
    if (!app.konsol || !app.kunci.DK || app.kunci.META.units[kode] || !KDMP.config.unit[kode] || !KDMP.config.unit[kode].kustom) return;
    const meta = salin(app.kunci.META);
    meta.units[kode] = { s, wU, wA: await kripto.enkripsi(app.kunci.DK, mentah) };
    await kv.setAll({ meta, [KUNCI_DB]: U.daftarKustom() });
    app.kunci.META = meta;
    app.kunci.RAW[kode] = mentah;
  }

  /** Mendaftarkan (dalam memori) definisi unit dari berkas impor bila belum dikenal. @returns {boolean} berhasil/ sudah ada */
  function kenali(def, kode) {
    if (KDMP.config.unit[kode]) return true;
    if (!def || def.kode !== kode) return false;
    try { U.daftarkan(def); return true; } catch (e) { return false; }
  }

  /** Membatalkan pendaftaran unit impor yang akhirnya tidak berhasil dibuka (tidak punya kunci di meta). */
  function rapikan() {
    U.daftarKustom().filter((d) => !app.kunci.META.units[d.kode]).forEach((d) => U.batalDaftar(d.kode));
    segarkanJudul(); // unit baru dari impor ikut tampil di judul
  }

  KDMP.ui.aksi.daftar({
    'unit.formLogin': () => tampilkanForm(),
    'unit.kembali': () => KDMP.app.sesi.tampilkanLogin(),
    'unit.tambah': () => tambah()
  });
  KDMP.app.unitBaru = { muat, formHtml, tampilkanForm, terima, kenali, rapikan };
})(globalThis.KDMP);

</script>
<script>
/*
 * Panel "Database aplikasi" di bawah tab Data / Data Unit: simpan manual, titik pulih, dan pintasan COA.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const { esc } = KDMP.core.format;
  const { klik, ubah, arg } = KDMP.ui.aksi;
  const kv = KDMP.storage.kv;
  const tp = KDMP.storage.titikPulih;
  const app = KDMP.app.state;

  async function gambarDaftar() {
    const el = $('#snl');
    if (!el) return;
    const ks = await tp.daftar(app.unit);
    el.innerHTML = ks.length
      ? '<table style=width:auto><tr><th>Waktu</th><th>Keterangan</th><th></th></tr>' + ks.map((s) => `<tr><td>${new Date(s.t).toLocaleString('id-ID')}</td><td>${esc(s.l)}</td><td><button ${klik('titikPulih.pulihkan', { k: s.kunci })}>Pulihkan</button> <button ${klik('titikPulih.hapus', { k: s.kunci })}>Hapus</button></td></tr>`).join('') + '</table>'
      : '<p class=c>Belum ada titik pulih.</p>';
  }

  /** HTML panel; daftar titik pulih diisi setelah panel masuk ke halaman. */
  function html() {
    setTimeout(gambarDaftar, 0);
    const kb = Math.round(JSON.stringify(Object.assign({}, app.data, { units: 0 })).length / 1024);
    const terakhir = KDMP.app.simpan.waktuTerakhir();
    return `<h4>Database aplikasi</h4><div class=bar><button class=p ${klik('simpan.manual')}>Simpan sekarang</button><button ${klik('titikPulih.buat')}>Buat titik pulih</button><span class=c>Terakhir tersimpan: ${terakhir || 'belum ada perubahan pada sesi ini'} · ukuran data ±${kb} KB · setiap perubahan otomatis tersimpan; Ctrl+S untuk simpan manual</span></div><div id=snl></div>` +
      (app.konsol ? '' : `<h4>Master akun (COA)</h4><div class=bar><button ${klik('coa.ekspor')}>Ekspor COA</button><label class=btn>Impor COA dari Admin<input type=file accept=.json style=display:none ${ubah('coa.impor')}></label><span class=c>${KDMP.core.coa.daftar.length} akun dipakai unit ini. Perubahan COA dilakukan Admin di tab Master COA.</span></div>`);
  }

  async function buatManual() {
    const l = prompt('Nama titik pulih (opsional):', '');
    if (l === null) return;
    await KDMP.app.simpan.saatIni();
    const v = await kv.get(app.kunci.KEY);
    await tp.buat(app.unit, l || 'Manual', v);
    KDMP.ui.pesan.toast('Titik pulih dibuat');
    gambarDaftar();
  }

  async function pulihkan(kunci) {
    if (!confirm('Data saat ini akan DIGANTI dengan titik pulih ini. Lanjut?')) return;
    const v = await tp.ambil(kunci);
    try {
      const d = await KDMP.security.kripto.dekripsiJson(app.kunci.DK, v.d);
      const units = app.data.units;
      app.data = d;
      if (units) app.data.units = units;
      app.data.sub = app.data.sub || {};
      $('#bln').value = app.data.bulan;
      $('#thn').value = app.data.tahun;
      await KDMP.app.simpan.saatIni();
      KDMP.ui.pesan.toast('Data dipulihkan');
      KDMP.app.navigasi.pergi(app.tabs[0]);
    } catch (e) { alert('Titik pulih tidak dapat dibuka dengan sandi saat ini.'); }
  }

  KDMP.ui.aksi.daftar({
    'titikPulih.buat': () => buatManual(),
    'titikPulih.hapus': async (el) => { if (confirm('Hapus titik pulih ini?')) { await tp.hapus(arg(el, 'k')); gambarDaftar(); } },
    'titikPulih.pulihkan': (el) => pulihkan(arg(el, 'k'))
  });
  KDMP.app.panelDb = { html };
})(globalThis.KDMP);

</script>
<script>
/*
 * Siklus sesi: pengaturan awal (setup), login, memulai sesi, keluar/reset. Logika kunci ada di KDMP.security.kunci;
 * berkas ini menangani tampilan layar login dan menyiapkan state setelah sandi benar.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const { klik, ubah, kirim } = KDMP.ui.aksi;
  const { esc } = KDMP.core.format;
  const kv = KDMP.storage.kv;
  const kripto = KDMP.security.kripto;
  const apl = KDMP.config.aplikasi;
  const app = KDMP.app.state;
  const UNIT = apl.unit;
  let idle;

  /** Menampilkan kotak di tengah layar (login/setup) di atas aplikasi. */
  function kotak(isi) {
    $('#ov').style.display = 'block';
    $('#ov').innerHTML = '<div class=lg><img src="' + apl.logo + '" alt=""><h2>' + apl.judulLogin + '</h2><div class=sub>' + apl.subJudulLogin + '</div>' + isi + '<p id=er class=no></p><div class=c>' + apl.versi + '</div></div>';
  }

  const TAUTAN_PULIH = '<p class=c>Pernah memakai aplikasi ini? <label style="color:#1F3864;text-decoration:underline;cursor:pointer">Pulihkan dari file cadangan lengkap<input type=file accept=.json style=display:none ' + ubah('backup.pulihkan') + '></label> (sandi lama tetap berlaku). <a href=# ' + klik('backup.unduh') + ' style="color:#1F3864">Unduh backup database</a></p>';

  function tampilkanSetup() {
    kotak('<p>Pengaturan awal (sekali). Sandi minimal 6 karakter. <b>Sandi Admin</b> membuka Konsolidasi; sandi tiap unit hanya membuka unitnya. Sandi yang hilang tidak bisa dipulihkan.</p><p class=no><b>Penting:</b> isi <b>sandi Admin yang SAMA</b> di semua komputer (USP, Sembako, dan bendahara) agar paket data unit bisa diimpor ke Konsolidasi.</p>' +
      ['Admin', ...UNIT].map((u) => `<label>Sandi ${u}<br><input id=p_${u} type=password style=width:100%></label><br>`).join('') + '<br><button class=p ' + klik('sesi.setup') + '>Buat</button>' + TAUTAN_PULIH);
  }

  async function lakukanSetup() {
    const sandi = {};
    for (const u of ['Admin', ...UNIT]) {
      sandi[u] = $('#p_' + u).value;
      if (sandi[u].length < 6) return ($('#er').textContent = 'Sandi ' + u + ' minimal 6 karakter');
    }
    const meta = await KDMP.security.kunci.buatMeta(sandi);
    try {
      await kv.set('meta', meta);
      app.kunci.META = meta;
      tampilkanLogin();
    } catch (e) { $('#er').textContent = 'Gagal: ' + ((e && e.message) || e) + ' (pengaturan awal mungkin sudah dibuat dari perangkat lain — muat ulang halaman).'; }
  }

  function tampilkanLogin() {
    kotak('<form ' + kirim('sesi.login') + '><label>Masuk sebagai<br><select id=lu style=width:100%>' +
      [...UNIT, 'KONSOL'].map((u) => `<option value=${u}>${u == 'KONSOL' ? 'Konsolidasi (Admin)' : esc(KDMP.config.unit[u].name)}</option>`).join('') +
      '</select></label><br><label>Sandi<br><input id=lp type=password style=width:100%></label><br><br><label><input type=checkbox ' + ubah('sesi.tampilSandi') + '> Tampilkan sandi</label><br><br><button class=p type=submit>Masuk</button></form><p class=c><a href=# ' + klik('sesi.resetSemua') + '>Lupa sandi? Hapus semua data &amp; atur ulang</a></p><p class=c><a href=# ' + klik('unit.formLogin') + ' style="color:#1F3864">+ Tambah unit usaha baru</a></p>' + TAUTAN_PULIH);
    $('#lp').focus();
  }

  async function resetSemua() {
    if (prompt('Semua data di database aplikasi ini akan DIHAPUS permanen (unduh backup dulu bila perlu). Ketik HAPUS untuk melanjutkan:') == 'HAPUS') {
      await kv.clear();
      location.reload();
    }
  }

  async function login() {
    const u = $('#lu').value;
    const p = $('#lp').value;
    try {
      const { DK, RAW } = await KDMP.security.kunci.bukaSesi(app.kunci.META, u, p);
      app.kunci.DK = DK;
      app.kunci.RAW = RAW;
    } catch (e) { return ($('#er').textContent = 'Sandi salah.'); }
    app.kunci.PIN = p;
    await mulai(u);
  }

  /** Menyiapkan state untuk sesi `u` lalu menampilkan tab pertama. */
  async function mulai(u) {
    await KDMP.storage.coaDb.muat();
    KDMP.app.simpan.reset();
    app.unit = u;
    app.konsol = u == 'KONSOL';
    app.kunci.KEY = 'd_' + u;
    const c = app.konsol ? KDMP.config.konsolidasi : KDMP.config.unit[u];
    app.konfig = { name: c.name, color: c.color, LPK: c.LPK, LR: c.LR };

    const muat = async (k, kunci) => {
      const v = await kv.get(k);
      if (!v) return null;
      try { return await kripto.dekripsiJson(kunci, v); } catch (e) { return null; }
    };
    app.data = (await muat(app.kunci.KEY, app.kunci.DK)) || { bulan: new Date().getMonth() + 1, tahun: new Date().getFullYear(), kop: apl.singkatan, rows: [], cv: 3 };
    (app.data.rows || []).forEach((r) => { if (r.kom == 'Pembayaran Utang Jangka Panjang') r.kom = 'Pembayaran Pinjaman Jangka Panjang'; });
    app.data.sub = app.data.sub || {};
    if (app.konsol) {
      app.data.imp = app.data.imp || {};
      app.data.units = {};
      for (const k of UNIT) {
        if (!app.kunci.RAW[k]) continue; // unit belum punya kunci di komputer ini
        const d = await muat('d_' + k, await kripto.kunciDariMentah(app.kunci.RAW[k]));
        app.data.units[k] = app.data.imp[k] || { rows: d ? d.rows : [], tgl: d ? 'lokal (browser ini)' : 'belum ada data' };
      }
    }
    app.tabs = KDMP.app.navigasi.daftarTab(u);
    app.tab = null;
    app.sv = {}; app.sel = {}; app.keep.clear();

    $('#ov').style.display = 'none';
    $('#ttl').textContent = c.name;
    document.title = c.name;
    $('#lg').src = KDMP.ui.kop.logo();
    $('#bln').innerHTML = apl.namaBulan.map((m, i) => `<option value=${i + 1}>${m}</option>`).join('');
    $('#bln').value = app.data.bulan;
    $('#thn').value = app.data.tahun;
    $('#bln').onchange = (e) => { app.data.bulan = +e.target.value; app.keep.clear(); KDMP.app.simpan.jadwalkan(); KDMP.app.navigasi.pergi(); };
    $('#thn').onchange = (e) => { app.data.tahun = +e.target.value; app.keep.clear(); KDMP.app.simpan.jadwalkan(); KDMP.app.navigasi.pergi(); };
    KDMP.ui.daftarAkun.perbarui();
    // keluar otomatis setelah 10 menit tanpa aktivitas
    const setUlang = () => { clearTimeout(idle); idle = setTimeout(() => location.reload(), 600000); };
    ['click', 'keydown'].forEach((e) => addEventListener(e, setUlang));
    setUlang();
    KDMP.app.navigasi.pergi(app.tabs[0]);
    KDMP.app.sinkron.mulai();
  }

  KDMP.ui.aksi.daftar({
    'sesi.setup': () => lakukanSetup(),
    'sesi.login': () => login(),
    'sesi.tampilSandi': (el) => { $('#lp').type = el.checked ? 'text' : 'password'; },
    'sesi.resetSemua': () => resetSemua(),
    'sesi.keluar': () => location.reload()
  });

  KDMP.app.sesi = { kotak, tampilkanSetup, tampilkanLogin, login, mulai };
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab Jurnal: entri jurnal umum per periode. Baris jurnal: {d: tanggal ISO, no, ak: "kode nama", db, kr, ket, kom}.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const { esc, rupiah, angkaInput, bacaAngka, periodeDari, hariIni, kodeAkun, NAMA_BULAN } = KDMP.core.format;
  const { klik, ubah, input, arg } = KDMP.ui.aksi;
  const { kolomTanggal } = KDMP.ui.tanggalAngka;
  const app = KDMP.app.state;
  const simpan = () => KDMP.app.simpan.jadwalkan();

  /** Menampilkan total debit/kredit periode di bawah tabel. */
  function totalPeriode() {
    const P = KDMP.app.periode();
    let a = 0, b = 0;
    app.data.rows.forEach((r) => { if (!r.d || periodeDari(r.d) == P) { a += +r.db || 0; b += +r.kr || 0; } });
    const x = $('#jtd'), y = $('#jtk');
    if (x) x.textContent = rupiah(a);
    if (y) y.textContent = rupiah(b);
  }

  function tambahBaris(n) {
    for (let i = 0; i < n; i++) app.keep.add(app.data.rows[app.data.rows.push({ d: hariIni() }) - 1]);
    simpan();
    KDMP.app.navigasi.pergi();
  }

  function hapusBaris(i) {
    const r = app.data.rows[i];
    if (!r) return;
    const u = (r.ak || '(akun kosong)') + ' | Debit ' + rupiah(+r.db || 0) + ' | Kredit ' + rupiah(+r.kr || 0);
    if (!confirm('Hapus baris jurnal ini?\n\n' + u + '\n\n(Konfirmasi 1 dari 2)')) return;
    if (!confirm('Yakin ingin menghapus? Baris yang dihapus tidak dapat dikembalikan.\n\n(Konfirmasi 2 dari 2)')) return;
    app.data.rows.splice(i, 1);
    simpan();
    KDMP.app.navigasi.pergi();
  }

  function render() {
    const d = app.data;
    const P = KDMP.app.periode();
    const Y = +d.tahun;
    const NM = KDMP.core.coa.saldoNormal;
    const tampil = [];
    d.rows.forEach((r, i) => { if (!r.d || periodeDari(r.d) == P || app.keep.has(r)) tampil.push(i); });
    const otomatis = KDMP.core.arusKas.komponenOtomatis(d.rows, Y, P, (k) => !!NM[k]);

    let h = `<div class=bar><button ${klik('jurnal.tambah', { n: 1 })}>+ Baris</button><button ${klik('jurnal.tambah', { n: 10 })}>+10 Baris</button><span class=c><b>Periode ${NAMA_BULAN[KDMP.app.bulan() - 1]} ${d.tahun}</b> (${tampil.length} baris). Ganti bulan/tahun di kanan atas untuk membuat atau melihat jurnal periode lain; data periode sebelumnya tetap tersimpan. Ketik sebagian nama/kode akun untuk mencari. Saldo awal: isi Keterangan <b>Saldo Awal</b> (sekali saja, pada periode pertama). Komponen arus kas pada baris kas/bank terisi otomatis dari akun lawan (No Bukti sama); pilih manual bila ingin mengubahnya.</span></div><table><tr><th>#</th><th>Tanggal</th><th>No Bukti</th><th>Akun</th><th>Debit</th><th>Kredit</th><th>Keterangan</th><th>Komponen Arus Kas</th><th></th></tr>`;
    tampil.forEach(function (i, n) {
      const r = d.rows[i];
      const salah = r.ak && !NM[kodeAkun(r.ak)];
      const m = otomatis.get(r);
      const al = m ? Object.keys(m).join(' + ') : '';
      const teks = (k) => `<td><input class="i" ${k == 'ak' ? 'list=dl' : ''} value="${esc(r[k])}" ${ubah('jurnal.isi', { i, k })}></td>`;
      const angka = (k) => `<td class=n><input class="i n" data-f=1 inputmode=numeric value="${angkaInput(r[k])}" ${input('angka.ketik')} ${ubah('jurnal.angka', { i, k })}></td>`;
      h += `<tr class="${salah ? 'bad' : ''}"><td class=c>${n + 1}</td><td>${kolomTanggal(r.d, 'rows:' + i + ':d', 1)}</td>${teks('no')}${teks('ak')}${angka('db')}${angka('kr')}${teks('ket')}<td><select ${ubah('jurnal.komponen', { i })}><option value="">${al ? '(otomatis) ' + esc(al) : ''}</option>${KDMP.config.komponenArusKas.map((x) => `<option ${r.kom == x ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><button ${klik('jurnal.hapus', { i })}>×</button></td></tr>`;
    });
    KDMP.ui.dom.isi(h + `</table><p>Total Debit <b id=jtd></b> | Total Kredit <b id=jtk></b> <span class=c>(periode ini)</span></p>`);
    totalPeriode();
  }

</script>
<script>
/*
 * Tab Buku Besar: mutasi satu akun pada periode terpilih, dengan saldo berjalan.
 * Akun laba rugi (4-9) hanya menghitung tahun berjalan.
 */
(function (KDMP) {
  'use strict';
  const { esc, rupiah, tanggalId, periodeDari, NAMA_BULAN } = KDMP.core.format;
  const { ubah } = KDMP.ui.aksi;
  const app = KDMP.app.state;

  function render() {
    const d = app.data;
    const bb = app.akunBB;
    const Y = +d.tahun;
    const P = Y * 12 + KDMP.app.bulan();
    const labaRugi = '45678'.includes(bb[0]) || bb[0] == '9';
    const tanda = KDMP.core.coa.saldoNormal[bb] == 'Debit' ? 1 : -1;
    const baris = [];
    let s = 0, s0 = 0;
    d.rows.filter((r) => (r.ak || '').startsWith(bb + ' ') && r.d).sort((a, b) => (a.d < b.d ? -1 : 1)).forEach(function (r) {
      const q = periodeDari(r.d);
      const y = +r.d.slice(0, 4);
      if (q > P || (labaRugi && y != Y)) return;
      s += tanda * ((+r.db || 0) - (+r.kr || 0));
      if (q < P) { s0 = s; return; }
      baris.push(`<tr><td>${tanggalId(r.d)}</td><td>${esc(r.no)}</td><td>${esc(r.ket)}</td><td class=n>${rupiah(+r.db || 0)}</td><td class=n>${rupiah(+r.kr || 0)}</td><td class=n>${rupiah(s)}</td></tr>`);
    });
    KDMP.ui.dom.isi(`<div class=bar>Akun: <input list=dl id=bbs style=width:380px value="${bb} ${KDMP.core.coa.nama(bb)}" ${ubah('bukuBesar.pilihAkun')}><span class=c>Periode ${NAMA_BULAN[KDMP.app.bulan() - 1]} ${d.tahun}</span></div><table><tr><th>Tanggal</th><th>No Bukti</th><th>Keterangan</th><th>Debit</th><th>Kredit</th><th>Saldo</th></tr><tr class=t><td></td><td></td><td>Saldo awal periode</td><td></td><td></td><td class=n>${rupiah(s0)}</td></tr>${baris.join('')}</table>`);
  }

  KDMP.ui.aksi.daftar({
    'bukuBesar.pilihAkun': (el) => { app.akunBB = el.value.split(' ')[0]; KDMP.app.navigasi.pergi(); }
  });
  KDMP.app.tab['Buku Besar'] = { render };
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab laporan satu unit: Neraca Saldo, Laba Rugi, Neraca (Laporan Posisi Keuangan), Arus Kas.
 * Semua angka dihitung oleh KDMP.core.*; berkas ini hanya merangkai tampilan.
 */
(function (KDMP) {
  'use strict';
  const { rupiah } = KDMP.core.format;
  const { hitungSaldo, labaRugiAkun, shuTahunSebelumnya } = KDMP.core.saldo;
  const { susunLaporan, perluasSpesifikasi } = KDMP.core.laporan;
  const { kop } = KDMP.ui.kop;
  const { tabelLaporan } = KDMP.ui.tabelLaporan;
  const { NAMA_BULAN } = KDMP.core.format;
  const app = KDMP.app.state;

  /** Saldo periode ini + nilai-nilai Laba Rugi (mis. shu_final) yang dibutuhkan baris tipe "L" di Neraca. */
  function dataUnit() {
    const o = hitungSaldo(app.data.rows, app.data.tahun, KDMP.app.bulan());
    const laba = susunLaporan(app.konfig.LR, labaRugiAkun(o.cumA));
    return { o, nilaiL: laba.key };
  }

  const namaAkun = (c) => KDMP.core.coa.nama(c);

  function renderNeracaSaldo() {
    const o = hitungSaldo(app.data.rows, app.data.tahun, KDMP.app.bulan());
    let h = kop('NERACA SALDO') + '<table><tr><th>Akun</th><th>Debit</th><th>Kredit</th><th>Saldo Akhir</th></tr>';
    let a = 0, b = 0;
    KDMP.core.coa.daftar.forEach(([c, n, s]) => {
      if (o.cum[c] === undefined) return;
      a += o.dr[c];
      b += o.kr[c];
      h += `<tr><td>${c} ${n}</td><td class=n>${rupiah(o.dr[c])}</td><td class=n>${rupiah(o.kr[c])}</td><td class=n>${rupiah(o.cum[c])} <span class=c>${s[0]}</span></td></tr>`;
    });
    const pr = shuTahunSebelumnya(o);
    if (Math.abs(pr) >= 0.5) {
      h += `<tr><td>SHU tahun-tahun sebelumnya (otomatis)</td><td class=n>${pr < 0 ? rupiah(-pr) : '-'}</td><td class=n>${pr > 0 ? rupiah(pr) : '-'}</td><td class=n>${rupiah(Math.abs(pr))} <span class=c>${pr > 0 ? 'K' : 'D'}</span></td></tr>`;
      if (pr > 0) b += pr; else a -= pr;
    }
    KDMP.ui.dom.isi(h + `<tr class=g><td>JUMLAH</td><td class=n>${rupiah(a)}</td><td class=n>${rupiah(b)}</td><td></td></tr></table>`);
  }

  function renderLabaRugi() {
    const { o } = dataUnit();
    const m1 = labaRugiAkun(o.mon);
    const m2 = labaRugiAkun(o.cum);
    const spek = perluasSpesifikasi(app.konfig.LR, [m1, m2], namaAkun);
    const a = susunLaporan(spek, m1);
    const b = susunLaporan(spek, m2);
    KDMP.ui.dom.isi(kop('LAPORAN LABA RUGI') + tabelLaporan(a.rows, [a.rows.map((r) => r.v), b.rows.map((r) => r.v)], [NAMA_BULAN[KDMP.app.bulan() - 1], 's.d. bulan ini']));
  }

  function renderNeraca() {
    const { o, nilaiL } = dataUnit();
    const a = susunLaporan(perluasSpesifikasi(app.konfig.LPK, [o.M], namaAkun), o.M, nilaiL);
    const ok = Math.round(a.key.tot_aset - a.key.tot_ke) == 0;
    KDMP.ui.dom.isi(kop('LAPORAN POSISI KEUANGAN (NERACA)') + `<p class="${ok ? 'ok' : 'no'}">${ok ? 'Balance' : 'Tidak balance, selisih ' + rupiah(a.key.tot_aset - a.key.tot_ke)}</p>` + tabelLaporan(a.rows, [a.rows.map((r) => r.v)], ['Jumlah']));
  }

  function renderArusKas() {
    const { o } = dataUnit();
    const r = KDMP.core.arusKas.susunArusKas(o, KDMP.config.arusKas);
    const kas = Object.keys(o.M).filter((c) => c.startsWith('1.1.1.')).reduce((s, c) => s + o.M[c], 0);
    const selisih = r[r.length - 1].x - kas;
    let h = kop('LAPORAN ARUS KAS') + '<table><tr><th>Uraian</th><th>Jumlah</th></tr>';
    r.forEach((a) => {
      if (a.tp == 'e') return;
      h += `<tr class="${a.tp == 'h' ? 'h' + a.lv : a.lv == 1 ? 'g' : a.lv == 0 ? 't' : ''}"><td style="padding-left:${a.lv == 3 ? 24 : 6}px">${a.l}</td><td class=n>${a.tp == 'h' ? '' : rupiah(a.x)}</td></tr>`;
    });
    const cocok = Math.round(selisih) == 0;
    KDMP.ui.dom.isi(h + `</table><p class="${cocok ? 'ok' : 'no'}">${cocok ? 'Sesuai dengan Kas di Neraca' : 'Selisih terhadap Kas di Neraca ' + rupiah(selisih) + ' — ada mutasi kas tanpa Komponen Arus Kas'}</p>`);
  }

  KDMP.app.tab['Neraca Saldo'] = { render: renderNeracaSaldo };
  KDMP.app.tab['Laba Rugi'] = { render: renderLabaRugi };
  KDMP.app.tab['Neraca'] = { render: renderNeraca };
  KDMP.app.tab['Arus Kas'] = { render: renderArusKas };
  KDMP.fitur.dataUnit = dataUnit;
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab Neraca Konsolidasi, Laba Rugi Konsolidasi, dan Data Unit (status & impor data tiap unit).
 * Hitungan ada di KDMP.core.konsolidasi; impor paket/backup ada di KDMP.app.paket.
 */
(function (KDMP) {
  'use strict';
  const { esc, NAMA_BULAN } = KDMP.core.format;
  const { klik, ubah, seret, arg } = KDMP.ui.aksi;
  const { kop, isianIdentitas } = KDMP.ui.kop;
  const { tabelLaporan } = KDMP.ui.tabelLaporan;
  const app = KDMP.app.state;
  const UNIT = KDMP.config.aplikasi.unit;
  const KADALUWARSA = 7 * 864e5; // paket unit dianggap usang setelah 7 hari

  /** Kolom konsolidasi + objek eliminasi manual (state.data['el'+mode]) yang dibuat bila belum ada. */
  function hitungKolom(spek, mode) {
    const ek = 'el' + mode;
    const manual = (app.data[ek] = app.data[ek] || {});
    const k = KDMP.core.konsolidasi.kolomKonsolidasi(spek, mode, {
      unit: app.data.units || {}, tahun: app.data.tahun, bulan: KDMP.app.bulan(), eliminasiManual: manual, namaAkun: KDMP.core.coa.nama
    });
    k.ek = ek;
    return k;
  }

  function renderNeraca() {
    const k = hitungKolom(app.konfig.LPK, 'nb');
    KDMP.ui.dom.isi(kop('NERACA KONSOLIDASI') + tabelLaporan(k.rows, k.cols, [...UNIT, 'Jumlah', 'Eliminasi (isi manual)', 'KONSOLIDASI'], { j: UNIT.length + 1, k: k.ek }) + '<p class=c>Eliminasi RK Piutang Gerai Sembako (USP) vs Utang ke USP (Sembako) dihitung otomatis; kolom Eliminasi bisa ditambah manual (negatif = mengurangi); selisih antar-unit lain, termasuk unit tambahan, diisi manual. Semua akun yang bersaldo di neraca setiap unit ditampilkan per akun dengan nama sesuai Master COA.</p>');
  }

  function renderLabaRugi() {
    const m = KDMP.app.bulan();
    const a = hitungKolom(app.konfig.LR, 'm');
    const b = hitungKolom(app.konfig.LR, 'y');
    const judul = [...UNIT, 'Jumlah', 'Eliminasi', 'KONSOLIDASI'];
    KDMP.ui.dom.isi(kop('LABA RUGI KONSOLIDASI') + '<h4>Bulan ' + NAMA_BULAN[m - 1] + '</h4>' + tabelLaporan(a.rows, a.cols, judul, { j: UNIT.length + 1, k: a.ek }) + '<h4>s.d. bulan ini</h4>' + tabelLaporan(b.rows, b.cols, judul, { j: UNIT.length + 1, k: b.ek }));
  }

  function statusUnit(k, sekarang) {
    const d = app.data;
    const u = d.units[k];
    const im = d.imp && d.imp[k];
    if (!u || (!im && !(u.rows && u.rows.length))) return '<span class=no>belum ada data</span>';
    if (!im) return u.rows.length + ' baris — terbaca langsung dari browser ini <span class=ok>(terbaru)</span>';
    const t = u.ts || u.impT || 0;
    const hari = Math.floor((sekarang - t) / 864e5);
    return u.rows.length + ' baris — paket diekspor ' + (u.tgl || '') + (u.ts ? '' : ' (waktu ekspor tidak tercatat)') +
      (sekarang - t > KADALUWARSA ? ' <b class=no>⚠ sudah ' + hari + ' hari, minta unit ekspor ulang</b>' : ' <span class=ok>(terbaru)</span>') +
      ' <a href=# ' + klik('paket.hapusImpor', { u: k }) + '>[hapus impor]</a>';
  }

  function renderDataUnit() {
    app.data.units = app.data.units || {};
    const sekarang = Date.now();
    const L = UNIT.map((k) => '<tr><td><b>' + esc(k) + '</b><br><small>' + esc(KDMP.config.unit[k].name) + '</small></td><td>' + statusUnit(k, sekarang) + '</td></tr>').join('');
    KDMP.ui.dom.isi(`<div class=bar>${isianIdentitas()}<button ${klik('backup.unduh')}>Unduh Backup Database (.json)</button><label>Pulihkan backup <input type=file accept=.json ${ubah('backup.pulihkan')}></label><button ${klik('sandi.gantiAdmin')}>Ganti sandi Admin</button><button ${klik('sandi.resetUnit')}>Reset sandi unit</button><button ${klik('sesi.keluar')}>Keluar</button></div>
<div id=dz style="border:2px dashed #1F3864;background:#fff;padding:16px;text-align:center;margin:10px 0" ${seret('paket.imporKonsol')}><b>Impor database unit</b><br>Pilih atau tarik file <b>Backup Database (.json)</b> atau paket <code>.kdmp.json</code> dari ${esc(UNIT.join(', '))} sekaligus (boleh sekali pilih beberapa file). Unit tambahan yang belum dikenal di komputer ini ikut dikenali otomatis dari berkasnya. Rumus tetap dihitung ulang otomatis dari jurnal tiap unit.<br><br><input type=file multiple accept=.json ${ubah('paket.imporKonsol')}></div>${KDMP.app.paket.ambilHasilImpor()}
<table style=width:auto><tr><th>Unit</th><th>Status data</th></tr>${L}</table>
<details style="background:#fff;padding:10px 14px;margin:10px 0;border-left:4px solid #1F3864"><summary><b>Tambah unit usaha baru</b></summary><p class=c>Unit baru langsung muncul di layar login, kolom konsolidasi, dan impor. Di komputer unit tersebut, tambahkan unit yang sama (kode sama) lewat tautan <i>+ Tambah unit usaha baru</i> di layar login, lalu ekspor paketnya untuk diimpor di sini.</p>${KDMP.app.unitBaru.formHtml(false)}</details>
<p class=c>Alur: unit login → tab Data → <b>Unduh Backup Database (.json)</b> (atau Ekspor paket) → kirim file → bendahara impor di sini. Tiap unit menghitung Buku Besar, Neraca Saldo, Laba Rugi, Neraca, dan Arus Kas dari jurnalnya sendiri; konsolidasi hanya menjumlahkan hasilnya. Neraca &amp; Laba Rugi Konsolidasi terhitung otomatis. Paket lebih dari 7 hari ditandai peringatan. Paket hanya bisa dibuka bila <b>sandi Admin sama</b> di semua komputer. Data unit yang dipakai di browser/komputer yang sama terbaca otomatis tanpa impor.</p>`);
    KDMP.ui.dom.tambahDiAkhir(KDMP.app.panelDb.html());
  }

  /** Peringatan di atas tab konsolidasi bila data unit belum ada atau paketnya usang. */
  function spanduk() {
    if (!app.konsol || !app.data.units) return '';
    const m = [];
    for (const k of UNIT) {
      const u = app.data.units[k];
      const im = app.data.imp && app.data.imp[k];
      if (!u || (!im && !(u.rows && u.rows.length))) m.push(k + ': belum ada data');
      else if (im) {
        const t = u.ts || u.impT || 0;
        if (Date.now() - t > KADALUWARSA) m.push(k + ': paket sudah ' + Math.floor((Date.now() - t) / 864e5) + ' hari — minta ekspor ulang');
      }
    }
    return m.length ? '<p class=c style="color:#A4161F;font-weight:bold">⚠ Konsolidasi belum lengkap/terbaru — ' + m.join('; ') + '. Buka tab Data Unit.</p>' : '';
  }

  KDMP.ui.aksi.daftar({
    'paket.hapusImpor': (el) => {
      delete app.data.imp[arg(el, 'u')];
      KDMP.app.simpan.jadwalkan();
      setTimeout(() => location.reload(), 600);
    }
  });

  KDMP.app.tab['Neraca Konsolidasi'] = { render: renderNeraca };
  KDMP.app.tab['Laba Rugi Konsolidasi'] = { render: renderLabaRugi };
  KDMP.app.tab['Data Unit'] = { render: renderDataUnit };
  KDMP.fitur.spandukKonsolidasi = spanduk;
  KDMP.fitur.KADALUWARSA = KADALUWARSA;
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab Master COA (hanya Konsolidasi/Admin) serta ekspor/impor COA. Aturan validasi ada di KDMP.core.coa.
 * Akun yang sudah dipakai di jurnal tidak boleh diubah kodenya, saldo normalnya, atau dihapus.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const { esc, kodeAkun } = KDMP.core.format;
  const { klik, ubah, input, arg } = KDMP.ui.aksi;
  const coa = KDMP.core.coa;
  const app = KDMP.app.state;
  const simpanCoa = () => KDMP.storage.coaDb.simpan();
  const gambarUlang = () => KDMP.app.navigasi.pergi();

  /** Jumlah baris jurnal per kode akun (semua unit pada mode Konsolidasi). */
  function akunDipakai() {
    const u = {};
    (app.konsol ? Object.values(app.data.units || {}) : [app.data]).forEach((x) => (x.rows || []).forEach((r) => {
      const c = kodeAkun(r.ak);
      if (c) u[c] = (u[c] || 0) + 1;
    }));
    return u;
  }

  function tambah() {
    const k = $('#nk').value.trim();
    const n = $('#nn').value.trim();
    const m = $('#nm').value;
    const e = coa.galatKode(k, -1);
    if (e) return alert(e);
    if (!n) return alert('Nama akun wajib diisi.');
    if (m != coa.saldoNormalBawaan(k) && !confirm('Saldo normal berbeda dari kebiasaan golongan akun ini. Tetap lanjut?')) return;
    coa.tambah(k, n, m);
    simpanCoa();
    gambarUlang();
    KDMP.ui.pesan.toast('Akun ' + k + ' ditambahkan');
  }

  function ubahBaris(i, jenis, v) {
    const a = coa.daftar[i];
    v = v.trim();
    if (jenis == 'n') {
      if (!v) { alert('Nama akun wajib diisi.'); return gambarUlang(); }
      coa.ubahNama(i, v);
    } else if (jenis == 'k') {
      const e = coa.galatKode(v, i);
      if (e) { alert(e); return gambarUlang(); }
      coa.ubahKode(i, v);
    } else coa.ubahSaldoNormal(i, v);
    simpanCoa();
    if (jenis == 'k') gambarUlang();
  }

  function hapus(i) {
    const a = coa.daftar[i];
    if (!confirm('Hapus akun ' + a[0] + ' ' + a[1] + '?')) return;
    coa.hapus(i);
    simpanCoa();
    gambarUlang();
  }

  function kembalikanBawaan() {
    const u = akunDipakai();
    const bawaan = new Set(coa.bawaan.map((a) => a[0]));
    const bad = Object.keys(u).filter((c) => !bawaan.has(c));
    if (bad.length) return alert('Tidak bisa dikembalikan: akun tambahan berikut masih dipakai di jurnal: ' + bad.join(', '));
    if (!confirm('Kembalikan seluruh akun ke daftar bawaan? Akun tambahan dan perubahan nama akan hilang.')) return;
    coa.kembalikanBawaan();
    KDMP.storage.coaDb.hapus();
    gambarUlang();
  }

  const ekspor = () => KDMP.ui.berkas.simpanJson('KDMP_COA.json', { app: KDMP.config.aplikasi.idTeknis.coa, tgl: new Date().toLocaleString('id-ID'), coa: coa.daftar });

  function impor(berkas) {
    if (!berkas) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (o.app != KDMP.config.aplikasi.idTeknis.coa || !Array.isArray(o.coa)) throw 0;
        const baru = o.coa;
        if (!baru.every(coa.barisImporValid)) throw 0;
        const u = akunDipakai();
        const m = {};
        baru.forEach((a) => (m[a[0]] = a[2]));
        const bad = Object.keys(u).filter((c) => m[c] !== coa.saldoNormal[c]);
        if (bad.length) return alert('COA ditolak: akun yang sudah dipakai di jurnal harus tetap ada dengan saldo normal sama (' + bad.slice(0, 6).join(', ') + ').');
        if (!confirm('Ganti daftar akun dengan ' + baru.length + ' akun dari file ini?')) return;
        coa.ganti(baru);
        simpanCoa();
        gambarUlang();
        KDMP.ui.pesan.toast('COA diimpor');
      } catch (e) { alert('File bukan ekspor COA KDMP yang valid.'); }
    };
    r.readAsText(berkas);
  }

  function render() {
    const u = akunDipakai();
    let h = `<div class=bar><b>Tambah akun:</b><input id=nk placeholder="Kode, mis. 6.1.9.24" style="width:160px" ${input('coa.kodeBaru')}><input id=nn placeholder="Nama akun" style="width:320px"><select id=nm><option>Debit</option><option>Kredit</option></select><button class=p ${klik('coa.tambah')}>Tambah</button></div><div class=bar><input placeholder="Cari kode / nama akun" style="width:260px" ${input('coa.cari')}><button ${klik('coa.ekspor')}>Ekspor COA</button><label class=btn>Impor COA<input type=file accept=.json style=display:none ${ubah('coa.impor')}></label><button ${klik('coa.reset')}>Kembalikan ke bawaan</button><span class=c>${coa.daftar.length} akun · kode dan saldo normal terkunci jika akun sudah dipakai di jurnal unit · setelah mengubah COA, bagikan file ekspornya ke komputer unit (tab Data → Impor COA)</span></div><table id=ct><tr><th>Kode Akun</th><th>Nama Akun</th><th>Saldo Normal</th><th>Dipakai (baris jurnal)</th><th></th></tr>`;
    coa.daftar.forEach((a, i) => {
      const n = u[a[0]] || 0;
      h += `<tr data-t="${esc((a[0] + ' ' + a[1]).toLowerCase())}"><td>${n ? esc(a[0]) : `<input class=i value="${esc(a[0])}" ${ubah('coa.ubah', { i, fl: 'k' })}>`}</td><td><input class=i value="${esc(a[1])}" ${ubah('coa.ubah', { i, fl: 'n' })}></td><td>${n ? a[2] : `<select ${ubah('coa.ubah', { i, fl: 'm' })}><option${a[2] == 'Debit' ? ' selected' : ''}>Debit</option><option${a[2] == 'Kredit' ? ' selected' : ''}>Kredit</option></select>`}</td><td class=n>${n || '-'}</td><td>${n ? '' : `<button ${klik('coa.hapus', { i })}>Hapus</button>`}</td></tr>`;
    });
    KDMP.ui.dom.isi(h + '</table>');
  }

  KDMP.ui.aksi.daftar({
    'coa.kodeBaru': (el) => { if (coa.POLA_KODE.test(el.value)) $('#nm').value = coa.saldoNormalBawaan(el.value); },
    'coa.tambah': () => tambah(),
    'coa.cari': (el) => {
      const q = el.value.toLowerCase();
      document.querySelectorAll('#ct tr[data-t]').forEach((r) => (r.style.display = r.dataset.t.includes(q) ? '' : 'none'));
    },
    'coa.ubah': (el) => ubahBaris(+arg(el, 'i'), arg(el, 'fl'), el.value),
    'coa.hapus': (el) => hapus(+arg(el, 'i')),
    'coa.reset': () => kembalikanBawaan(),
    'coa.ekspor': () => ekspor(),
    'coa.impor': (el) => impor(el.files[0])
  });
  KDMP.app.tab['Master COA'] = { render };
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab Data (unit): identitas koperasi, ekspor paket, backup/pulih, ganti sandi, hapus semua data unit.
 */
(function (KDMP) {
  'use strict';
  const { klik, ubah } = KDMP.ui.aksi;
  const app = KDMP.app.state;

  async function hapusSemua() {
    const p = await KDMP.ui.pesan.mintaSandi('Masukkan <b>sandi login</b> untuk menghapus semua data unit ini:');
    if (p === null) return;
    if (p !== app.kunci.PIN) return alert('Sandi salah. Data tidak dihapus.');
    if (!confirm('Hapus semua data unit ini? Tindakan ini tidak bisa dibatalkan.')) return;
    app.data.rows = [];
    app.keep.clear();
    KDMP.app.simpan.jadwalkan();
    KDMP.app.navigasi.pergi('Jurnal');
  }

  function render() {
    KDMP.ui.dom.isi(`<div class=bar>${KDMP.ui.kop.isianIdentitas()}</div><div class=bar><button class=p ${klik('paket.ekspor')}>Ekspor paket untuk bendahara (.kdmp.json)</button><button ${klik('backup.unduh')}>Unduh Backup Database (.json)</button><label>Pulihkan backup <input type=file accept=.json ${ubah('backup.pulihkan')}></label><label>Impor paket <input type=file accept=.json ${ubah('paket.impor')}></label><button ${klik('sandi.gantiUnit')}>Ganti sandi</button><button ${klik('sesi.keluar')}>Keluar</button><button ${klik('data.hapusSemua')}>Hapus semua</button></div><p id=ei class=c></p><p class=c>Data tersimpan otomatis di database IndexedDB browser ini (offline, tanpa server). Unduh <b>Backup Database (.json)</b> secara rutin — data akan hilang bila data situs browser dihapus. Klik <b>Simpan data ke file</b> untuk menyimpan salinan ke komputer (pilih folder, mis. Documents atau flashdisk) — lakukan rutin sebagai cadangan. Laporan: <b>Cetak / PDF</b> (pilih printer atau 'Simpan sebagai PDF') dan <b>Excel (CSV)</b>.</p>`);
    KDMP.app.paket.infoEkspor();
    KDMP.ui.dom.tambahDiAkhir(KDMP.app.panelDb.html());
  }

  KDMP.ui.aksi.daftar({ 'data.hapusSemua': () => hapusSemua() });
  KDMP.app.tab['Data'] = { render };
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab BP Aset (buku pembantu aset tetap): Daftar Aset, Jadwal Penyusutan, Rekonsiliasi & Jurnal penyusutan.
 * Hitungan penyusutan ada di KDMP.core.asetTetap.
 */
(function (KDMP) {
  'use strict';
  const { esc, tanggalId, akhirBulan, pad2, NAMA_BULAN } = KDMP.core.format;
  const { klik } = KDMP.ui.aksi;
  const { grid, subTab, rekonsiliasi, barisTotal, selRupiah: nc } = KDMP.ui.grid;
  const { kop, tandaTangan } = KDMP.ui.kop;
  const aset = KDMP.core.asetTetap;
  const KAT = Object.keys(aset.KATEGORI);
  const app = KDMP.app.state;

  const hitung = () => aset.hitungAset(KDMP.app.sub('aset'), +app.data.tahun, KDMP.app.bulan());

  /** Membuat jurnal penyusutan bulan ini (Debit Beban / Kredit Akumulasi), mengganti jurnal DEP bulan itu bila ada. */
  function buatJurnalPenyusutan() {
    const grup = aset.kelompokBeban(hitung());
    if (!Object.keys(grup).length) return alert('Tidak ada beban penyusutan pada bulan ini.');
    const no = 'DEP-' + app.data.tahun + pad2(KDMP.app.bulan());
    const ada = app.data.rows.filter((r) => r.no == no);
    if (ada.length && !confirm('Jurnal penyusutan bulan ini sudah ada (' + ada.length + ' baris) dan akan DIGANTI. Lanjut?')) return;
    app.data.rows = app.data.rows.filter((r) => r.no != no);
    const d = akhirBulan(app.data.tahun, KDMP.app.bulan());
    const ket = 'Penyusutan ' + NAMA_BULAN[KDMP.app.bulan() - 1] + ' ' + app.data.tahun;
    const nama = KDMP.core.coa.nama;
    Object.entries(grup).forEach(([k, v]) => {
      const [b, a] = k.split('|');
      const x = Math.round(v);
      app.data.rows.push({ d, no, ak: b + ' ' + nama(b), db: x, kr: 0, ket });
      app.data.rows.push({ d, no, ak: a + ' ' + nama(a), db: 0, kr: x, ket });
    });
    KDMP.app.simpan.jadwalkan();
    KDMP.app.navigasi.pergi();
    KDMP.ui.pesan.toast('Jurnal penyusutan dibuat (lihat tab Jurnal)');
  }

  function renderDaftar() {
    return grid('aset', [
      { k: 'kode', l: 'Kode Aset', w: 90 }, { k: 'nama', l: 'Nama Aset', w: 220 }, { k: 'kat', l: 'Kategori', o: KAT },
      { k: 'tgl', l: 'Tgl Perolehan', t: 'date' }, { k: 'hp', l: 'Harga Perolehan', t: 'number', m: 1, w: 120 },
      { k: 'res', l: 'Nilai Residu', t: 'number', m: 1, w: 100 }, { k: 'umur', l: 'Umur (tahun)', t: 'number', w: 70 },
      { k: 'met', l: 'Metode', o: ['Garis Lurus', 'Saldo Menurun'] }, { k: 'lepas', l: 'Tgl Lepas (opsional)', t: 'date' }
    ], 'Penyusutan dihitung mulai bulan perolehan. Tanah tidak disusutkan. Saldo Menurun memakai tarif 2 × (1/umur).');
  }

  function renderJadwal() {
    const rs = hitung();
    const T = { cost: 0, bln: 0, ytd: 0, akum: 0, nb: 0 };
    const G = {};
    let h = kop('BUKU PEMBANTU ASET TETAP DAN PENYUSUTAN') + '<table><tr><th>Kode</th><th>Nama Aset</th><th>Kategori</th><th>Tgl Perolehan</th><th>Umur (thn)</th><th>Metode</th><th>Status</th><th>Harga Perolehan</th><th>Beban Bulan Ini</th><th>Beban Tahun Berjalan</th><th>Akumulasi Penyusutan</th><th>Nilai Buku</th></tr>';
    rs.forEach((r) => {
      const a = r.a;
      for (const k in T) T[k] += r[k];
      const g = (G[a.kat || '-'] = G[a.kat || '-'] || { cost: 0, bln: 0, ytd: 0, akum: 0, nb: 0 });
      for (const k in T) g[k] += r[k];
      h += `<tr${r.ak ? '' : ' style="color:#999"'}><td>${esc(a.kode)}</td><td>${esc(a.nama)}</td><td>${esc(a.kat)}</td><td>${tanggalId(a.tgl)}</td><td class=n>${esc(a.umur || '')}</td><td>${esc(a.met || '')}</td><td>${r.st}</td>${nc(r.cost)}${nc(r.bln)}${nc(r.ytd)}${nc(r.akum)}${nc(r.nb)}</tr>`;
    });
    h += barisTotal(`<td colspan=7>JUMLAH</td>${nc(T.cost)}${nc(T.bln)}${nc(T.ytd)}${nc(T.akum)}${nc(T.nb)}`) + '</table><h4>Rekap per Kategori</h4><table><tr><th>Kategori</th><th>Harga Perolehan</th><th>Beban Bulan Ini</th><th>Beban Tahun Berjalan</th><th>Akumulasi Penyusutan</th><th>Nilai Buku</th></tr>';
    Object.keys(G).forEach((k) => { const g = G[k]; h += `<tr><td>${esc(k)}</td>${nc(g.cost)}${nc(g.bln)}${nc(g.ytd)}${nc(g.akum)}${nc(g.nb)}</tr>`; });
    return h + '</table>' + tandaTangan();
  }

  function renderRekon() {
    const { o } = KDMP.fitur.dataUnit();
    const rs = hitung();
    const biaya = {}, akum = {};
    const K = aset.KATEGORI;
    rs.forEach((r) => {
      const c = K[r.a.kat];
      if (!c) return;
      biaya[c[0]] = (biaya[c[0]] || 0) + r.cost;
      if (c[1]) akum[c[1]] = (akum[c[1]] || 0) + r.akum;
    });
    const akunAset = [...new Set(KAT.map((k) => K[k][0]))];
    const akunAkum = [...new Set(KAT.filter((k) => K[k][1]).map((k) => K[k][1]))];
    const baris = (l, m) => l.filter((c) => Math.abs(m[c] || 0) > 0.5 || Math.abs(o.cum[c] || 0) > 0.5).map((c) => [c + ' ' + KDMP.core.coa.nama(c), m[c] || 0, o.cum[c] || 0]);
    return kop('REKONSILIASI ASET TETAP') + rekonsiliasi(baris(akunAset, biaya), 'Harga Perolehan') + rekonsiliasi(baris(akunAkum, akum), 'Akumulasi Penyusutan') +
      `<div class=bar><button class=p ${klik('aset.jurnalPenyusutan')}>Buat jurnal penyusutan bulan ${NAMA_BULAN[KDMP.app.bulan() - 1]}</button><span class=c>Membuat jurnal Debit Beban Penyusutan / Kredit Akumulasi Penyusutan di tab Jurnal (no bukti DEP-${app.data.tahun}${pad2(KDMP.app.bulan())}). Jika dibuat ulang, jurnal lama bulan itu diganti.</span></div>`;
  }

  function render() {
    const [v, bar] = subTab('BP Aset', ['Daftar Aset', 'Jadwal Penyusutan', 'Rekonsiliasi & Jurnal']);
    KDMP.ui.dom.isi(bar + (v == 'Daftar Aset' ? renderDaftar() : v == 'Jadwal Penyusutan' ? renderJadwal() : renderRekon()));
  }

  KDMP.ui.aksi.daftar({ 'aset.jurnalPenyusutan': () => buatJurnalPenyusutan() });
  KDMP.app.tab['BP Aset'] = { render };
})(globalThis.KDMP);

</script>
<script>
/*
 * Tab BP Persediaan (unit yang memakainya: Sembako dan unit tambahan dengan opsi itu): Master Barang, Mutasi Stok, Kartu Stok, Rekap & Rekonsiliasi.
 * Hitungan stok (rata-rata bergerak) ada di KDMP.core.persediaan.
 */
(function (KDMP) {
  'use strict';
  const { esc, tanggalId, akhirBulan, akhirBulanSebelumnya, angkaAman } = KDMP.core.format;
  const { grid, subTab, rekonsiliasi, pilih, barisTotal, selAngka: nq, selRupiah: nc } = KDMP.ui.grid;
  const { kop, tandaTangan } = KDMP.ui.kop;
  const app = KDMP.app.state;

  function hitungStok(batas) {
    return KDMP.core.persediaan.hitungStok(KDMP.app.sub('pb'), KDMP.app.sub('pm'), batas);
  }
  const akhirPeriode = () => akhirBulan(app.data.tahun, KDMP.app.bulan());

  function renderMaster() {
    const akun = KDMP.core.coa.daftar.filter((a) => a[0].startsWith('1.1.4.')).map((a) => [a[0], a[0] + ' ' + a[1]]);
    return grid('pb', [{ k: 'k', l: 'Kode Barang', w: 100 }, { k: 'n', l: 'Nama Barang', w: 260 }, { k: 'akun', l: 'Akun Persediaan (Buku Besar)', o: akun }], 'Tiap barang dikaitkan ke akun persediaan agar bisa direkonsiliasi dengan Buku Besar.');
  }

  const daftarBarang = () => '<datalist id=dlb>' + KDMP.app.sub('pb').filter((x) => x.k).map((x) => `<option value="${esc(x.k)}" label="${esc(x.n)}">`).join('') + '</datalist>';

  function renderMutasi() {
    return grid('pm', [
      { k: 'd', l: 'Tanggal', t: 'date' }, { k: 'no', l: 'No Bukti', w: 110 }, { k: 'k', l: 'Kode Barang', list: 'dlb', w: 110 },
      { k: 'j', l: 'Jenis', o: ['Saldo Awal', 'Masuk', 'Keluar'] }, { k: 'q', l: 'Jumlah', t: 'number', w: 90 },
      { k: 'h', l: 'Harga Satuan (Saldo Awal/Masuk)', t: 'number', w: 130 }, { k: 'ket', l: 'Keterangan', w: 220 }
    ], 'Metode biaya: rata-rata bergerak. Mutasi Keluar dinilai otomatis dari harga rata-rata saat itu; kolom harga tidak dipakai.', 'd');
  }

  function renderKartu() {
    const c = hitungStok(akhirPeriode());
    const r = c.m[app.sel.pk];
    let h = pilih('pk', 'dlb', 'Kode barang') + kop('KARTU STOK');
    if (!r) return h + '<p class=c>Pilih kode barang yang sudah ada di Master Barang.</p>';
    h += `<p><b>${esc(r.it.k)}</b> — ${esc(r.it.n)} · Akun ${esc(r.it.akun || '-')}</p><table><tr><th>Tanggal</th><th>No Bukti</th><th>Keterangan</th><th>Masuk</th><th>Harga Masuk</th><th>Keluar</th><th>HPP Keluar</th><th>Saldo (qty)</th><th>Harga Rata-rata</th><th>Nilai Saldo</th></tr>`;
    r.h.forEach((x) => {
      h += `<tr><td>${tanggalId(x.t.d)}</td><td>${esc(x.t.no)}</td><td>${esc(x.t.j)}${x.t.ket ? ' — ' + esc(x.t.ket) : ''}</td>${x.iq ? nq(x.iq) : '<td class=n>-</td>'}${x.iq ? nc(angkaAman(x.t.h)) : '<td class=n>-</td>'}${x.oq ? nq(x.oq) : '<td class=n>-</td>'}${x.oq ? nc(x.cost) : '<td class=n>-</td>'}${nq(x.q)}${nc(x.q > 0 ? x.v / x.q : 0)}${nc(x.v)}</tr>`;
    });
    return h + '</table>' + tandaTangan();
  }

  function renderRekap() {
    const c = hitungStok(akhirPeriode());
    const p = hitungStok(akhirBulanSebelumnya(+app.data.tahun, KDMP.app.bulan()));
    const { o } = KDMP.fitur.dataUnit();
    const L = Object.values(c.m).sort((a, b) => ((a.it.akun || '') + a.it.k < (b.it.akun || '') + b.it.k ? -1 : 1));
    const A = {};
    let h = kop('REKAP PERSEDIAAN BARANG') + '<table><tr><th>Kode</th><th>Nama Barang</th><th>Saldo Awal Bulan</th><th>Masuk</th><th>Keluar</th><th>Saldo Akhir</th><th>Harga Rata-rata</th><th>Nilai Persediaan</th><th>HPP Keluar Bulan Ini</th></tr>';
    let tv = 0, to = 0;
    const minus = [];
    L.forEach((r) => {
      const a = p.m[r.it.k] || { q: 0 };
      tv += r.v;
      to += r.vout;
      const ak = r.it.akun || '(belum diisi)';
      A[ak] = (A[ak] || 0) + r.v;
      if (r.q < -1e-9) minus.push(r.it.k);
      h += `<tr><td>${esc(r.it.k)}</td><td>${esc(r.it.n)}</td>${nq(a.q)}${nq(r.in)}${nq(r.out)}${nq(r.q)}${nc(r.q > 0 ? r.v / r.q : 0)}${nc(r.v)}${nc(r.vout)}</tr>`;
    });
    h += barisTotal(`<td colspan=7>JUMLAH</td>${nc(tv)}${nc(to)}`) + '</table>';
    if (minus.length) h += `<p class=no>Stok minus pada: ${minus.map(esc).join(', ')} — periksa mutasi Keluar yang melebihi stok.</p>`;
    if (c.tidakDikenal.length) h += `<p class=no>${c.tidakDikenal.length} mutasi memakai kode barang yang tidak ada di Master Barang dan tidak dihitung.</p>`;
    const adaDiBukuBesar = (a) => a[0].startsWith('1.1.4.') && (Math.abs(o.cum[a[0]] || 0) > 0.5 || Math.abs(A[a[0]] || 0) > 0.5);
    return h + rekonsiliasi(KDMP.core.coa.daftar.filter(adaDiBukuBesar).map((a) => [a[0] + ' ' + a[1], A[a[0]] || 0, o.cum[a[0]] || 0])) + tandaTangan();
  }

  function render() {
    const [v, bar] = subTab('BP Persediaan', ['Master Barang', 'Mutasi Stok', 'Kartu Stok', 'Rekap & Rekonsiliasi']);
    let h = bar;
    if (v == 'Master Barang') h += renderMaster();
    else if (v == 'Mutasi Stok') h += daftarBarang() + renderMutasi();
    else if (v == 'Kartu Stok') h += daftarBarang() + renderKartu();
    else h += renderRekap();
    KDMP.ui.dom.isi(h);
  }

  KDMP.app.tab['BP Persediaan'] = { render };
})(globalThis.KDMP);

</script>
<script>
/*
 * Pintu masuk untuk uji otomatis di browser (alat-verifikasi/regresi-browser.js). Tidak dipakai aplikasi sendiri.
 */
(function (KDMP) {
  'use strict';
  const app = KDMP.app.state;

  KDMP.uji = {
    /** Mengisi state aktif dengan data uji lalu menyimpannya. */
    async isiData(d) {
      Object.assign(app.data, { rows: d.rows || app.data.rows, sub: d.sub || app.data.sub, bulan: d.bulan, tahun: d.tahun });
      ['kop', 'alamat', 'kota', 'pet', 'ben', 'ket'].forEach((k) => { if (d[k] !== undefined) app.data[k] = d[k]; });
      document.getElementById('bln').value = d.bulan;
      document.getElementById('thn').value = d.tahun;
      await KDMP.app.simpan.saatIni();
    },
    /** Menampilkan tab (dan sub-tab) lalu mengembalikan HTML + matriks ekspor. */
    tampil(tab, sv) {
      if (sv) app.sv[tab] = sv;
      KDMP.app.navigasi.pergi(tab);
      return { html: document.getElementById('m').innerHTML, mat: KDMP.ui.ekspor.matriks() };
    },
    pilih(kunci, nilai) { app.sel[kunci] = nilai; }
  };
})(globalThis.KDMP);

</script>
<script>
/*
 * Titik masuk: memasang pendengar peristiwa, pintasan keyboard, lalu membuka database dan menampilkan
 * layar setup (pertama kali) atau login.
 */
(function (KDMP) {
  'use strict';
  const { $ } = KDMP.ui.dom;
  const apl = KDMP.config.aplikasi;
  const app = KDMP.app.state;

  async function mulai() {
    $('#nm-koperasi').textContent = apl.namaLengkap;
    $('#lg').src = apl.logo;
    document.getElementById('ttl').textContent = '';
    KDMP.ui.aksi.pasang();

    addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key == 's' || e.key == 'S')) { e.preventDefault(); if (app.data) KDMP.app.simpan.manual(); }
    });
    addEventListener('beforeunload', (e) => { if (KDMP.app.simpan.adaPerubahan()) { e.preventDefault(); e.returnValue = ''; } });

    try {
      KDMP.app.sesi.kotak('<p>Membuka database lokal…</p>');
      await KDMP.storage.kv.open();
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* tidak wajib */ }
      app.kunci.META = await KDMP.storage.kv.get('meta');
      await KDMP.app.unitBaru.muat(); // unit tambahan harus terdaftar sebelum layar login
      window.__ok = 2;
      app.kunci.META ? KDMP.app.sesi.tampilkanLogin() : KDMP.app.sesi.tampilkanSetup();
    } catch (e) {
      window.__err('Gagal membuka database lokal (IndexedDB): ' + ((e && e.message) || e));
    }
  }

  KDMP.app.mulai = mulai;
  mulai();
})(globalThis.KDMP);

</script>
